{% extends "base.html" %}

{% block title %}مسح الباركود{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">مسح الباركود</h3>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-primary" id="startCamera">
                                <i class="fas fa-camera"></i> فتح الكاميرا
                            </button>
                            <button type="button" class="btn btn-secondary" id="uploadImage">
                                <i class="fas fa-upload"></i> رفع صورة
                            </button>
                            <input type="file" id="imageInput" accept="image/*" class="d-none">
                        </div>
                    </div>

                    <div class="scanner-container mb-4">
                        <video id="scanner" class="w-100 d-none"></video>
                        <canvas id="canvas" class="d-none"></canvas>
                        <div id="scanOverlay" class="d-none">
                            <div class="scanner-line"></div>
                        </div>
                    </div>

                    <!-- Manual Barcode Input -->
                    <div class="mb-4">
                        <div class="input-group">
                            <input type="text" class="form-control" id="barcodeInput" 
                                   placeholder="أدخل رقم الباركود يدوياً...">
                            <button class="btn btn-primary" type="button" id="searchBarcode">
                                <i class="fas fa-search"></i> بحث
                            </button>
                        </div>
                    </div>

                    <!-- Results Section -->
                    <div id="results" class="d-none">
                        <h4 class="mb-3">نتائج البحث</h4>
                        <div id="resultsList"></div>
                    </div>

                    <!-- Loading Indicator -->
                    <div id="loading" class="text-center d-none">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">جاري البحث...</span>
                        </div>
                        <p class="mt-2">جاري البحث عن المستند...</p>
                    </div>

                    <!-- Error Messages -->
                    <div id="error" class="alert alert-danger d-none"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let scanner = null;
const video = document.getElementById('scanner');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scanOverlay = document.getElementById('scanOverlay');
const resultsList = document.getElementById('resultsList');
const loading = document.getElementById('loading');
const error = document.getElementById('error');

// Camera handling
document.getElementById('startCamera').addEventListener('click', async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        video.classList.remove('d-none');
        scanOverlay.classList.remove('d-none');
        startScanning();
    } catch (err) {
        showError('لا يمكن الوصول إلى الكاميرا. تأكد من منح الإذن للموقع باستخدام الكاميرا.');
    }
});

// File upload handling
document.getElementById('uploadImage').addEventListener('click', () => {
    document.getElementById('imageInput').click();
});

document.getElementById('imageInput').addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            scanImage(e.target.result);
        };
        reader.readAsDataURL(file);
    }
});

// Manual barcode search
document.getElementById('searchBarcode').addEventListener('click', () => {
    const barcode = document.getElementById('barcodeInput').value.trim();
    if (barcode) {
        searchBarcode(barcode);
    }
});

document.getElementById('barcodeInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        const barcode = e.target.value.trim();
        if (barcode) {
            searchBarcode(barcode);
        }
    }
});

function startScanning() {
    video.play();
    requestAnimationFrame(scan);
}

async function scan() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        const imageData = canvas.toDataURL('image/jpeg');
        
        try {
            const response = await fetch('{{ url_for("scanner.scan") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `image=${encodeURIComponent(imageData)}`
            });
            
            const data = await response.json();
            
            if (data.success) {
                handleResults(data.documents);
                return;
            }
        } catch (err) {
            console.error('Error scanning:', err);
        }
        
        requestAnimationFrame(scan);
    } else {
        requestAnimationFrame(scan);
    }
}

async function scanImage(imageData) {
    showLoading();
    try {
        const response = await fetch('{{ url_for("scanner.scan") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `image=${encodeURIComponent(imageData)}`
        });
        
        const data = await response.json();
        
        if (data.success) {
            handleResults(data.documents);
        } else {
            showError(data.error || 'لم يتم العثور على باركود في الصورة');
        }
    } catch (err) {
        showError('حدث خطأ أثناء معالجة الصورة');
    } finally {
        hideLoading();
    }
}

async function searchBarcode(barcode) {
    showLoading();
    try {
        const response = await fetch(`{{ url_for("scanner.search") }}?barcode=${encodeURIComponent(barcode)}`);
        const data = await response.json();
        
        if (response.ok) {
            handleResults([data]);
        } else {
            showError(data.error || 'لم يتم العثور على مستند بهذا الباركود');
        }
    } catch (err) {
        showError('حدث خطأ أثناء البحث');
    } finally {
        hideLoading();
    }
}

function handleResults(documents) {
    if (documents && documents.length > 0) {
        resultsList.innerHTML = documents.map(doc => `
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">${doc.title}</h5>
                    <p class="card-text">
                        <small class="text-muted">
                            <i class="fas fa-barcode"></i> ${doc.barcode}<br>
                            <i class="fas fa-calendar"></i> ${doc.upload_date}
                        </small>
                    </p>
                    <a href="${doc.url}" class="btn btn-primary">
                        <i class="fas fa-eye"></i> عرض المستند
                    </a>
                </div>
            </div>
        `).join('');
        
        document.getElementById('results').classList.remove('d-none');
        error.classList.add('d-none');
    } else {
        showError('لم يتم العثور على مستندات');
    }
}

function showLoading() {
    loading.classList.remove('d-none');
    error.classList.add('d-none');
    document.getElementById('results').classList.add('d-none');
}

function hideLoading() {
    loading.classList.add('d-none');
}

function showError(message) {
    error.textContent = message;
    error.classList.remove('d-none');
    document.getElementById('results').classList.add('d-none');
}

// Clean up when leaving the page
window.addEventListener('beforeunload', () => {
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
    }
});
</script>

<style>
.scanner-container {
    position: relative;
    max-width: 640px;
    margin: 0 auto;
}

#scanner {
    width: 100%;
    border-radius: 8px;
}

#scanOverlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border: 2px solid var(--bs-primary);
    border-radius: 8px;
}

.scanner-line {
    position: absolute;
    width: 100%;
    height: 2px;
    background-color: var(--bs-danger);
    animation: scan 2s linear infinite;
}

@keyframes scan {
    0% {
        top: 0;
    }
    50% {
        top: 100%;
    }
    100% {
        top: 0;
    }
}
</style>
{% endblock %}
