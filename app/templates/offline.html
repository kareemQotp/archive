<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - نظام إدارة الأرشيف</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    
    <style>
        .offline-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .offline-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        .retry-button {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body p-5">
                            <i class="fas fa-wifi-slash offline-icon"></i>
                            <h1 class="h3 mb-3">أنت غير متصل بالإنترنت</h1>
                            <p class="text-muted">
                                يبدو أنك غير متصل بالإنترنت. تحقق من اتصالك وحاول مرة أخرى.
                            </p>
                            <div class="cached-content mt-4" style="display: none;">
                                <hr>
                                <h2 class="h5 mb-3">المحتوى المتوفر دون اتصال:</h2>
                                <ul class="list-unstyled" id="cached-pages">
                                    <!-- Will be populated by JavaScript -->
                                </ul>
                            </div>
                            <button class="btn btn-primary retry-button" onclick="window.location.reload()">
                                <i class="fas fa-sync-alt"></i>
                                إعادة المحاولة
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check for cached pages
        if ('caches' in window) {
            caches.open('archive-v1').then(cache => {
                cache.keys().then(requests => {
                    if (requests.length > 0) {
                        const cachedContent = document.querySelector('.cached-content');
                        cachedContent.style.display = 'block';
                        
                        const cachedPages = document.getElementById('cached-pages');
                        requests.forEach(request => {
                            const url = new URL(request.url);
                            if (url.pathname !== '/offline.html') {
                                const li = document.createElement('li');
                                li.innerHTML = `
                                    <a href="${url.pathname}" class="text-decoration-none">
                                        <i class="fas fa-file-alt me-2"></i>
                                        ${url.pathname}
                                    </a>
                                `;
                                cachedPages.appendChild(li);
                            }
                        });
                    }
                });
            });
        }

        // Check connection status periodically
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }

        window.addEventListener('online', checkConnection);
        setInterval(checkConnection, 5000);
    </script>
</body>
</html>
