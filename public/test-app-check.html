<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Check Test - اختبار App Check</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .test-container { max-width: 600px; margin: 50px auto; }
        .log-area { background: #f8f9fa; padding: 15px; border-radius: 5px; font-family: monospace; height: 300px; overflow-y: auto; }
        .btn-test { margin: 10px 5px; }
    </style>
</head>
<body>
    <div class="container test-container">
        <div class="card">
            <div class="card-header">
                <h3>App Check & Cloud Functions Test</h3>
                <p class="mb-0">اختبار App Check ووظائف السحابة</p>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <button id="testAuth" class="btn btn-primary btn-test">Test Authentication</button>
                    <button id="testListUsers" class="btn btn-success btn-test">Test List Users</button>
                    <button id="testAppCheck" class="btn btn-info btn-test">Test App Check Status</button>
                    <button id="clearLog" class="btn btn-secondary btn-test">Clear Log</button>
                </div>
                <div id="logArea" class="log-area"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
    
    <!-- App Config and Firebase Init -->
    <script src="/assets/js/app-config.js"></script>
    <script src="/assets/js/firebase-init.js"></script>

    <script>
        let logArea, auth, functions;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const logColor = {
                error: '#dc3545',
                success: '#198754',
                warning: '#fd7e14',
                info: '#0d6efd'
            };
            
            logArea.innerHTML += `<div style="color: ${logColor[type] || '#000'};">[${timestamp}] ${message}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // Wait for Firebase to be ready
        document.addEventListener('firebaseReady', () => {
            auth = firebase.auth();
            functions = firebase.functions('us-central1');
            
            log('✅ Firebase services initialized successfully', 'success');
            log('🔧 App Check Debug Mode: ' + (window.appConfig?.appCheckSiteKey === 'debug' ? 'Enabled' : 'Disabled'), 'info');
            
            // Setup event listeners
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('testAuth').addEventListener('click', testAuthentication);
            document.getElementById('testListUsers').addEventListener('click', testListUsers);
            document.getElementById('testAppCheck').addEventListener('click', testAppCheckStatus);
            document.getElementById('clearLog').addEventListener('click', () => {
                logArea.innerHTML = '';
            });
        }

        async function testAuthentication() {
            try {
                log('🔐 Testing authentication status...', 'info');
                
                if (auth.currentUser) {
                    log(`✅ User authenticated: ${auth.currentUser.email} (${auth.currentUser.uid})`, 'success');
                } else {
                    log('❌ No authenticated user found', 'warning');
                    log('🔄 Attempting anonymous sign-in for testing...', 'info');
                    
                    const result = await auth.signInAnonymously();
                    log(`✅ Anonymous authentication successful: ${result.user.uid}`, 'success');
                }
            } catch (error) {
                log(`❌ Authentication error: ${error.message}`, 'error');
                console.error('Auth error:', error);
            }
        }

        async function testListUsers() {
            try {
                log('📋 Testing listAuthUsersSummary Cloud Function...', 'info');
                
                if (!auth.currentUser) {
                    log('❌ Please authenticate first', 'error');
                    return;
                }

                const listUsers = functions.httpsCallable('listAuthUsersSummary');
                log('🚀 Calling listAuthUsersSummary...', 'info');
                
                const result = await listUsers();
                log('✅ Cloud Function call successful!', 'success');
                log(`📊 Result: ${JSON.stringify(result.data, null, 2)}`, 'info');
                
            } catch (error) {
                log(`❌ Cloud Function error: ${error.message}`, 'error');
                log(`🔍 Error code: ${error.code}`, 'error');
                log(`🔍 Error details: ${JSON.stringify(error.details || {}, null, 2)}`, 'error');
                console.error('Function error:', error);
            }
        }

        function testAppCheckStatus() {
            try {
                log('🛡️ Testing App Check status...', 'info');
                
                if (window.appCheck) {
                    log('✅ App Check instance found', 'success');
                    log('🔧 Debug mode: ' + (window.appConfig?.appCheckSiteKey === 'debug' ? 'Yes' : 'No'), 'info');
                } else {
                    log('❌ App Check instance not found', 'error');
                }
                
                // Test getting token
                if (window.appCheck && firebase.appCheck) {
                    firebase.appCheck().getToken().then(token => {
                        log('✅ App Check token retrieved successfully', 'success');
                        log(`🎫 Token type: ${token ? 'Valid' : 'Invalid'}`, 'info');
                    }).catch(error => {
                        log(`❌ App Check token error: ${error.message}`, 'error');
                    });
                }
                
            } catch (error) {
                log(`❌ App Check test error: ${error.message}`, 'error');
                console.error('App Check error:', error);
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            logArea = document.getElementById('logArea');
            log('🚀 Test page loaded - waiting for Firebase...', 'info');
        });
    </script>
</body>
</html>
