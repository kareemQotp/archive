<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات النظام - نظام الأرشيف</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="assets/js/app-config.js"></script>
    <script src="assets/js/roles.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/analytics.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <!-- تطبيق الألوان الجديدة -->
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        /* System analytics specific styles */

        * {
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            min-height: 100vh;
            margin: 0;
        }

        .main-container {
            margin-right: 300px;
            padding: 2rem;
            transition: margin-right 0.3s ease;
        }

        body.sidebar-closed .main-container {
            margin-right: 0;
        }

        .page-header {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .page-title {
            margin: 0;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0;
        }

        .stat-change {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            margin-top: 0.5rem;
        }

        .stat-change.positive {
            background: rgba(56, 161, 105, 0.1);
            color: var(--success);
        }

        .stat-change.negative {
            background: rgba(229, 62, 62, 0.1);
            color: var(--danger);
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .chart-title {
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .table-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .table-responsive {
            border-radius: 8px;
            overflow: hidden;
        }

        .table {
            margin-bottom: 0;
        }

        .table th {
            background: var(--surface-dark);
            border: none;
            font-weight: 600;
            color: var(--text-primary);
            padding: 1rem;
        }

        .table td {
            border: none;
            padding: 1rem;
            vertical-align: middle;
        }

        .table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background-color 0.2s;
        }

        .table tbody tr:hover {
            background-color: var(--surface-dark);
        }

        .badge {
            font-weight: 500;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
        }

        .filter-controls {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .filter-row {
            display: flex;
            gap: 1rem;
            align-items: end;
            flex-wrap: wrap;
        }

        .form-group {
            min-width: 200px;
        }

        .btn-refresh {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .real-time-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .main-container {
                margin-right: 0;
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .charts-container {
                grid-template-columns: 1fr;
            }

            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            .form-group {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Loading State -->
    <div id="loadingState" class="loading">
        <div class="text-center">
            <div class="spinner-border text-primary mb-3" role="status">
                <span class="visually-hidden">جاري التحميل...</span>
            </div>
            <h4>جاري تحميل الإحصائيات...</h4>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="main-container d-none">
        <!-- Page Header -->
        <div class="page-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="page-title">إحصائيات النظام</h1>
                    <p class="text-muted mb-0">نظرة عامة على أداء واستخدام النظام</p>
                </div>
                <div class="real-time-indicator">
                    <div class="status-dot"></div>
                    <span>تحديث مباشر</span>
                </div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <div class="filter-row">
                <div class="form-group">
                    <label for="dateRange" class="form-label">الفترة الزمنية</label>
                    <select class="form-select" id="dateRange">
                        <option value="1">اليوم الأخير</option>
                        <option value="7" selected>آخر 7 أيام</option>
                        <option value="30">آخر 30 يوماً</option>
                        <option value="90">آخر 3 أشهر</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="userRole" class="form-label">فلترة حسب الدور</label>
                    <select class="form-select" id="userRole">
                        <option value="">جميع الأدوار</option>
                        <option value="admin">مدير النظام</option>
                        <option value="legal">الشؤون القانونية</option>
                        <option value="archive-officer">ضابط الأرشيف</option>
                        <option value="governance">الحوكمة والامتثال</option>
                        <option value="collection">إدارة التحصيل</option>
                        <option value="securitization">إدارة التوريق</option>
                    </select>
                </div>
                <div class="form-group">
                    <button class="btn btn-refresh" id="refreshBtn">
                        <i class="fas fa-sync-alt me-2"></i>
                        تحديث البيانات
                    </button>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid" id="statsContainer">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Charts -->
        <div class="charts-container">
            <!-- Daily Activity Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <h5 class="chart-title">النشاط اليومي</h5>
                    <span class="badge bg-primary">آخر 7 أيام</span>
                </div>
                <div class="chart-container">
                    <canvas id="dailyActivityChart"></canvas>
                </div>
            </div>

            <!-- User Actions Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <h5 class="chart-title">أكثر الإجراءات استخداماً</h5>
                    <span class="badge bg-success">المجموع</span>
                </div>
                <div class="chart-container">
                    <canvas id="userActionsChart"></canvas>
                </div>
            </div>

            <!-- Device Types Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <h5 class="chart-title">أنواع الأجهزة</h5>
                    <span class="badge bg-info">التوزيع</span>
                </div>
                <div class="chart-container">
                    <canvas id="deviceTypesChart"></canvas>
                </div>
            </div>

            <!-- Performance Metrics Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <h5 class="chart-title">مقاييس الأداء</h5>
                    <span class="badge bg-warning">متوسط الأوقات</span>
                </div>
                <div class="chart-container">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Recent Activities Table -->
        <div class="table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">الأنشطة الأخيرة</h5>
                <button class="btn btn-outline-primary btn-sm" id="exportBtn">
                    <i class="fas fa-download me-2"></i>
                    تصدير البيانات
                </button>
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>التوقيت</th>
                            <th>المستخدم</th>
                            <th>النشاط</th>
                            <th>التفاصيل</th>
                            <th>الصفحة</th>
                        </tr>
                    </thead>
                    <tbody id="activitiesTable">
                        <!-- Will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase v10.7.1 - الإصدار الموحد -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    
    <!-- Unified Authentication System -->
    <script src="assets/js/unified-auth.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBn9zLcodNLKWlUPfqsnEGoA1z7QZw_Ezk",
            authDomain: "archive-tech.firebaseapp.com",
            projectId: "archive-tech",
            storageBucket: "archive-tech.firebasestorage.app",
            messagingSenderId: "911076711034",
            appId: "1:911076711034:web:7f190eed397becfe6779c3",
            measurementId: "G-1PQMDXZ714"
        };

        // Firebase initialization will be handled by firebase-init.js
        // Variables will be available globally
        
        // Elements
        const loadingState = document.getElementById('loadingState');
        const mainContent = document.getElementById('mainContent');
        const statsContainer = document.getElementById('statsContainer');
        const activitiesTable = document.getElementById('activitiesTable');
        const dateRangeSelect = document.getElementById('dateRange');
        const userRoleSelect = document.getElementById('userRole');
        const refreshBtn = document.getElementById('refreshBtn');
        const exportBtn = document.getElementById('exportBtn');

        // Charts
        let dailyActivityChart, userActionsChart, deviceTypesChart, performanceChart;

        // Initialize page when Firebase is ready
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // Wait for unified auth system
                await unifiedAuth.waitForAuth();
                
                if (!unifiedAuth.currentUser) {
                    window.location.href = 'login.html';
                    return;
                }

                // Check if user has access to analytics
                const userData = await unifiedAuth.getCurrentUserData();
                const userRole = userData?.role;
                
                if (userRole === 'admin' || hasPermission(userRole, 'view_reports')) {
                    await initializePage();
                    if (window.sidebarManager) {
                        window.sidebarManager.updateSidebarNav(true, userRole);
                    }
                } else {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('خطأ في التحقق من الصلاحيات:', error);
                window.location.href = 'index.html';
            }
        });

        async function initializePage() {
            loadingState.classList.add('d-none');
            mainContent.classList.remove('d-none');
            
            await loadAnalyticsData();
            setupEventListeners();
            startRealTimeUpdates();
        }

        function setupEventListeners() {
            refreshBtn.addEventListener('click', loadAnalyticsData);
            dateRangeSelect.addEventListener('change', loadAnalyticsData);
            userRoleSelect.addEventListener('change', loadAnalyticsData);
            exportBtn.addEventListener('click', exportData);
        }

        async function loadAnalyticsData() {
            try {
                refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>جاري التحديث...';
                refreshBtn.disabled = true;

                const dateRange = parseInt(dateRangeSelect.value);
                const selectedRole = userRoleSelect.value;

                // Generate analytics report
                const report = analytics.generateReport(dateRange);
                
                // Load additional data from Firebase
                const firebaseData = await loadFirebaseAnalytics(dateRange, selectedRole);
                
                // Merge data
                const combinedData = mergeAnalyticsData(report, firebaseData);
                
                // Update UI
                updateStatistics(combinedData);
                updateCharts(combinedData);
                updateActivitiesTable(combinedData.recentActivities);
                
                notify.success('تم التحديث', 'تم تحديث البيانات بنجاح');
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                notify.error('خطأ', 'فشل في تحميل البيانات');
            } finally {
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt me-2"></i>تحديث البيانات';
                refreshBtn.disabled = false;
            }
        }

        async function loadFirebaseAnalytics(dateRange, role) {
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - dateRange);

            // Load users data
            let usersQuery = db.collection('users');
            if (role) {
                usersQuery = usersQuery.where('role', '==', role);
            }
            
            const usersSnapshot = await usersQuery.get();
            const users = usersSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            // Load documents data
            const documentsSnapshot = await db.collection('documents')
                .where('createdAt', '>=', cutoffDate)
                .get();
            const documents = documentsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            // Load file movements data
            const movementsSnapshot = await db.collection('file_movements')
                .where('timestamp', '>=', cutoffDate)
                .get();
            const movements = movementsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            return { users, documents, movements };
        }

        function mergeAnalyticsData(clientData, firebaseData) {
            return {
                ...clientData,
                firebase: firebaseData,
                combined: {
                    totalUsers: firebaseData.users.length,
                    totalDocuments: firebaseData.documents.length,
                    totalMovements: firebaseData.movements.length,
                    activeUsers: firebaseData.users.filter(u => u.lastLogin && 
                        new Date(u.lastLogin.toDate()) > new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)).length
                },
                recentActivities: generateRecentActivities(firebaseData)
            };
        }

        function generateRecentActivities(data) {
            const activities = [];
            
            // Add document activities
            data.documents.slice(0, 10).forEach(doc => {
                activities.push({
                    timestamp: doc.createdAt,
                    user: doc.uploadedBy || 'غير معروف',
                    action: 'رفع وثيقة',
                    details: doc.title || doc.filename,
                    page: 'الوثائق'
                });
            });

            // Add movement activities
            data.movements.slice(0, 10).forEach(movement => {
                activities.push({
                    timestamp: movement.timestamp,
                    user: movement.transferredBy || 'غير معروف',
                    action: 'نقل ملف',
                    details: `من ${movement.fromDepartment} إلى ${movement.toDepartment}`,
                    page: 'تتبع الملفات'
                });
            });

            return activities.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 20);
        }

        function updateStatistics(data) {
            const stats = [
                {
                    title: 'إجمالي المستخدمين',
                    value: data.combined.totalUsers,
                    icon: 'fas fa-users',
                    color: '#3182ce',
                    change: calculateChange(data.combined.totalUsers, data.summary.uniqueUsers)
                },
                {
                    title: 'المستخدمون النشطون',
                    value: data.combined.activeUsers,
                    icon: 'fas fa-user-check',
                    color: '#38a169',
                    change: calculateChange(data.combined.activeUsers, Math.floor(data.summary.uniqueUsers * 0.7))
                },
                {
                    title: 'إجمالي الوثائق',
                    value: data.combined.totalDocuments,
                    icon: 'fas fa-file-alt',
                    color: '#d69e2e',
                    change: calculateChange(data.combined.totalDocuments, data.summary.totalPageViews)
                },
                {
                    title: 'حركات الملفات',
                    value: data.combined.totalMovements,
                    icon: 'fas fa-exchange-alt',
                    color: '#9f7aea',
                    change: calculateChange(data.combined.totalMovements, data.summary.totalEvents)
                },
                {
                    title: 'متوسط وقت الجلسة',
                    value: formatDuration(data.summary.averageSessionDuration),
                    icon: 'fas fa-clock',
                    color: '#ed8936',
                    change: null
                },
                {
                    title: 'معدل الأخطاء',
                    value: data.summary.errorRate.toFixed(1) + '%',
                    icon: 'fas fa-exclamation-triangle',
                    color: '#e53e3e',
                    change: calculateChange(data.summary.errorRate, 5) // مقارنة مع 5% كمرجع
                }
            ];

            statsContainer.innerHTML = stats.map(stat => `
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon" style="background-color: ${stat.color}">
                            <i class="${stat.icon}"></i>
                        </div>
                        ${stat.change !== null ? `
                            <div class="stat-change ${stat.change >= 0 ? 'positive' : 'negative'}">
                                <i class="fas fa-arrow-${stat.change >= 0 ? 'up' : 'down'} me-1"></i>
                                ${Math.abs(stat.change).toFixed(1)}%
                            </div>
                        ` : ''}
                    </div>
                    <h3 class="stat-value">${stat.value}</h3>
                    <p class="stat-label">${stat.title}</p>
                </div>
            `).join('');
        }

        function updateCharts(data) {
            // Update Daily Activity Chart
            updateDailyActivityChart(data.charts.dailyActivity);
            
            // Update User Actions Chart
            updateUserActionsChart(data.charts.topActions);
            
            // Update Device Types Chart
            updateDeviceTypesChart(data.charts.deviceTypes);
            
            // Update Performance Chart
            updatePerformanceChart(data.summary.performanceMetrics);
        }

        function updateDailyActivityChart(data) {
            const ctx = document.getElementById('dailyActivityChart').getContext('2d');
            
            if (dailyActivityChart) {
                dailyActivityChart.destroy();
            }

            dailyActivityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.date).toLocaleDateString('ar-SA')),
                    datasets: [{
                        label: 'الأنشطة اليومية',
                        data: data.map(d => d.count),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateUserActionsChart(data) {
            const ctx = document.getElementById('userActionsChart').getContext('2d');
            
            if (userActionsChart) {
                userActionsChart.destroy();
            }

            userActionsChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.map(d => d.action),
                    datasets: [{
                        data: data.map(d => d.count),
                        backgroundColor: [
                            '#667eea',
                            '#f093fb',
                            '#38a169',
                            '#d69e2e',
                            '#e53e3e'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function updateDeviceTypesChart(data) {
            const ctx = document.getElementById('deviceTypesChart').getContext('2d');
            
            if (deviceTypesChart) {
                deviceTypesChart.destroy();
            }

            deviceTypesChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['سطح المكتب', 'الجوال', 'اللوحي'],
                    datasets: [{
                        label: 'عدد المستخدمين',
                        data: [data.desktop, data.mobile, data.tablet],
                        backgroundColor: ['#3182ce', '#38a169', '#d69e2e']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updatePerformanceChart(data) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            if (performanceChart) {
                performanceChart.destroy();
            }

            if (!data) {
                ctx.fillText('لا توجد بيانات أداء متاحة', 50, 150);
                return;
            }

            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['وقت التحميل', 'جاهزية DOM'],
                    datasets: [{
                        label: 'الوقت (مللي ثانية)',
                        data: [data.averageLoadTime, data.averageDomReady],
                        backgroundColor: ['#9f7aea', '#ed8936']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateActivitiesTable(activities) {
            activitiesTable.innerHTML = activities.map(activity => `
                <tr>
                    <td>${formatDateTime(activity.timestamp)}</td>
                    <td>${activity.user}</td>
                    <td><span class="badge bg-primary">${activity.action}</span></td>
                    <td>${activity.details}</td>
                    <td>${activity.page}</td>
                </tr>
            `).join('');
        }

        function startRealTimeUpdates() {
            // تحديث البيانات كل 30 ثانية
            setInterval(() => {
                if (document.hasFocus()) {
                    loadAnalyticsData();
                }
            }, 30000);
        }

        function exportData() {
            try {
                const report = analytics.generateReport(parseInt(dateRangeSelect.value));
                const csvData = generateCSV(report);
                downloadCSV(csvData, `analytics-${new Date().toISOString().split('T')[0]}.csv`);
                notify.success('تم التصدير', 'تم تصدير البيانات بنجاح');
            } catch (error) {
                console.error('خطأ في التصدير:', error);
                notify.error('خطأ', 'فشل في تصدير البيانات');
            }
        }

        function generateCSV(data) {
            const headers = ['التاريخ', 'الأنشطة', 'المستخدمون', 'مشاهدات الصفحات'];
            const rows = data.charts.dailyActivity.map(day => [
                day.date,
                day.count,
                Math.floor(day.count / 5), // تقدير المستخدمين
                Math.floor(day.count * 1.5) // تقدير مشاهدات الصفحات
            ]);

            return [headers, ...rows].map(row => row.join(',')).join('\n');
        }

        function downloadCSV(csvData, filename) {
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Helper functions
        function calculateChange(current, previous) {
            if (!previous || previous === 0) return 0;
            return ((current - previous) / previous) * 100;
        }

        function formatDuration(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatDateTime(timestamp) {
            const date = timestamp instanceof Date ? timestamp : 
                        timestamp.toDate ? timestamp.toDate() : 
                        new Date(timestamp);
            
            return date.toLocaleString('ar-SA', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Track page view
        if (typeof analytics !== 'undefined') {
            analytics.trackPageView();
        }
    </script>
</body>
</html>
