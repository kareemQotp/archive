            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;

        }

            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
        }

        .btn-outline-primary {
            border: 2px solid #dc3545;
            color: #dc3545;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-outline-primary:hover {
            background: #dc3545;
            border-color: #dc3545;
            transform: translateY(-2px);
        }

        .modal-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .modal-header {

    <script>
        // Initialize unified auth system
        let authSystem;
        let permissionController;
        let currentUser = null;
        let sidebarManager = null;
        // Note: db is available as window.db from firebase-init.js

        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 بدء تهيئة صفحة إدارة المدراء...');
            
            // Wait for Firebase to initialize
            await new Promise(resolve => {
                const checkFirebase = () => {
                    if (window.firebase && firebase.firestore && window.db) {
                        console.log('✅ تم تهيئة Firebase و Firestore');
                        resolve();
                    } else {
                        console.log('⏳ انتظار تهيئة Firebase...');
                        setTimeout(checkFirebase, 100);
                    }
                };
                checkFirebase();
            });

            // Wait for unified auth to initialize
            await new Promise(resolve => {
                const checkAuth = () => {
                    if (window.unifiedAuth && unifiedAuth.isInitialized) {
                        authSystem = unifiedAuth;
                        console.log('✅ تم تهيئة نظام المصادقة الموحد');
                        
                        // Initialize permission controller
                        if (window.UIPermissionController) {

                        loginStatusClass = 'success';
                    } else if (diffDays <= 7) {
                        loginStatusClass = 'warning';
                    } else {
                        loginStatusClass = 'muted';
                    }
                    
                    if (diffDays === 0) {
                        // نفس اليوم - عرض الوقت فقط
                        lastLoginText = `اليوم ${lastLoginDate.toLocaleTimeString('ar-SA', { 
                            hour: '2-digit',

                        lastLoginText = `أمس ${lastLoginDate.toLocaleTimeString('ar-SA', { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: true 
                        })}`;

                        // خلال الأسبوع - عرض اليوم والوقت
                        const dayName = lastLoginDate.toLocaleDateString('ar-SA', { weekday: 'long' });
                        const time = lastLoginDate.toLocaleTimeString('ar-SA', {

        function filterAdmins(searchTerm) {
            if (!window.allAdmins) return;
            
            let filtered = window.allAdmins;
            
            // فلترة حسب الإدارة المختارة
            const selectedDepartment = document.getElementById('departmentFilter').value;
            if (selectedDepartment) {
                filtered = filtered.filter(admin => admin.department === selectedDepartment);
            }
            
            // فلترة حسب نص البحث
            if (searchTerm) {
                filtered = filtered.filter(admin => {
                    const name = (admin.displayName || '').toLowerCase();
                    const email = (admin.email || '').toLowerCase();
                    const phone = (admin.phone || '').toLowerCase();
                    const department = getDepartmentName(admin.department).toLowerCase();
                    const position = (admin.position || '').toLowerCase();
                    const search = searchTerm.toLowerCase();
                    
                    return name.includes(search) || 
                           email.includes(search) || 
                           phone.includes(search) ||
                           department.includes(search) ||
                           position.includes(search);
                });
            }
            
            renderAdmins(filtered);
        }

                    admins = adminsQuery.docs.map(doc => doc.data());

                    console.warn('استخدام البيانات التجريبية للإحصائيات');
                    admins = generateDemoAdmins();
                }
                
                // إذا لم توجد بيانات، استخدم التجريبية
                if (admins.length === 0) {
                    admins = generateDemoAdmins();
                }
                
                const total = admins.length;
                const active = admins.filter(admin => admin.isActive !== false).length;
                const inactive = total - active;
                
                // حساب الدخول خلال الأسبوع مع معلومات أكثر تفصيلاً
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const recentLogins = admins.filter(admin => 
                    admin.lastLogin && admin.lastLogin.toDate() > weekAgo
                ).length;
                
                const todayLogins = admins.filter(admin => 
                    admin.lastLogin && admin.lastLogin.toDate() > today
                ).length;

                document.getElementById('totalAdmins').textContent = total;
                document.getElementById('activeAdmins').textContent = active;
                document.getElementById('inactiveAdmins').textContent = inactive;
                document.getElementById('recentLogins').textContent = recentLogins;

                console.log(`📊 إحصائيات المدراء: ${total} إجمالي، ${active} نشط، ${inactive} غير نشط`);
                console.log(`📊 إحصائيات الدخول: ${todayLogins} اليوم، ${recentLogins} هذا الأسبوع`);

            } catch (error) {
                console.error('خطأ في تحميل الإحصائيات:', error);
                
                // عرض البيانات التجريبية للإحصائيات
                document.getElementById('totalAdmins').textContent = '4';
                document.getElementById('activeAdmins').textContent = '3';
                document.getElementById('inactiveAdmins').textContent = '1';
                document.getElementById('recentLogins').textContent = '2';
            }
        }

                return;
            }

            // التحقق من وجود المستخدم الحالي
            if (!validateCurrentUser()) {
                return;
            }

            const approval = await getSensitiveActionApproval(currentStatus ? 'تعطيل مدير' : 'تفعيل مدير');
            if (!approval) {
                return;
            }

            try {
                await window.db.collection('users').doc(adminId).update({
                    isActive: !currentStatus,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedBy: currentUser.uid,
                    statusChangeReason: approval.reason,
                    sensitiveReauthAt: approval.reauthenticatedAt
                });

                await window.db.collection('audit_logs').add({
                    action: currentStatus ? 'admin_deactivated' : 'admin_activated',
                    targetType: 'user',
                    targetId: adminId,
                    reason: approval.reason,
                    securityReauthAt: approval.reauthenticatedAt,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    performedBy: currentUser.uid
                });

                loadAdmins();
                loadStatistics();
                
            } catch (error) {
                console.error('خطأ في تحديث حالة المدير:', error);

            }

        async function updateAdmin() {
            if (!assertSuperAdminAccess('تحديث مدير')) {
                return;
            }
            const adminId = document.getElementById('editAdminId').value;
            const fullName = document.getElementById('editAdminFullName').value.trim();
            const phone = document.getElementById('editAdminPhone').value.trim();
            const isActive = document.getElementById('editAdminStatus').value === 'true';
            const department = document.getElementById('editAdminDepartment').value;
            const position = document.getElementById('editAdminPosition').value.trim();
            const resetPassword = document.getElementById('resetPassword').checked;
            const newPassword = document.getElementById('editAdminNewPassword').value;

            const permissions = {
                isAdmin: true,
                canManageSystem: document.getElementById('editCanManageSystem').checked,
                canManageUsers: document.getElementById('editCanManageUsers').checked,
                canViewAllDocuments: document.getElementById('editCanViewAllDocuments').checked,
                canManageDocuments: document.getElementById('editCanManageDocuments').checked
            };

            if (!fullName || !department) {
                alert('يرجى ملء الحقول المطلوبة (الاسم الكامل والإدارة)');
                return;
            }

            if (resetPassword && !newPassword) {
                alert('يرجى إدخال كلمة المرور الجديدة');
                return;
            }

            // التحقق من وجود المستخدم الحالي
            if (!validateCurrentUser()) {
                return;
            }

            const approval = await getSensitiveActionApproval('تحديث بيانات مدير');
            if (!approval) {
                return;
            }

            // تأكيد التحديث
            if (!confirm('هل أنت متأكد من تحديث بيانات هذا المدير؟')) {
                return;
            }

            try {
                // تعطيل الزر أثناء التحديث
                const updateBtn = document.querySelector('#editAdminModal .btn-primary');
                const originalText = updateBtn.innerHTML;
                updateBtn.disabled = true;
                updateBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>جاري الحفظ...';

                // تحديث البيانات في Firestore

                    displayName: fullName,
                    phone: phone || null,
                    department: department,
                    position: position || 'مدير',
                    isActive: isActive,
                    permissions: permissions,
                    updateReason: approval.reason,
                    sensitiveReauthAt: approval.reauthenticatedAt,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedBy: currentUser.uid
                };

                await window.db.collection('users').doc(adminId).update(updateData);

                // إعادة تعيين كلمة المرور إذا طُلب ذلك
                if (resetPassword && newPassword) {
                    // ملاحظة: في البيئة الحقيقية، يجب استخدام Firebase Admin SDK
                    // هنا سنضع رسالة للمطور
                    console.warn('تحديث كلمة المرور يتطلب Firebase Admin SDK');
                    
                    // يمكن إضافة طلب لـ Cloud Function هنا
                    try {
                        // إرسال طلب إعادة تعيين كلمة المرور عبر البريد الإلكتروني
                        const email = document.getElementById('editAdminEmail').value;
                        await firebase.auth().sendPasswordResetEmail(email);
                        alert('تم تحديث البيانات وإرسال رابط إعادة تعيين كلمة المرور إلى البريد الإلكتروني');
                    } catch (emailError) {
                        console.error('خطأ في إرسال البريد الإلكتروني:', emailError);
                        alert('تم تحديث البيانات، لكن فشل إرسال رابط إعادة تعيين كلمة المرور');
                    }
                }

                // تسجيل العملية
                await window.db.collection('audit_logs').add({
                    action: 'admin_updated',
                    targetType: 'user',
                    targetId: adminId,
                    details: {
                        displayName: fullName,
                        department: department,
                        position: position || 'مدير',
                        isActive: isActive,
                        permissions: permissions,
                        passwordReset: resetPassword,
                        reason: approval.reason,
                        securityReauthAt: approval.reauthenticatedAt
                    },
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    performedBy: currentUser.uid
                });

                // إغلاق النافذة وإعادة التحميل
                bootstrap.Modal.getInstance(document.getElementById('editAdminModal')).hide();
                loadAdmins();
                loadStatistics();
                
                if (!resetPassword) {
                    alert('تم تحديث بيانات المدير بنجاح');
                }

            } catch (error) {
                console.error('خطأ في تحديث المدير:', error);
                alert('حدث خطأ في تحديث البيانات: ' + error.message);
            } finally {
                // إعادة تفعيل الزر
                const updateBtn = document.querySelector('#editAdminModal .btn-primary');
                updateBtn.disabled = false;
                updateBtn.innerHTML = originalText;
            }

        function translatePermission(key) {
            const translations = {
                isAdmin: 'مدير النظام',
                canManageSystem: 'إدارة النظام',
                canManageUsers: 'إدارة المستخدمين',
                canViewAllDocuments: 'عرض جميع الوثائق',
                canManageDocuments: 'إدارة الوثائق'
            };
            return translations[key] || key;
        }

        /************************************************************
         * ✅ توافق وتحديث 2025-09-11
         * دمج التوجيه المركزي + منع الوصول المبكر + ضمان الصلاحيات
         * - اعتماد أحداث unified auth بدلاً من الاعتماد فقط على polling
         * - منع إنشاء المدراء إلا إذا كان للمستخدم صلاحية canManageUsers أو system_admin
         * - إعادة توجيه أي مستخدم غير مخول إلى الداشبورد الخاص به بدون رسائل إرباك
         ************************************************************/

        let currentUserProfile = null;
        let adminAccessVerified = false;

        function hasAdminPanelAccess(profile) {
            if (!profile) return false;
            const role = String(profile.role || profile.userRole || '').trim().toLowerCase().replace(/\s+/g, '_');
            return role === 'super_admin' || role === 'system_admin';
        }

        function canCreateOrManageUsers(profile) {
            if (!profile) return false;
            return hasAdminPanelAccess(profile);
        }

        function assertSuperAdminAccess(actionLabel) {
            if (!currentUserProfile || !hasAdminPanelAccess(currentUserProfile)) {
                alert(`🚫 ${actionLabel} متاح فقط لـ Super Admin`);
                return false;
            }
            return true;
        }

        function disableAdminCreationUI(reason) {
            const addBtn = document.querySelector('[data-bs-target="#addAdminModal"]');
            if (addBtn) {
                addBtn.disabled = true;
                addBtn.title = reason || 'ليست لديك صلاحية إضافة مدراء';
            }
        }

        function enableAdminCreationUI() {
            const addBtn = document.querySelector('[data-bs-target="#addAdminModal"]');
            if (addBtn) {
                addBtn.disabled = false;
                addBtn.title = '';
            }
        }

        // تغليف createAdmin للتحقق من الصلاحية قبل التنفيذ
        const originalCreateAdmin = createAdmin;
        createAdmin = async function() {
            if (!currentUserProfile || !canCreateOrManageUsers(currentUserProfile)) {
                alert('ليست لديك صلاحية إضافة مدراء');
                return;
            }
            return originalCreateAdmin();
        };

        function markAccessDeniedAndRedirect(profile) {
            console.warn('🚫 منع الوصول لصفحة إدارة المدراء – سيتم تحويل المستخدم', {
                uid: profile && profile.uid,
                role: profile && (profile.role || profile.userRole),
                permissions: profile && profile.permissions
            });
            // استخدام التوجيه المركزي إن توفر
            if (typeof redirectToDashboard === 'function') {
                redirectToDashboard(profile, { fallback: 'dashboard.html', reason: 'admin-management-no-access' });
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        function safelyLoadAdminData() {
            if (adminAccessVerified) {
                loadAdmins();
                loadStatistics();
            }
        }

        function performAdminAccessGate(profile) {
            if (!profile) return; // ننتظر التحديث
            currentUserProfile = profile;
            const access = window.adminFeatureSwitches
                ? window.adminFeatureSwitches.enforceRoleAccess(profile, {
                    allowedRoles: ['super_admin', 'system_admin'],
                    moduleLabel: 'صفحة إدارة المدراء',
                    roleLabel: profile.role || profile.userRole || 'viewer',
                    message: 'هذه الصفحة متاحة لـ Super Admin فقط',
                    redirectTo: 'dashboard.html',
                    redirectDelayMs: 1500
                })
                : Promise.resolve(hasAdminPanelAccess(profile));
            access.then((allowed) => {
                if (!allowed) return;
                adminAccessVerified = true;
                console.log('✅ تم التحقق من صلاحيات المستخدم لصفحة إدارة المدراء');
                if (!canCreateOrManageUsers(profile)) {
                    disableAdminCreationUI('المستخدم لا يملك صلاحية إدارة المستخدمين');
                } else {
                    enableAdminCreationUI();
                }
                safelyLoadAdminData();
            }).catch((error) => {
                console.warn('تعذر التحقق من صلاحيات صفحة المدراء، سيتم التحويل:', error);
                markAccessDeniedAndRedirect(profile);
            });
        }

        // الاستماع لحدث جاهزية المصادقة (Firebase Auth ready)
        document.addEventListener('firebaseAuthReady', () => {
            try {
                if (!window.unifiedAuth || !unifiedAuth.isInitialized) return;
                const profile = unifiedAuth.profile || unifiedAuth.userProfile || null;
                if (profile) performAdminAccessGate(profile);
            } catch (e) { console.debug('firebaseAuthReady handler error', e); }
        });

        // حدث جاهزية نظام المصادقة الموحد ذاته
        window.addEventListener('unifiedAuthReady', () => {
            try {
                if (!window.unifiedAuth) return;
                const profile = unifiedAuth.profile || unifiedAuth.userProfile || null;
                if (profile) performAdminAccessGate(profile);
            } catch (e) { console.debug('unifiedAuthReady handler error', e); }
        });

        // تحديث عند توفر/تحديث الملف الشخصي
        document.addEventListener('userProfileRefreshed', (e) => {
            const profile = (e.detail && e.detail.profile) || (unifiedAuth && (unifiedAuth.profile || unifiedAuth.userProfile));
            performAdminAccessGate(profile);
        });

        // محاولة مبكرة بعد ~1.2 ثانية
        setTimeout(() => {
            if (!adminAccessVerified && window.unifiedAuth && unifiedAuth.isInitialized) {
                try {
                    const profile = unifiedAuth.profile || unifiedAuth.userProfile || null;
                    if (profile) performAdminAccessGate(profile);
                } catch (e) { /* تجاهل */ }
            }
        }, 1200);

        // احتياط نهائي بعد 5 ثوانٍ بدون تحويل قسري إذا لم تتوفر بيانات
        setTimeout(() => {
            if (!adminAccessVerified) {
                const profile = currentUserProfile || (window.unifiedAuth && (unifiedAuth.profile || unifiedAuth.userProfile));
                if (profile) {
                    console.warn('⏱️ محاولة حسم الصلاحيات بعد المهلة – إعادة الفحص');
                    performAdminAccessGate(profile);
                } else {
                    console.warn('⏱️ لم يتم العثور على ملف شخصي بعد 5 ثوانٍ – ترك الصفحة دون تحويل');
                }
            }
        }, 5000);

        // تعريف handleAuthStateChange إن لم يكن موجوداً (توافق مع الشيفرة السابقة)
        if (typeof window.handleAuthStateChange !== 'function') {
            window.handleAuthStateChange = function(user) {
                currentUser = user;
                if (!user) {
                    console.warn('👤 تم تسجيل الخروج – تحويل إلى صفحة الدخول');
                    window.location.href = 'login.html?message=auth-required';
                    return;
                }
                console.log('👤 مستخدم سجل الدخول:', user.uid);
            };
        }

        // ربط مستمع لحالة المصادقة لضمان التحديث عند أي تغيير
        if (window.unifiedAuth && typeof unifiedAuth.onAuthStateChanged === 'function') {
            unifiedAuth.onAuthStateChanged((state, user) => {
                // دعم صيغتين محتملتين للاستدعاء
                if (typeof state === 'string') {
                    if (state === 'login') {
                        const profile = unifiedAuth.profile || unifiedAuth.userProfile || null;
                        if (profile) performAdminAccessGate(profile);
                    }
                } else {
                    const profile = unifiedAuth.profile || unifiedAuth.userProfile || null;
                    if (profile) performAdminAccessGate(profile);
                }
            });
        }

        console.log('🔁 تم تحميل طبقة التوافق والتوجيه الموحد لصفحة إدارة المدراء (v2 profile binding)');
    </script>
