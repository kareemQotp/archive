        /* Admin management specific styles */

        .main-content {
            margin-right: 280px;

            font-weight: 800;
            font-size: 2.5rem;

        .admin-card:hover {

        }

        .admin-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc3545 0%, #667eea 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .admin-status {
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.2);
        }

        .status-inactive {
            background: rgba(220, 53, 69, 0.1);

            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #dc3545 0%, #667eea 100%);
            border: none;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
        }

        .btn-outline-primary {
            border: 2px solid #dc3545;
            color: #dc3545;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-outline-primary:hover {
            background: #dc3545;
            border-color: #dc3545;
            transform: translateY(-2px);
        }

        .modal-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            background: linear-gradient(135deg, #dc3545 0%, #667eea 100%);
            color: white;
            border-radius: 20px 20px 0 0;
            border-bottom: none;
        }

        .form-control {
            border: 2px solid #e2e8f0;

            padding: 0.75rem;

        .form-control:focus {

    <!-- Unified Authentication System -->

    <script>
        // Initialize unified auth system
        let authSystem;
        let permissionController;
        let currentUser = null;
        let sidebarManager = null;

        document.addEventListener('DOMContentLoaded', async function() {
            // Wait for unified auth to initialize
            await new Promise(resolve => {
                const checkAuth = () => {
                    if (window.unifiedAuth && unifiedAuth.isInitialized) {
                        authSystem = unifiedAuth;
                        // Initialize permission controller
                        permissionController = new UIPermissionController(authSystem);
                        resolve();
                    } else {
                        setTimeout(checkAuth, 100);
                    }
                };
                checkAuth();
            });

            // Initialize sidebar
            sidebarManager = new SidebarManager();
            
            // Set up auth state listener
            authSystem.onAuthStateChanged(function(user) {
                handleAuthStateChange(user);
            });

            // Initialize search functionality
            document.getElementById('searchAdmins').addEventListener('input', function() {
                filterAdmins(this.value);
            });

            // Password reset checkbox
            document.getElementById('resetPassword').addEventListener('change', function() {
                const passwordSection = document.getElementById('passwordResetSection');
                if (this.checked) {
                    passwordSection.classList.remove('d-none-custom');
                } else {

        async function handleAuthStateChange(user) {
            if (user) {
                currentUser = user;
                
                // Check admin permissions first
                if (!authSystem.hasPermission('admin-management')) {
                    window.location.href = 'index.html?message=permission-denied';
                    return;
                }
                
                // Update permission-based UI
                if (permissionController) {
                    permissionController.updateUI();
                }
                
                // Load page content
                await updateLastLogin(user.uid);
                loadAdmins();
                loadStatistics();
            } else {
                window.location.href = 'login.html?message=session-expired';
            }
        }

                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {

        async function loadAdmins() {
            const container = document.getElementById('adminsContainer');
            
            try {
                container.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">جاري تحميل قائمة المدراء...</p>
                    </div>
                `;

                // استعلام بدون ترتيب لتجنب مشكلة الفهرس
                const adminsQuery = await db.collection('users')
                    .where('role', '==', 'admin')
                    .get();

                if (adminsQuery.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <i class="fas fa-users-slash"></i>
                            </div>
                            <h5>لا يوجد مدراء</h5>
                            <p>لم يتم العثور على أي مدراء في النظام</p>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAdminModal">
                                <i class="fas fa-user-plus me-2"></i>
                                إضافة مدير جديد
                            </button>
                        </div>
                    `;
                    return;
                }

                const admins = [];
                adminsQuery.forEach(doc => {
                    admins.push({ id: doc.id, ...doc.data() });
                });

                // ترتيب البيانات محلياً حسب تاريخ الإنشاء
                admins.sort((a, b) => {
                    if (a.createdAt && b.createdAt) {
                        return b.createdAt.toDate() - a.createdAt.toDate();
                    } else if (a.createdAt) {
                        return -1;
                    } else if (b.createdAt) {
                        return 1;
                    }
                    return 0;
                });

                renderAdmins(admins);
                window.allAdmins = admins; // للبحث

            } catch (error) {
                console.error('خطأ في تحميل المدراء:', error);
                
                let errorMessage = 'خطأ في تحميل البيانات';
                
                if (error.code === 'failed-precondition' || error.message.includes('index')) {
                    errorMessage = 'يتطلب النظام إعداد فهرس قاعدة البيانات. يرجى المحاولة مرة أخرى.';
                } else if (error.code === 'permission-denied') {
                    errorMessage = 'ليس لديك صلاحية للوصول لهذه البيانات';
                } else if (error.code === 'unavailable') {
                    errorMessage = 'الخدمة غير متاحة حالياً. يرجى المحاولة لاحقاً.';
                }
                
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>خطأ:</strong> ${errorMessage}
                        <br><small class="text-muted mt-2 d-block">تفاصيل تقنية: ${error.message}</small>
                        <button class="btn btn-outline-danger btn-sm mt-2" onclick="loadAdmins()">
                            <i class="fas fa-redo me-1"></i> إعادة المحاولة
                        </button>
                    </div>
                `;
            }
        }

        function renderAdmins(admins) {
            const container = document.getElementById('adminsContainer');
            
            if (admins.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <h5>لا توجد نتائج</h5>
                        <p>لم يتم العثور على مدراء مطابقين للبحث</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = admins.map(admin => {
                const initials = admin.displayName ? admin.displayName.split(' ').map(n => n[0]).join('').toUpperCase() : 'A';
                const isActive = admin.isActive !== false;
                
                // تحسين عرض آخر دخول مع التاريخ والوقت
                let lastLoginText = 'لم يسجل دخول';
                let loginStatusClass = 'muted';
                if (admin.lastLogin) {
                    const lastLoginDate = new Date(admin.lastLogin.toDate());
                    const today = new Date();
                    const diffTime = today - lastLoginDate;
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    
                    // تحديد لون النص حسب المدة
                    if (diffDays <= 1) {
                        loginStatusClass = 'success';
                    } else if (diffDays <= 7) {
                        loginStatusClass = 'warning';
                    } else {
                        loginStatusClass = 'muted';
                    }
                    
                    if (diffDays === 0) {
                        // نفس اليوم - عرض الوقت فقط
                        lastLoginText = `اليوم ${lastLoginDate.toLocaleTimeString('ar-SA', { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: true 
                        })}`;
                    } else if (diffDays === 1) {
                        // أمس
                        lastLoginText = `أمس ${lastLoginDate.toLocaleTimeString('ar-SA', { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: true 
                        })}`;
                    } else if (diffDays < 7) {
                        // خلال الأسبوع - عرض اليوم والوقت
                        const dayName = lastLoginDate.toLocaleDateString('ar-SA', { weekday: 'long' });
                        const time = lastLoginDate.toLocaleTimeString('ar-SA', { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: true 
                        });
                        lastLoginText = `${dayName} ${time}`;
                    } else {
                        // أكثر من أسبوع - عرض التاريخ والوقت
                        const date = lastLoginDate.toLocaleDateString('ar-SA');
                        const time = lastLoginDate.toLocaleTimeString('ar-SA', { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: true 
                        });
                        lastLoginText = `${date} ${time}`;
                    }
                }
                
                const departmentName = getDepartmentName(admin.department);
                const position = admin.position || 'مدير';

                return `
                    <div class="admin-card">
                        <div class="row align-items-center">
                            <div class="col-md-2">
                                <div class="admin-avatar">
                                    ${initials}
                                </div>
                            </div>
                            <div class="col-md-3">
                                <h6 class="mb-1">${admin.displayName || 'غير محدد'}</h6>
                                <p class="text-muted mb-1">${admin.email}</p>
                                <small class="text-muted">${admin.phone || 'لا يوجد رقم هاتف'}</small>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-1">
                                    <small class="text-muted">الإدارة:</small><br>
                                    <span class="fw-bold">${departmentName}</span>
                                </div>
                                <div>
                                    <small class="text-muted">المنصب:</small><br>
                                    <span class="text-primary">${position}</span>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <span class="admin-status ${isActive ? 'status-active' : 'status-inactive'}">
                                    <i class="fas fa-${isActive ? 'check-circle' : 'times-circle'} me-1"></i>
                                    ${isActive ? 'نشط' : 'غير نشط'}
                                </span>
                            </div>
                            <div class="col-md-2">
                                <div class="text-center">
                                    <small class="text-muted d-block">
                                        <i class="fas fa-clock me-1"></i>آخر دخول:
                                    </small>
                                    <span class="fw-bold text-${loginStatusClass}" style="font-size: 0.85rem;">
                                        ${lastLoginText}
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-1 text-end">
                                <div class="dropdown">
                                    <button class="btn btn-outline-primary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                                        <i class="fas fa-cog"></i>
                                    </button>
                                    <ul class="dropdown-menu">
                                        <li><a class="dropdown-item" href="#" onclick="editAdmin('${admin.id}')">
                                            <i class="fas fa-edit me-2"></i>تعديل
                                        </a></li>
                                        <li><a class="dropdown-item" href="#" onclick="toggleAdminStatus('${admin.id}', ${isActive})">
                                            <i class="fas fa-${isActive ? 'ban' : 'check'} me-2"></i>
                                            ${isActive ? 'تعطيل' : 'تفعيل'}
                                        </a></li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li><a class="dropdown-item text-danger" href="#" onclick="deleteAdmin('${admin.id}')">
                                            <i class="fas fa-trash me-2"></i>حذف
                                        </a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        ${admin.permissions ? `
                            <div class="admin-permissions mt-2">
                                ${Object.entries(admin.permissions).filter(([key, value]) => value === true).map(([key]) => 
                                    `<span class="permission-badge">${translatePermission(key)}</span>`
                                ).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function filterAdmins(searchTerm) {
            if (!window.allAdmins) return;
            
            let filtered = window.allAdmins;
            
            // فلترة حسب الإدارة المختارة
            const selectedDepartment = document.getElementById('departmentFilter').value;
            if (selectedDepartment) {
                filtered = filtered.filter(admin => admin.department === selectedDepartment);
            }
            
            // فلترة حسب نص البحث
            if (searchTerm) {
                filtered = filtered.filter(admin => {
                    const name = (admin.displayName || '').toLowerCase();
                    const email = (admin.email || '').toLowerCase();
                    const phone = (admin.phone || '').toLowerCase();
                    const department = getDepartmentName(admin.department).toLowerCase();
                    const position = (admin.position || '').toLowerCase();
                    const search = searchTerm.toLowerCase();
                    
                    return name.includes(search) || 
                           email.includes(search) || 
                           phone.includes(search) ||
                           department.includes(search) ||
                           position.includes(search);
                });
            }
            
            renderAdmins(filtered);
        }

        async function loadStatistics() {
            try {
                const adminsQuery = await db.collection('users').where('role', '==', 'admin').get();
                const admins = adminsQuery.docs.map(doc => doc.data());
                
                const total = admins.length;
                const active = admins.filter(admin => admin.isActive !== false).length;
                const inactive = total - active;
                
                // حساب الدخول خلال الأسبوع مع معلومات أكثر تفصيلاً
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const recentLogins = admins.filter(admin => 
                    admin.lastLogin && admin.lastLogin.toDate() > weekAgo
                ).length;
                
                const todayLogins = admins.filter(admin => 
                    admin.lastLogin && admin.lastLogin.toDate() > today
                ).length;

                document.getElementById('totalAdmins').textContent = total;
                document.getElementById('activeAdmins').textContent = active;
                document.getElementById('inactiveAdmins').textContent = inactive;
                document.getElementById('recentLogins').textContent = recentLogins;

                // إضافة معلومات إضافية للإحصائيات
                const recentLoginsElement = document.getElementById('recentLogins');
                if (recentLoginsElement) {
                    recentLoginsElement.setAttribute('title', 
                        `${todayLogins} دخل اليوم، ${recentLogins} دخل هذا الأسبوع`
                    );
                }

                // إحصائيات إضافية حسب الإدارة
                const departmentStats = {};
                admins.forEach(admin => {
                    if (admin.department) {
                        if (!departmentStats[admin.department]) {
                            departmentStats[admin.department] = 0;
                        }
                        departmentStats[admin.department]++;
                    }
                });

                console.log('إحصائيات الإدارات:', departmentStats);
                console.log(`إحصائيات الدخول: ${todayLogins} اليوم، ${recentLogins} هذا الأسبوع`);

            } catch (error) {
                console.error('خطأ في تحميل الإحصائيات:', error);
            }
        }

        async function createAdmin() {
            const fullName = document.getElementById('adminFullName').value.trim();
            const email = document.getElementById('adminEmail').value.trim();
            const phone = document.getElementById('adminPhone').value.trim();
            const password = document.getElementById('adminPassword').value;
            const department = document.getElementById('adminDepartment').value;
            const position = document.getElementById('adminPosition').value.trim();
            
            const permissions = {
                isAdmin: true,
                canManageSystem: document.getElementById('canManageSystem').checked,
                canManageUsers: document.getElementById('canManageUsers').checked,
                canViewAllDocuments: document.getElementById('canViewAllDocuments').checked,
                canManageDocuments: document.getElementById('canManageDocuments').checked
            };

            if (!fullName || !email || !password || !department) {
                alert('يرجى ملء جميع الحقول المطلوبة (الاسم، البريد الإلكتروني، كلمة المرور، والإدارة)');
                return;
            }

            try {
                // إنشاء الحساب (يجب استخدام Firebase Admin SDK في الإنتاج)
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // تحديث الملف الشخصي
                await user.updateProfile({
                    displayName: fullName
                });

                // حفظ بيانات المدير
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: email,
                    displayName: fullName,
                    phone: phone || null,
                    department: department,
                    position: position || 'مدير',
                    role: 'admin',
                    isActive: true,
                    permissions: permissions,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdBy: currentUser.uid
                });

                // تسجيل العملية
                await db.collection('audit_logs').add({
                    action: 'admin_created',
                    targetType: 'user',
                    targetId: user.uid,
                    details: {
                        email: email,
                        displayName: fullName,
                        department: department,
                        position: position || 'مدير',
                        role: 'admin',
                        permissions: permissions
                    },
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    performedBy: currentUser.uid
                });

                // إغلاق النافذة وإعادة التحميل
                bootstrap.Modal.getInstance(document.getElementById('addAdminModal')).hide();
                document.getElementById('addAdminForm').reset();
                loadAdmins();
                loadStatistics();
                
                alert('تم إنشاء حساب المدير بنجاح');

            } catch (error) {
                console.error('خطأ في إنشاء المدير:', error);
                alert('حدث خطأ في إنشاء الحساب: ' + error.message);
            }
        }

        async function toggleAdminStatus(adminId, currentStatus) {
            if (!confirm(`هل أنت متأكد من ${currentStatus ? 'تعطيل' : 'تفعيل'} هذا المدير؟`)) {
                return;
            }

            try {
                await db.collection('users').doc(adminId).update({
                    isActive: !currentStatus,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedBy: currentUser.uid
                });

                // تسجيل العملية
                await db.collection('audit_logs').add({
                    action: currentStatus ? 'admin_deactivated' : 'admin_activated',
                    targetType: 'user',
                    targetId: adminId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    performedBy: currentUser.uid
                });

                loadAdmins();
                loadStatistics();
                
            } catch (error) {
                console.error('خطأ في تحديث حالة المدير:', error);
                alert('حدث خطأ في تحديث الحالة');
            }
        }

        async function deleteAdmin(adminId) {
            if (adminId === currentUser.uid) {
                alert('لا يمكنك حذف حسابك الخاص');
                return;
            }

            if (!confirm('هل أنت متأكد من حذف هذا المدير؟ هذا الإجراء لا يمكن التراجع عنه.')) {
                return;
            }

            try {
                await db.collection('users').doc(adminId).delete();

                // تسجيل العملية
                await db.collection('audit_logs').add({
                    action: 'admin_deleted',
                    targetType: 'user',
                    targetId: adminId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    performedBy: currentUser.uid
                });

                loadAdmins();
                loadStatistics();
                
            } catch (error) {
                console.error('خطأ في حذف المدير:', error);
                alert('حدث خطأ في حذف المدير');
            }
        }

        async function editAdmin(adminId) {
            try {
                // تحميل بيانات المدير
                const adminDoc = await db.collection('users').doc(adminId).get();
                if (!adminDoc.exists) {
                    alert('لم يتم العثور على المدير');
                    return;
                }

                const adminData = adminDoc.data();

                // ملء النموذج بالبيانات الحالية
                document.getElementById('editAdminId').value = adminId;
                document.getElementById('editAdminFullName').value = adminData.displayName || '';
                document.getElementById('editAdminEmail').value = adminData.email || '';
                document.getElementById('editAdminPhone').value = adminData.phone || '';
                document.getElementById('editAdminStatus').value = adminData.isActive !== false ? 'true' : 'false';
                document.getElementById('editAdminDepartment').value = adminData.department || '';
                document.getElementById('editAdminPosition').value = adminData.position || '';

                // ملء الصلاحيات
                const permissions = adminData.permissions || {};
                document.getElementById('editCanManageSystem').checked = permissions.canManageSystem || false;
                document.getElementById('editCanManageUsers').checked = permissions.canManageUsers || false;
                document.getElementById('editCanViewAllDocuments').checked = permissions.canViewAllDocuments || false;
                document.getElementById('editCanManageDocuments').checked = permissions.canManageDocuments || false;

                // إعادة تعيين خيارات كلمة المرور
                document.getElementById('resetPassword').checked = false;
                document.getElementById('passwordResetSection').classList.add('d-none-custom');
                document.getElementById('editAdminNewPassword').value = '';

                // فتح النافذة
                const modal = new bootstrap.Modal(document.getElementById('editAdminModal'));
                modal.show();

            } catch (error) {
                console.error('خطأ في تحميل بيانات المدير:', error);
                alert('حدث خطأ في تحميل البيانات');
            }
        }

        async function updateAdmin() {
            const adminId = document.getElementById('editAdminId').value;
            const fullName = document.getElementById('editAdminFullName').value.trim();
            const phone = document.getElementById('editAdminPhone').value.trim();
            const isActive = document.getElementById('editAdminStatus').value === 'true';
            const department = document.getElementById('editAdminDepartment').value;
            const position = document.getElementById('editAdminPosition').value.trim();
            const resetPassword = document.getElementById('resetPassword').checked;
            const newPassword = document.getElementById('editAdminNewPassword').value;

            const permissions = {
                isAdmin: true,
                canManageSystem: document.getElementById('editCanManageSystem').checked,
                canManageUsers: document.getElementById('editCanManageUsers').checked,
                canViewAllDocuments: document.getElementById('editCanViewAllDocuments').checked,
                canManageDocuments: document.getElementById('editCanManageDocuments').checked
            };

            if (!fullName || !department) {
                alert('يرجى ملء الحقول المطلوبة (الاسم الكامل والإدارة)');
                return;
            }

            if (resetPassword && !newPassword) {
                alert('يرجى إدخال كلمة المرور الجديدة');
                return;
            }

            // تأكيد التحديث
            if (!confirm('هل أنت متأكد من تحديث بيانات هذا المدير؟')) {
                return;
            }

            try {
                // تعطيل الزر أثناء التحديث
                const updateBtn = document.querySelector('#editAdminModal .btn-primary');
                const originalText = updateBtn.innerHTML;
                updateBtn.disabled = true;
                updateBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>جاري الحفظ...';

                // تحديث البيانات في Firestore
                const updateData = {
                    displayName: fullName,
                    phone: phone || null,
                    department: department,
                    position: position || 'مدير',
                    isActive: isActive,
                    permissions: permissions,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedBy: currentUser.uid
                };

                await db.collection('users').doc(adminId).update(updateData);

                // إعادة تعيين كلمة المرور إذا طُلب ذلك
                if (resetPassword && newPassword) {
                    // ملاحظة: في البيئة الحقيقية، يجب استخدام Firebase Admin SDK
                    // هنا سنضع رسالة للمطور
                    console.warn('تحديث كلمة المرور يتطلب Firebase Admin SDK');
                    
                    // يمكن إضافة طلب لـ Cloud Function هنا
                    try {
                        // إرسال طلب إعادة تعيين كلمة المرور عبر البريد الإلكتروني
                        const email = document.getElementById('editAdminEmail').value;
                        await auth.sendPasswordResetEmail(email);
                        alert('تم تحديث البيانات وإرسال رابط إعادة تعيين كلمة المرور إلى البريد الإلكتروني');
                    } catch (emailError) {
                        console.error('خطأ في إرسال البريد الإلكتروني:', emailError);
                        alert('تم تحديث البيانات، لكن فشل إرسال رابط إعادة تعيين كلمة المرور');
                    }
                }

                // تسجيل العملية
                await db.collection('audit_logs').add({
                    action: 'admin_updated',
                    targetType: 'user',
                    targetId: adminId,
                    details: {
                        displayName: fullName,
                        department: department,
                        position: position || 'مدير',
                        isActive: isActive,
                        permissions: permissions,
                        passwordReset: resetPassword
                    },
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    performedBy: currentUser.uid
                });

                // إغلاق النافذة وإعادة التحميل
                bootstrap.Modal.getInstance(document.getElementById('editAdminModal')).hide();
                loadAdmins();
                loadStatistics();
                
                if (!resetPassword) {
                    alert('تم تحديث بيانات المدير بنجاح');
                }

            } catch (error) {
                console.error('خطأ في تحديث المدير:', error);
                alert('حدث خطأ في تحديث البيانات: ' + error.message);
            } finally {
                // إعادة تفعيل الزر
                const updateBtn = document.querySelector('#editAdminModal .btn-primary');
                updateBtn.disabled = false;
                updateBtn.innerHTML = originalText;
            }
        }

        function translatePermission(key) {
            const translations = {
                isAdmin: 'مدير النظام',
                canManageSystem: 'إدارة النظام',
                canManageUsers: 'إدارة المستخدمين',
                canViewAllDocuments: 'عرض جميع الوثائق',
                canManageDocuments: 'إدارة الوثائق'
            };
            return translations[key] || key;
        }
    </script>
</body>
</html>
