<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تم رفض الوصول</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { background: #f5f7fb; min-height: 100vh; display:flex; align-items:center; }
    .card { max-width: 740px; margin: 24px auto; box-shadow: 0 10px 30px rgba(0,0,0,.06); border: 0; border-radius: 16px; }
    .card .icon { width: 64px; height: 64px; background: #fee2e2; color: #dc2626; display:flex; align-items:center; justify-content:center; border-radius: 12px; font-size: 28px; }
    .muted { color: #6b7280; }
    #details { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4 p-md-5">
      <div class="d-flex align-items-center gap-3 mb-3">
        <div class="icon"><i class="fas fa-ban"></i></div>
        <div>
          <h3 class="mb-0">تم رفض الوصول</h3>
          <div class="muted">ليست لديك صلاحية لفتح هذه الصفحة.</div>
        </div>
      </div>

  <div class="mb-3" id="details"></div>

      <div class="d-flex flex-wrap gap-2">
        <a href="index.html" class="btn btn-primary">
          <i class="fas fa-home ms-1"></i>
          الصفحة الرئيسية
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-right ms-1"></i>
          رجوع
        </a>
      </div>
    </div>
  </div>

  <script>
    // قراءة سبب التحويل وإظهار تفاصيل مفيدة للمسؤول
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const from = params.get('from');
        const page = params.get('page');
        const el = document.getElementById('details');
        const show = from || page;
        if (show) {
          el.style.display = 'block';
          el.className = 'alert alert-light border';
          el.dir = 'ltr';
          el.textContent = `blocked page: ${page || '-'} | from: ${decodeURIComponent(from || '-')}`;
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
