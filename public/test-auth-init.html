<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تهيئة Firebase Auth</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px;
            background: #f5f5f5;
        }
        .log { 
            background: white; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        .error { border-left-color: #dc3545; }
        .success { border-left-color: #28a745; }
        .warning { border-left-color: #ffc107; }
    </style>
    <script defer src="assets/js/format-utils.js"></script>
    <script defer src="assets/js/ux-core.js"></script>
</head>
<body>
    <a href="#mainContent" class="skip-link visually-hidden-focusable">تخطي إلى المحتوى الرئيسي</a>
    <h1>اختبار تهيئة Firebase Auth</h1>
    <div id="logs"></div>

    <!-- Firebase v10.7.1 -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Firebase Configuration -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    <script src="assets/js/unified-auth.js"></script>

    <script>
        const logsDiv = document.getElementById('logs');
        
        function addLog(message, type = 'log') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            logsDiv.appendChild(div);
            console.log(message);
        }

        // Override console methods to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            addLog(args.join(' '), 'log');
            originalLog.apply(console, args);
        };

        console.error = function(...args) {
            addLog(args.join(' '), 'error');
            originalError.apply(console, args);
        };

        console.warn = function(...args) {
            addLog(args.join(' '), 'warning');
            originalWarn.apply(console, args);
        };

        // Test Firebase Auth initialization
        window.addEventListener('firebaseAuthReady', () => {
            addLog('✅ firebaseAuthReady event received!', 'success');
        });

        window.addEventListener('firebaseReady', () => {
            addLog('✅ firebaseReady event received!', 'success');
        });

        window.addEventListener('unifiedAuthReady', () => {
            addLog('✅ unifiedAuthReady event received!', 'success');
        });

        // Check window.auth periodically
        let checkCount = 0;
        const checkAuth = () => {
            checkCount++;
            if (window.auth) {
                addLog(`✅ window.auth available after ${checkCount} checks`, 'success');
                return;
            }
            if (checkCount < 30) {
                setTimeout(checkAuth, 100);
            } else {
                addLog('❌ window.auth not available after 30 checks', 'error');
            }
        };
        
        setTimeout(checkAuth, 100);
    </script>
</body>
</html>
