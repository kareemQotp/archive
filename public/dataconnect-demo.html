<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Firebase Data Connect</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
        }
        .demo-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-card {
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .status-badge {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 15px;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .warning { background-color: #fff3cd; color: #856404; }
        .loading { background-color: #e2e3e5; color: #495057; }
        .code-block {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .btn-test {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1 class="text-center mb-4">
            <i class="fas fa-database"></i>
            اختبار Firebase Data Connect
        </h1>

        <!-- حالة النظام -->
        <div class="card test-card">
            <div class="card-header">
                <h5><i class="fas fa-heartbeat"></i> حالة النظام</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <div class="status-item">
                            <span>Firebase:</span>
                            <span id="firebase-status" class="status-badge loading">جاري التحقق...</span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="status-item">
                            <span>Auth:</span>
                            <span id="auth-status" class="status-badge loading">جاري التحقق...</span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="status-item">
                            <span>Data Connect:</span>
                            <span id="dataconnect-status" class="status-badge loading">جاري التحقق...</span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="status-item">
                            <span>Integration:</span>
                            <span id="integration-status" class="status-badge loading">جاري التحقق...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- المستخدم الحالي -->
        <div class="card test-card">
            <div class="card-header">
                <h5><i class="fas fa-user"></i> المستخدم الحالي</h5>
            </div>
            <div class="card-body">
                <div id="current-user-info">
                    <p class="text-muted">لا يوجد مستخدم مسجل دخول</p>
                </div>
                <button class="btn btn-primary btn-test" onclick="testLogin()">
                    <i class="fas fa-sign-in-alt"></i> تسجيل دخول تجريبي
                </button>
                <button class="btn btn-secondary btn-test" onclick="testLogout()">
                    <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                </button>
            </div>
        </div>

        <!-- اختبارات Data Connect -->
        <div class="card test-card">
            <div class="card-header">
                <h5><i class="fas fa-database"></i> اختبارات Data Connect</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6>اختبارات القراءة:</h6>
                        <button class="btn btn-info btn-test" onclick="testGetUserProfile()">
                            <i class="fas fa-user-circle"></i> ملف المستخدم
                        </button>
                        <button class="btn btn-info btn-test" onclick="testGetDepartments()">
                            <i class="fas fa-building"></i> الأقسام
                        </button>
                        <button class="btn btn-info btn-test" onclick="testGetFiles()">
                            <i class="fas fa-file"></i> الملفات
                        </button>
                        <button class="btn btn-info btn-test" onclick="testGetNotifications()">
                            <i class="fas fa-bell"></i> الإشعارات
                        </button>
                    </div>
                    <div class="col-md-6">
                        <h6>اختبارات الكتابة:</h6>
                        <button class="btn btn-success btn-test" onclick="testCreateActivity()">
                            <i class="fas fa-plus"></i> إنشاء نشاط
                        </button>
                        <button class="btn btn-success btn-test" onclick="testUpdateProfile()">
                            <i class="fas fa-edit"></i> تحديث الملف
                        </button>
                        <button class="btn btn-success btn-test" onclick="testSearchFiles()">
                            <i class="fas fa-search"></i> البحث في الملفات
                        </button>
                        <button class="btn btn-warning btn-test" onclick="clearResults()">
                            <i class="fas fa-trash"></i> مسح النتائج
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- النتائج -->
        <div class="card test-card">
            <div class="card-header">
                <h5><i class="fas fa-list"></i> النتائج</h5>
            </div>
            <div class="card-body">
                <div id="test-results">
                    <p class="text-muted">لا توجد نتائج بعد...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Archive Scripts -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    <script src="assets/js/unified-auth.js"></script>
    <script src="assets/js/dataconnect-sdk.js"></script>
    <script src="assets/js/dataconnect-integration.js"></script>

    <script>
        let testResults = [];

        // إضافة نتيجة اختبار
        function addTestResult(test, status, data, error = null) {
            const timestamp = new Date().toLocaleString('ar-EG');
            const result = {
                test,
                status,
                data,
                error,
                timestamp
            };
            
            testResults.unshift(result);
            updateResultsDisplay();
        }

        // تحديث عرض النتائج
        function updateResultsDisplay() {
            const container = document.getElementById('test-results');
            
            if (testResults.length === 0) {
                container.innerHTML = '<p class="text-muted">لا توجد نتائج بعد...</p>';
                return;
            }

            let html = '';
            testResults.forEach((result, index) => {
                const statusClass = result.status === 'success' ? 'success' : 'error';
                html += `
                    <div class="test-result mb-3 p-3 border rounded">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0">${result.test}</h6>
                            <small class="text-muted">${result.timestamp}</small>
                        </div>
                        <span class="status-badge ${statusClass}">${result.status === 'success' ? 'نجح' : 'فشل'}</span>
                        
                        ${result.data ? `
                            <div class="code-block">
                                <strong>البيانات:</strong><br>
                                ${JSON.stringify(result.data, null, 2)}
                            </div>
                        ` : ''}
                        
                        ${result.error ? `
                            <div class="code-block error">
                                <strong>الخطأ:</strong><br>
                                ${result.error}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // مسح النتائج
        function clearResults() {
            testResults = [];
            updateResultsDisplay();
        }

        // فحص حالة النظام
        async function checkSystemStatus() {
            // Firebase
            const firebaseStatus = document.getElementById('firebase-status');
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                firebaseStatus.textContent = 'متصل';
                firebaseStatus.className = 'status-badge success';
            } else {
                firebaseStatus.textContent = 'غير متصل';
                firebaseStatus.className = 'status-badge error';
            }

            // Auth - فحص أكثر تفصيلاً
            const authStatus = document.getElementById('auth-status');
            
            // فحص window.auth أولاً
            if (typeof window.auth !== 'undefined' && window.auth) {
                authStatus.textContent = 'جاهز';
                authStatus.className = 'status-badge success';
                console.log('✅ Firebase Auth جاهز مباشرة');
            } 
            // ثم فحص unified auth
            else if (typeof window.unifiedAuth !== 'undefined' && window.unifiedAuth.isInitialized) {
                authStatus.textContent = 'جاهز (موحد)';
                authStatus.className = 'status-badge success';
                console.log('✅ Unified Auth جاهز');
            } 
            // في حالة التحميل
            else if (typeof window.unifiedAuth !== 'undefined' && !window.unifiedAuth.isInitialized) {
                authStatus.textContent = 'قيد التهيئة...';
                authStatus.className = 'status-badge warning';
                console.log('⏳ Unified Auth قيد التهيئة...');
            }
            // غير متوفر
            else {
                authStatus.textContent = 'غير جاهز';
                authStatus.className = 'status-badge error';
                console.log('❌ Auth غير متوفر');
            }

            // Data Connect
            const dataConnectStatus = document.getElementById('dataconnect-status');
            if (typeof window.archiveDataConnect !== 'undefined' && window.archiveDataConnect.isInitialized) {
                dataConnectStatus.textContent = 'متصل (محاكاة)';
                dataConnectStatus.className = 'status-badge success';
            } else if (typeof window.archiveDataConnect !== 'undefined') {
                dataConnectStatus.textContent = 'قيد التهيئة...';
                dataConnectStatus.className = 'status-badge warning';
            } else {
                dataConnectStatus.textContent = 'غير متصل';
                dataConnectStatus.className = 'status-badge error';
            }

            // Integration
            const integrationStatus = document.getElementById('integration-status');
            if (typeof window.authIntegration !== 'undefined' && window.authIntegration.isIntegrationReady()) {
                integrationStatus.textContent = 'متكامل';
                integrationStatus.className = 'status-badge success';
            } else {
                integrationStatus.textContent = 'غير متكامل';
                integrationStatus.className = 'status-badge error';
            }
        }

        // تحديث معلومات المستخدم
        function updateUserInfo() {
            const container = document.getElementById('current-user-info');
            const user = window.getCurrentUserWithDataConnect();
            
            if (user) {
                container.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <strong>البريد الإلكتروني:</strong> ${user.email}<br>
                            <strong>الاسم:</strong> ${user.displayName || 'غير محدد'}<br>
                            <strong>الدور:</strong> ${user.profile?.role || 'غير محدد'}
                        </div>
                        <div class="col-md-6">
                            <strong>القسم:</strong> ${user.profile?.department || 'غير محدد'}<br>
                            <strong>مفعل:</strong> ${user.profile?.isActive ? 'نعم' : 'لا'}<br>
                            <strong>آخر دخول:</strong> ${user.profile?.lastLogin || 'غير محدد'}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = '<p class="text-muted">لا يوجد مستخدم مسجل دخول</p>';
            }
        }

        // اختبارات المصادقة
        async function testLogin() {
            try {
                await window.unifiedAuth.signIn('admin@aman.eg', 'admin123');
                addTestResult('تسجيل دخول تجريبي', 'success', { email: 'admin@aman.eg' });
            } catch (error) {
                addTestResult('تسجيل دخول تجريبي', 'error', null, error.message);
            }
        }

        async function testLogout() {
            try {
                await window.unifiedAuth.signOut();
                addTestResult('تسجيل خروج', 'success', {});
            } catch (error) {
                addTestResult('تسجيل خروج', 'error', null, error.message);
            }
        }

        // اختبارات Data Connect
        async function testGetUserProfile() {
            try {
                const user = window.getCurrentUserWithDataConnect();
                if (!user) {
                    throw new Error('لا يوجد مستخدم مسجل دخول');
                }

                const profile = await window.archiveDataConnect.getUserProfile(user.uid);
                addTestResult('جلب ملف المستخدم', 'success', profile);
            } catch (error) {
                addTestResult('جلب ملف المستخدم', 'error', null, error.message);
            }
        }

        async function testGetDepartments() {
            try {
                const departments = await window.archiveDataConnect.getAllDepartments();
                addTestResult('جلب الأقسام', 'success', departments);
            } catch (error) {
                addTestResult('جلب الأقسام', 'error', null, error.message);
            }
        }

        async function testGetFiles() {
            try {
                const files = await window.archiveDataConnect.getFilesByDepartment('legal', 10);
                addTestResult('جلب الملفات', 'success', files);
            } catch (error) {
                addTestResult('جلب الملفات', 'error', null, error.message);
            }
        }

        async function testGetNotifications() {
            try {
                const notifications = await window.DataConnectNotificationHelpers.getUserNotifications(true);
                addTestResult('جلب الإشعارات', 'success', notifications);
            } catch (error) {
                addTestResult('جلب الإشعارات', 'error', null, error.message);
            }
        }

        async function testCreateActivity() {
            try {
                const activity = await window.archiveDataConnect.logActivity({
                    action: 'TEST',
                    entityType: 'SYSTEM',
                    entityId: 'demo-test',
                    details: 'اختبار إنشاء نشاط من الـ Demo',
                    severity: 'INFO'
                });
                addTestResult('إنشاء نشاط', 'success', activity);
            } catch (error) {
                addTestResult('إنشاء نشاط', 'error', null, error.message);
            }
        }

        async function testUpdateProfile() {
            try {
                const profile = await window.archiveDataConnect.updateUserProfile({
                    displayName: 'مستخدم تجريبي',
                    phoneNumber: '01234567890'
                });
                addTestResult('تحديث الملف الشخصي', 'success', profile);
            } catch (error) {
                addTestResult('تحديث الملف الشخصي', 'error', null, error.message);
            }
        }

        async function testSearchFiles() {
            try {
                const results = await window.DataConnectFileHelpers.searchFiles('test', {
                    category: 'DOCUMENT',
                    limit: 5
                });
                addTestResult('البحث في الملفات', 'success', results);
            } catch (error) {
                addTestResult('البحث في الملفات', 'error', null, error.message);
            }
        }

        // الأحداث
        window.addEventListener('dataConnectReady', () => {
            console.log('🚀 Data Connect جاهز!');
            checkSystemStatus();
        });

        window.addEventListener('userAuthenticated', (event) => {
            console.log('👤 المستخدم سجل دخول:', event.detail);
            updateUserInfo();
            checkSystemStatus();
        });

        window.addEventListener('userSignedOut', () => {
            console.log('👋 المستخدم سجل خروج');
            updateUserInfo();
            checkSystemStatus();
        });

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🔄 DOM محمل، بانتظار تهيئة Firebase...');
            
            // انتظار تهيئة جميع المكونات
            setTimeout(() => {
                console.log('🔍 فحص حالة النظام...');
                checkSystemStatus();
                updateUserInfo();
            }, 3000); // زيادة وقت الانتظار

            // فحص دوري للحالة
            setInterval(() => {
                checkSystemStatus();
                updateUserInfo();
            }, 10000); // تقليل التكرار
        });
    </script>
</body>
</html>
