<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار سريع لنظام الإشعارات</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .test-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
        }
        
        .status-ok { background: #28a745; }
        .status-error { background: #dc3545; }
        .status-warning { background: #ffc107; }
        
        .test-result {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        
        .navbar-test {
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        
        .action-btn {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
    <script defer src="assets/js/format-utils.js"></script>
    <script defer src="assets/js/ux-core.js"></script>
    <link rel="stylesheet" href="assets/css/archive-design-system.css">
</head>
<body>
    <a href="#mainContent" class="skip-link visually-hidden-focusable">تخطي إلى المحتوى الرئيسي</a>
    <!-- شريط التنقل التجريبي -->
    <div class="navbar-test">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">نظام الأرشيف</h5>
            <div class="d-flex align-items-center">
                <span class="me-3">مرحباً، مدير النظام</span>
                <!-- أيقونة الإشعارات -->
                <div id="notification-container"></div>
            </div>
        </div>
    </div>

    <div class="container" id="mainContent" role="main" tabindex="-1">
        <div class="test-card">
            <h2 class="text-center mb-4">
                <i class="bi bi-bell-fill text-primary"></i>
                اختبار سريع لنظام الإشعارات
            </h2>
            
            <!-- حالة الاتصال -->
            <div class="test-result">
                <h5>حالة الاتصال</h5>
                <div id="connection-status">
                    <span class="status-indicator status-warning"></span>
                    جاري فحص الاتصال...
                </div>
            </div>
            
            <!-- حالة المكونات -->
            <div class="test-result">
                <h5>حالة المكونات</h5>
                <div id="components-status">
                    <div>Firebase SDK: <span id="firebase-status">جاري الفحص...</span></div>
                    <div>نظام الأشعارات: <span id="notification-status">جاري الفحص...</span></div>
                    <div>أيقونة الإشعارات: <span id="badge-status">جاري الفحص...</span></div>
                </div>
            </div>
            
            <!-- الإجراءات السريعة -->
            <div class="quick-actions">
                <button class="btn action-btn" onclick="testCreateNotification()">
                    <i class="bi bi-plus-circle"></i> إنشاء إشعار تجريبي
                </button>
                <button class="btn action-btn" onclick="testBatchNotifications()">
                    <i class="bi bi-collection"></i> إشعارات متعددة
                </button>
                <button class="btn action-btn" onclick="testSystemAlert()">
                    <i class="bi bi-exclamation-triangle"></i> تنبيه نظام
                </button>
                <button class="btn action-btn" onclick="clearAllNotifications()">
                    <i class="bi bi-trash"></i> مسح الإشعارات
                </button>
            </div>
            
            <!-- نتائج الاختبار -->
            <div class="test-result">
                <h5>نتائج الاختبار</h5>
                <div id="test-results">
                    <div class="text-muted">سيتم عرض نتائج الاختبارات هنا...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBILxwMOLGSaE_FWKaPdGF6LFtLvTgYqSk",
            authDomain: "tech-arc-9af9c.firebaseapp.com",
            projectId: "tech-arc-9af9c",
            storageBucket: "tech-arc-9af9c.firebasestorage.app",
            messagingSenderId: "635163313263",
            appId: "1:635163313263:web:c82de8bc5cdc9f2a8fc0c9",
            measurementId: "G-FS6KW2W7SX"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // جعل Firebase متاحًا عالميًا
        window.firebase = { app, db, auth };
        window.db = db;
        window.auth = auth;

        console.log('Firebase تم تهيئته بنجاح');
        updateStatus('firebase-status', 'متصل', 'ok');
        updateConnectionStatus(true);
        
        // تحديث حالة المكونات بعد تحميل Firebase
        setTimeout(checkComponentsStatus, 1000);
    </script>

    <!-- تحميل مكونات النظام -->
    <script src="assets/js/auth-constants.js"></script>
    <script src="assets/js/unified-auth.js"></script>
    <script src="assets/js/notification-service.js"></script>
    <script src="assets/js/notification-badge.js"></script>
    <script src="assets/js/smart-notifications.js"></script>

    <script>
        let testResults = [];
        
        function updateStatus(elementId, status, type) {
            const element = document.getElementById(elementId);
            if (element) {
                element.innerHTML = `<span class="status-indicator status-${type}"></span> ${status}`;
            }
        }
        
        function updateConnectionStatus(connected) {
            const element = document.getElementById('connection-status');
            if (connected) {
                element.innerHTML = '<span class="status-indicator status-ok"></span> متصل بـ Firebase';
            } else {
                element.innerHTML = '<span class="status-indicator status-error"></span> غير متصل';
            }
        }
        
        function addTestResult(message, success = true) {
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            testResults.push({
                message,
                success,
                timestamp
            });
            
            updateTestResultsDisplay();
        }
        
        function updateTestResultsDisplay() {
            const container = document.getElementById('test-results');
            if (testResults.length === 0) {
                container.innerHTML = '<div class="text-muted">سيتم عرض نتائج الاختبارات هنا...</div>';
                return;
            }
            
            let html = '';
            testResults.slice(-10).forEach(result => {
                const icon = result.success ? 'bi-check-circle text-success' : 'bi-x-circle text-danger';
                html += `<div class="mb-2">
                    <i class="${icon}"></i>
                    <span class="ms-2">${result.message}</span>
                    <small class="text-muted ms-2">(${result.timestamp})</small>
                </div>`;
            });
            
            container.innerHTML = html;
        }
        
        function checkComponentsStatus() {
            // فحص وجود خدمة الإشعارات
            if (window.notificationService) {
                updateStatus('notification-status', 'جاهز', 'ok');
            } else {
                updateStatus('notification-status', 'غير متاح', 'error');
            }
            
            // فحص وجود أيقونة الإشعارات
            if (window.notificationBadge) {
                updateStatus('badge-status', 'جاهز', 'ok');
                
                // تهيئة أيقونة الإشعارات
                window.notificationBadge.init('notification-container');
                addTestResult('تم تهيئة أيقونة الإشعارات بنجاح');
            } else {
                updateStatus('badge-status', 'غير متاح', 'error');
            }
        }
        
        // اختبار إنشاء إشعار تجريبي
        async function testCreateNotification() {
            try {
                if (window.notificationService) {
                    await window.notificationService.sendNotification({
                        recipientId: 'test-user', // إضافة recipientId
                        type: 'file_upload',
                        title: 'اختبار النظام',
                        message: 'تم إنشاء إشعار تجريبي بنجاح',
                        data: {
                            fileName: 'test-file.pdf',
                            testMode: true
                        }
                    });
                    addTestResult('تم إنشاء إشعار تجريبي بنجاح');
                } else {
                    addTestResult('خدمة الإشعارات غير متاحة', false);
                }
            } catch (error) {
                addTestResult(`خطأ في إنشاء الإشعار: ${error.message}`, false);
            }
        }
        
        // اختبار إشعارات متعددة
        async function testBatchNotifications() {
            try {
                if (window.notificationService) {
                    const userIds = ['test-user', 'user-2', 'user-3']; // إضافة قائمة المستخدمين
                    const notifications = [
                        { title: 'إشعار 1', message: 'رسالة الإشعار الأول' },
                        { title: 'إشعار 2', message: 'رسالة الإشعار الثاني' },
                        { title: 'إشعار 3', message: 'رسالة الإشعار الثالث' }
                    ];
                    
                    await window.notificationService.sendBulkNotification(
                        userIds, // قائمة المستخدمين
                        'file_movement', 
                        notifications
                    );
                    addTestResult('تم إنشاء 3 إشعارات متعددة بنجاح');
                } else {
                    addTestResult('خدمة الإشعارات غير متاحة', false);
                }
            } catch (error) {
                addTestResult(`خطأ في الإشعارات المتعددة: ${error.message}`, false);
            }
        }
        
        // اختبار تنبيه النظام
        async function testSystemAlert() {
            try {
                if (window.notificationService) {
                    await window.notificationService.sendSystemNotification({
                        type: 'system_alert',
                        title: 'تنبيه أمني',
                        message: 'تم اكتشاف محاولة دخول مشبوهة للنظام',
                        priority: 'high'
                    });
                    addTestResult('تم إرسال تنبيه النظام بنجاح');
                } else {
                    addTestResult('خدمة الإشعارات غير متاحة', false);
                }
            } catch (error) {
                addTestResult(`خطأ في تنبيه النظام: ${error.message}`, false);
            }
        }
        
        // مسح جميع الإشعارات
        async function clearAllNotifications() {
            try {
                if (window.notificationBadge) {
                    // محاكاة مسح الإشعارات
                    const badge = document.querySelector('.notification-badge .badge');
                    if (badge) {
                        badge.textContent = '0';
                        badge.style.display = 'none';
                    }
                    addTestResult('تم مسح جميع الإشعارات');
                } else {
                    addTestResult('نظام الإشعارات غير متاح', false);
                }
            } catch (error) {
                addTestResult(`خطأ في مسح الإشعارات: ${error.message}`, false);
            }
        }
        
        // فحص المكونات عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            // انتظار تحميل المكونات
            setTimeout(checkComponentsStatus, 2000);
        });
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
