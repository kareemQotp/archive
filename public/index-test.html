<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار إصلاحات النظام</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Arial', sans-serif; direction: rtl; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .test-pass { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .test-fail { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>اختبار إصلاحات النظام</h1>
        <div id="testResults"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    <script src="assets/js/app-config.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/unified-auth.js"></script>

    <script>
        const testResults = document.getElementById('testResults');

        function addTestResult(testName, passed, details = '') {
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'test-pass' : 'test-fail'}`;
            div.innerHTML = `
                <strong>${testName}:</strong> ${passed ? '✅ نجح' : '❌ فشل'}
                ${details ? `<br><small>${details}</small>` : ''}
            `;
            testResults.appendChild(div);
        }

        // Test 1: AppUtils availability
        setTimeout(() => {
            addTestResult(
                'تحميل AppUtils',
                typeof AppUtils !== 'undefined',
                typeof AppUtils !== 'undefined' ? 'AppUtils متاح' : 'AppUtils غير متاح'
            );
        }, 500);

        // Test 2: Notification Manager initialization
        setTimeout(() => {
            addTestResult(
                'مدير الإشعارات',
                typeof notificationManager !== 'undefined',
                typeof notificationManager !== 'undefined' ? 'تم تهيئة مدير الإشعارات' : 'فشل في تهيئة مدير الإشعارات'
            );
        }, 1000);

        // Test 3: Unified Auth initialization
        setTimeout(() => {
            addTestResult(
                'نظام المصادقة الموحد',
                typeof unifiedAuth !== 'undefined' && unifiedAuth.isInitialized,
                'نظام المصادقة ' + (unifiedAuth?.isInitialized ? 'جاهز' : 'غير جاهز')
            );
        }, 1500);

        // Test 3.5: Wait for complete auth initialization
        setTimeout(() => {
            if (typeof unifiedAuth !== 'undefined' && !unifiedAuth.isInitialized) {
                // Try again after more time
                setTimeout(() => {
                    addTestResult(
                        'إعادة فحص المصادقة الموحدة',
                        unifiedAuth.isInitialized,
                        'المحاولة الثانية: ' + (unifiedAuth.isInitialized ? 'نجحت' : 'فشلت')
                    );
                }, 1000);
            }
        }, 2000);

        // Test 4: getCurrentUserRole method
        setTimeout(() => {
            let hasMethod = false;
            let details = '';
            
            if (typeof unifiedAuth === 'undefined') {
                details = 'unifiedAuth غير متاح';
            } else if (!unifiedAuth.isInitialized) {
                details = 'unifiedAuth غير مهيأ بالكامل';
            } else if (typeof unifiedAuth.getCurrentUserRole !== 'function') {
                details = 'الوظيفة غير موجودة في unifiedAuth';
            } else {
                hasMethod = true;
                try {
                    const role = unifiedAuth.getCurrentUserRole();
                    details = `الوظيفة متاحة وتعيد: ${role}`;
                } catch (e) {
                    details = `الوظيفة متاحة لكن فشل في التنفيذ: ${e.message}`;
                }
            }
            
            addTestResult(
                'وظيفة getCurrentUserRole',
                hasMethod,
                details
            );

            // Debug: List all available methods
            if (typeof unifiedAuth !== 'undefined') {
                const methods = Object.getOwnPropertyNames(Object.getPrototypeOf(unifiedAuth))
                    .filter(name => typeof unifiedAuth[name] === 'function' && name !== 'constructor');
                addTestResult(
                    'وظائف متاحة في unifiedAuth',
                    methods.length > 0,
                    `الوظائف المتاحة: ${methods.slice(0, 10).join(', ')}${methods.length > 10 ? '...' : ''}`
                );
            }
        }, 3500);

        // Test 5: Console error check
        let errorCount = 0;
        const originalError = console.error;
        console.error = function(...args) {
            errorCount++;
            originalError.apply(console, args);
        };

        setTimeout(() => {
            addTestResult(
                'أخطاء وحدة التحكم',
                errorCount === 0,
                `عدد الأخطاء: ${errorCount}`
            );
        }, 3000);

        // Final comprehensive test
        setTimeout(() => {
            let allTestsPassed = true;
            let summary = [];

            // Check AppUtils
            if (typeof AppUtils === 'undefined') {
                allTestsPassed = false;
                summary.push('AppUtils مفقود');
            }

            // Check NotificationManager
            if (typeof notificationManager === 'undefined') {
                allTestsPassed = false;
                summary.push('مدير الإشعارات مفقود');
            }

            // Check UnifiedAuth
            if (typeof unifiedAuth === 'undefined' || !unifiedAuth.isInitialized) {
                allTestsPassed = false;
                summary.push('نظام المصادقة غير جاهز');
            }

            // Check getCurrentUserRole
            if (unifiedAuth && typeof unifiedAuth.getCurrentUserRole !== 'function') {
                allTestsPassed = false;
                summary.push('وظيفة getCurrentUserRole مفقودة');
            }

            addTestResult(
                'اختبار شامل نهائي',
                allTestsPassed,
                allTestsPassed ? 'جميع المكونات تعمل بشكل صحيح' : 'مشاكل: ' + summary.join(', ')
            );
        }, 4000);
    </script>
</body>
</html>
