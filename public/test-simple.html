<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار بسيط</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">اختبار الصفحة</h5>
                    </div>
                    <div class="card-body">
                        <h6>مرحباً! هذه صفحة اختبار بسيطة</h6>
                        <p>إذا كنت ترى هذا النص، فإن الخادم يعمل بشكل صحيح.</p>
                        <button class="btn btn-success" onclick="testAlert()">اختبار JavaScript</button>
                        <div id="status" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function testAlert() {
            alert('JavaScript يعمل بشكل صحيح!');
            document.getElementById('status').innerHTML = '<div class="alert alert-success">JavaScript يعمل بشكل صحيح!</div>';
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('status').innerHTML = '<div class="alert alert-info">تم تحميل الصفحة بنجاح</div>';
        });
    </script>
</body>
</html>
