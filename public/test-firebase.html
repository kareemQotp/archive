<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Firebase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">اختبار تحميل Firebase</h5>
                    </div>
                    <div class="card-body">
                        <div id="loading-status">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">جاري التحميل...</span>
                            </div>
                            <span class="ms-2">جاري تحميل Firebase...</span>
                        </div>
                        <div id="firebase-status" class="mt-3"></div>
                        <div id="auth-status" class="mt-2"></div>
                        <div id="firestore-status" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>

    <!-- App Scripts -->
    <script src="assets/js/firebase-config.js"></script>

    <script>
        function updateStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const alertClass = `alert alert-${type}`;
            element.innerHTML = `<div class="${alertClass}">${message}</div>`;
        }

        function initializeFirebase() {
            try {
                console.log('🔥 بدء تهيئة Firebase...');
                document.getElementById('loading-status').style.display = 'none';
                
                // Initialize Firebase
                if (typeof firebaseConfig !== 'undefined') {
                    firebase.initializeApp(firebaseConfig);
                    updateStatus('firebase-status', '✅ تم تهيئة Firebase بنجاح', 'success');
                    console.log('✅ Firebase initialized');
                } else {
                    updateStatus('firebase-status', '❌ لم يتم العثور على إعدادات Firebase', 'danger');
                    return;
                }

                // Test Auth
                try {
                    const auth = firebase.auth();
                    updateStatus('auth-status', '✅ تم تحميل Firebase Auth', 'success');
                    console.log('✅ Auth loaded');
                } catch (authError) {
                    updateStatus('auth-status', '❌ خطأ في تحميل Auth: ' + authError.message, 'danger');
                    console.error('Auth error:', authError);
                }

                // Test Firestore
                try {
                    const db = firebase.firestore();
                    updateStatus('firestore-status', '✅ تم تحميل Firestore', 'success');
                    console.log('✅ Firestore loaded');
                } catch (firestoreError) {
                    updateStatus('firestore-status', '❌ خطأ في تحميل Firestore: ' + firestoreError.message, 'danger');
                    console.error('Firestore error:', firestoreError);
                }

            } catch (error) {
                updateStatus('firebase-status', '❌ خطأ عام في Firebase: ' + error.message, 'danger');
                console.error('Firebase initialization error:', error);
            }
        }

        // Wait for all scripts to load
        window.addEventListener('load', function() {
            console.log('📄 تم تحميل جميع النصوص');
            setTimeout(initializeFirebase, 100);
        });

        // Fallback if window.load doesn't fire
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM تم تحميله');
            setTimeout(() => {
                if (document.getElementById('firebase-status').innerHTML === '') {
                    initializeFirebase();
                }
            }, 1000);
        });
    </script>
</body>
</html>
