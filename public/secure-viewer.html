<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        :root {
            --viewer-bg: #0f172a;
            --viewer-panel: #111827;
            --viewer-text: #e5e7eb;
            --viewer-muted: #94a3b8;
            --accent: #22c55e;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at top right, #1e293b, #020617 60%);
            color: var(--viewer-text);
            font-family: "Cairo", "Tajawal", sans-serif;
            min-height: 100vh;
        }
        .viewer-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .viewer-header {
            background: rgba(2, 6, 23, 0.86);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .viewer-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            font-size: 0.9rem;
        }
        .meta-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .meta-label { color: var(--viewer-muted); display: block; font-size: 0.78rem; }
        .viewer-body {
            flex: 1;
            position: relative;
            padding: 12px;
            overflow: hidden;
        }
        .doc-stage {
            width: 100%;
            height: calc(100vh - 210px);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: #0b1220;
            position: relative;
        }
        .doc-frame, .doc-image {
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: contain;
            background: #0b1220;
            pointer-events: auto;
        }
        .doc-watermark-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            opacity: 0.2;
            background-size: 320px 220px;
        }
        .status-box {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 10px;
            padding: 14px;
            margin: 12px;
        }
        .guard-note {
            color: #fcd34d;
            font-size: 0.84rem;
            margin-top: 8px;
        }
        @media (max-width: 768px) {
            .doc-stage { height: calc(100vh - 280px); }
        }
    </style>
</head>
<body>
    <div class="viewer-shell" id="viewerShell">
        <header class="viewer-header">
            <h5 class="mb-2">Secure Viewer - View Only</h5>
            <div class="viewer-meta" id="viewerMeta">
                <div class="meta-card"><span class="meta-label">Bank/Department</span><strong id="metaBank">-</strong></div>
                <div class="meta-card"><span class="meta-label">Username</span><strong id="metaUser">-</strong></div>
                <div class="meta-card"><span class="meta-label">IP Address</span><strong id="metaIp">-</strong></div>
                <div class="meta-card"><span class="meta-label">Date & Time</span><strong id="metaTime">-</strong></div>
            </div>
            <div class="guard-note">هذا العرض للقراءة فقط. تم تعطيل الطباعة والتحميل والتعديل.</div>
        </header>

        <main class="viewer-body">
            <div class="status-box" id="viewerStatus">جاري التحقق من الرابط...</div>
            <section class="doc-stage d-none" id="docStage">
                <div class="doc-watermark-layer" id="watermarkLayer"></div>
                <iframe class="doc-frame d-none" id="docFrame" title="Secure Document Frame"></iframe>
                <img class="doc-image d-none" id="docImage" alt="Secure Document Image">
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/secure-viewer-page.js"></script>
</body>
</html>
