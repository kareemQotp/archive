<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الدعوات - نظام الأرشيف</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- تطبيق الألوان الجديدة -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/unified-sidebar.css">
    
    <style>
        .main-content {
            margin-right: 280px;
            padding: 2rem;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--ocean-light) 0%, var(--wave-foam) 100%);
        }

        .page-header {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 180, 216, 0.1);
            border-left: 4px solid var(--primary);
        }

        .invite-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-right: 4px solid var(--primary);
        }

        .invite-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 180, 216, 0.15);
        }

        .invite-status {
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-used {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-expired {
            background: #fee2e2;
            color: #991b1b;
        }

        .copy-link-btn {
            transition: all 0.3s ease;
        }

        .copy-link-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .main-content {
                margin-right: 0;
                padding: 1rem;
            }
        }
    </style>
    <script defer src="assets/js/format-utils.js"></script>
    <script defer src="assets/js/ux-core.js"></script>
    <link rel="stylesheet" href="assets/css/archive-design-system.css">
</head>
<body>
    <a href="#mainContent" class="skip-link visually-hidden-focusable">تخطي إلى المحتوى الرئيسي</a>
    <!-- Navbar and Sidebar are rendered by unified UI template --><!-- Main Content -->
    <div class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h2 mb-1">
                        <i class="fas fa-envelope text-primary me-3"></i>
                        إدارة دعوات الانضمام
                    </h1>
                    <p class="text-muted mb-0">إرسال وإدارة دعوات الموظفين الجدد</p>
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newInviteModal">
                    <i class="fas fa-plus me-2"></i>
                    دعوة جديدة
                </button>
            </div>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <!-- Invitations List -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-2"></i>
                            الدعوات المرسلة
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="loadingSpinner" class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">جاري التحميل...</span>
                            </div>
                        </div>
                        <div id="invitationsList">
                            <!-- Invitations will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Invite Modal -->
    <div class="modal fade" id="newInviteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-plus me-2"></i>
                        إرسال دعوة جديدة
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
                </div>
                <div class="modal-body">
                    <form id="inviteForm">
                        <div class="mb-3">
                            <label for="inviteEmail" class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="inviteEmail" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="inviteDepartment" class="form-label">الإدارة</label>
                            <select class="form-select" id="inviteDepartment" required>
                                <option value="">اختر الإدارة</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="suggestedRole" class="form-label">الدور المقترح (اختياري)</label>
                            <select class="form-select" id="suggestedRole">
                                <option value="">سيحدد لاحقاً</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="inviteMessage" class="form-label">رسالة الدعوة (اختياري)</label>
                            <textarea class="form-control" id="inviteMessage" rows="3" placeholder="رسالة ترحيبية للموظف الجديد"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="expiryDays" class="form-label">صلاحية الدعوة (بالأيام)</label>
                            <select class="form-select" id="expiryDays">
                                <option value="7">7 أيام</option>
                                <option value="14" selected>14 يوم</option>
                                <option value="30">30 يوم</option>
                            </select>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="autoApprove">
                            <label class="form-check-label" for="autoApprove">
                                موافقة تلقائية عند التسجيل
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="createInvitation()">
                        <i class="fas fa-paper-plane me-2"></i>
                        إرسال الدعوة
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase v10.7.1 - الإصدار الموحد -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    
    <!-- Enhanced System Components -->
    <script src="assets/js/auth-constants.js"></script>
    <script src="assets/js/unified-auth.js"></script>
    <script src="assets/js/sensitive-action-guard.js"></script>
    <script src="assets/js/activity-logger.js"></script>
    <script src="assets/js/ui-permission-controller.js"></script>
    <script src="assets/js/admin-feature-switches.js"></script>

    <script>
        // Modern Invitations Management System
        console.log('🔄 تحميل نظام إدارة الدعوات...');

        // نظام المصادقة الموحد المحسن
        let authSystem = null;
        let currentUser = null;
        let userDepartment = null;
        let userRole = null;
        let departments = [];

        // Helper: centralize safe login redirection
        function gotoLogin() {
            try {
                if (window.unifiedAuth && typeof window.unifiedAuth.redirectToLogin === 'function') {
                    window.unifiedAuth.redirectToLogin(window.location.pathname);
                    return;
                }
            } catch (e) {
                console.warn('redirectToLogin failed, falling back:', e);
            }
            window.location.href = 'login.html';
        }

        // Helper: escape HTML to prevent XSS when using innerHTML
        function escapeHTML(str) {
            return String(str || '').replace(/[&<>"'`=\/]/g, function (s) {
                return ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;',
                    '`': '&#96;',
                    '=': '&#61;',
                    '/': '&#47;'
                })[s];
            });
        }

        async function getSensitiveActionApprovalINV(actionLabel) {
            if (!window.sensitiveActionGuard || typeof window.sensitiveActionGuard.approveSensitiveAction !== 'function') {
                throw new Error('Sensitive action guard is not available');
            }
            const approval = await window.sensitiveActionGuard.approveSensitiveAction({
                actionLabel,
                requireReason: true,
                requireReauth: true
            });
            if (!approval || !approval.approved) {
                throw new Error('تم إلغاء العملية أو فشل التحقق الأمني');
            }
            return approval;
        }

        // Enhanced Firebase initialization with error handling
        async function waitForFirebaseAndAuth() {
            return new Promise((resolve) => {
                let attempts = 0;
                const maxAttempts = 50;
                
                const checkAll = () => {
                    attempts++;
                    console.log('🔍 فحص Firebase ' + attempts + '/' + maxAttempts + ' - Firebase: ' + !!window.firebase + ', Auth: ' + !!window.auth + ', UnifiedAuth: ' + !!window.unifiedAuth);
                    
                    if (window.firebase && window.auth && window.unifiedAuth) {
                        console.log('✅ جميع مكونات Firebase جاهزة');
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        console.warn('⚠️ انتهت مهلة انتظار مكونات Firebase، المتابعة رغم ذلك');
                        resolve();
                    } else {
                        setTimeout(checkAll, 200);
                    }
                };
                
                checkAll();
            });
        }

        // Initialize page when Firebase is ready
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('📋 Invitations Page - بدء التهيئة');
            
            try {
                // انتظار تحميل Firebase والمصادقة
                await waitForFirebaseAndAuth();
                
                // تهيئة نظام المصادقة الموحد
                if (window.unifiedAuth) {
                    authSystem = window.unifiedAuth;
                } else {
                    console.error('❌ نظام المصادقة الموحد غير متوفر');
                    gotoLogin();
                    return;
                }

                console.log('✅ نظام المصادقة جاهز');
                
                // انتظار تسجيل الدخول مع تحسينات
                let authAttempts = 0;
                const maxAuthAttempts = 20;
                
                while (!authSystem.isAuthenticated && authAttempts < maxAuthAttempts) {
                    console.log('🔄 انتظار المصادقة...', authAttempts + 1, '/', maxAuthAttempts);
                    await new Promise(resolve => setTimeout(resolve, 200));
                    authAttempts++;
                }
                
                if (!authSystem.isAuthenticated || !authSystem.currentUser) {
                    console.log('❌ المستخدم غير مسجل دخول بعد', authAttempts, 'محاولة');
                    gotoLogin();
                    return;
                }

                console.log('✅ المستخدم مصادق عليه:', authSystem.currentUser.email);

                // الحصول على بيانات المستخدم
                let userData = null;
                try {
                    userData = await authSystem.getCurrentUserData();
                } catch (error) {
                    console.log('⚠️ خطأ في الحصول على بيانات المستخدم، سيتم إعادة التوجيه لتسجيل الدخول من جديد');
                    gotoLogin();
                    return;
                }
                
                if (!userData) {
                    console.log('❌ تعذر الحصول على بيانات المستخدم');
                    gotoLogin();
                    return;
                }

                currentUser = userData;
                userDepartment = currentUser.department;
                // تأكد من أن الدور نصي لتفادي الأخطاء
                userRole = (currentUser.role || '').toString();

                console.log('👤 المستخدم الحالي:', currentUser.email, 'الدور:', userRole);

                const pageAccess = await (window.adminFeatureSwitches
                    ? window.adminFeatureSwitches.gatePageAccess(userRole, 'invitationsV2', {
                        allowedRoles: ['admin', 'dept_admin'],
                        moduleLabel: 'صفحة إدارة الدعوات',
                        roleLabel: userRole || 'viewer',
                        message: 'ليس لديك صلاحية للوصول لهذه الصفحة',
                        redirectTo: 'index.html',
                        redirectDelayMs: 1500,
                        onDenied: () => {
                            if (window.activityLogger && window.activityLogger.logAccessDenied) {
                                window.activityLogger.logAccessDenied(currentUser.email, 'invitations_page', 'insufficient_permissions');
                            }
                        }
                    })
                    : Promise.resolve(true));
                if (!pageAccess) {
                    return;
                }

                // سجل دخول الصفحة
                if (window.activityLogger && window.activityLogger.logPageAccess) {
                    window.activityLogger.logPageAccess('invitations_management', 'admin_feature');
                } else {
                    console.log('✅ تم الوصول لصفحة إدارة الدعوات');
                }

                // تحميل البيانات
                    // تحديث الواجهة الموحدة بعد توثيق المستخدم لضمان عرض اسم المستخدم وإخفاء أزرار الزائر
                    try {
                        if (window.unifiedUI && typeof window.unifiedUI.updateSidebar === 'function') {
                            await window.unifiedUI.updateSidebar();
                        }
                    } catch (e) {
                        console.warn('تعذر تحديث الواجهة الموحدة بعد المصادقة:', e);
                    }

                await loadDepartments();
                await loadInvitations();

            } catch (error) {
                console.error('❌ خطأ في تهيئة الصفحة:', error);
                
                // سجل الخطأ
                if (window.activityLogger && window.activityLogger.logError) {
                    window.activityLogger.logError('invitations_page_init', error.message);
                }
                
                showAlert('خطأ في تحميل الصفحة، يرجى المحاولة مرة أخرى', 'danger');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
            }
        });

        // تحميل الإدارات مع تحسينات الأمان والأداء
        async function loadDepartments() {
            console.log('📁 تحميل الإدارات...');
            
            try {
                // التأكد من وجود قاعدة البيانات مع انتظار
                let dbAttempts = 0;
                const maxDbAttempts = 10;
                
                while (!window.db && dbAttempts < maxDbAttempts) {
                    console.log('⏳ انتظار قاعدة البيانات...', dbAttempts + 1, '/', maxDbAttempts);
                    await new Promise(resolve => setTimeout(resolve, 300));
                    dbAttempts++;
                }
                
                if (!window.db) {
                    console.warn('⚠️ قاعدة البيانات غير متوفرة، إنشاء إدارات افتراضية');
                    createDefaultDepartments();
                    return;
                }

                const snapshot = await window.db.collection('departments').orderBy('name').get();
                departments = [];
                
                const departmentSelect = document.getElementById('inviteDepartment');
                const roleSelect = document.getElementById('suggestedRole');
                
                if (!departmentSelect || !roleSelect) {
                    console.error('❌ عناصر النموذج غير موجودة');
                    return;
                }

                departmentSelect.innerHTML = '<option value="">اختر الإدارة</option>';
                roleSelect.innerHTML = '<option value="">سيحدد لاحقاً</option>';

                // إضافة خيارات الأدوار
                const roles = [
                    { value: 'viewer', text: 'مستخدم عادي' },
                    { value: 'editor', text: 'محرر' },
                    { value: 'dept_admin', text: 'مدير إدارة' }
                ];

                roles.forEach(role => {
                    const option = document.createElement('option');
                    option.value = role.value;
                    option.textContent = role.text;
                    roleSelect.appendChild(option);
                });

                if (snapshot.empty) {
                    console.warn('⚠️ لا توجد إدارات في قاعدة البيانات، إنشاء إدارات افتراضية');
                    createDefaultDepartments();
                    return;
                }

                snapshot.forEach(doc => {
                    const dept = { id: doc.id, ...doc.data() };
                    departments.push(dept);

                    // مدراء الإدارات يرون إدارتهم فقط، المدير العام يرى كل الإدارات
                    if (userRole === 'admin' || dept.id === userDepartment || !userDepartment) {
                        const option = document.createElement('option');
                        option.value = dept.id;
                        option.textContent = dept.name;
                        departmentSelect.appendChild(option);
                    }
                });

                console.log('✅ تم تحميل', departments.length, 'إدارة');
                
                // سجل النشاط
                if (window.activityLogger && window.activityLogger.logDataLoad) {
                    window.activityLogger.logDataLoad('departments', departments.length);
                }

            } catch (error) {
                console.error('❌ خطأ في تحميل الإدارات:', error);
                
                // سجل الخطأ
                if (window.activityLogger && window.activityLogger.logError) {
                    window.activityLogger.logError('load_departments', error.message);
                }
                
                createDefaultDepartments();
            }
        }

        // إنشاء إدارات افتراضية
        function createDefaultDepartments() {
            console.log('🏢 إنشاء إدارات افتراضية...');
            
            const defaultDepartments = [
                { id: 'admin', name: 'الإدارة العامة' },
                { id: 'hr', name: 'الموارد البشرية' },
                { id: 'finance', name: 'المالية' },
                { id: 'it', name: 'تقنية المعلومات' },
                { id: 'archive', name: 'الأرشيف' }
            ];

            departments = defaultDepartments;
            
            const departmentSelect = document.getElementById('inviteDepartment');
            if (departmentSelect) {
                departmentSelect.innerHTML = '<option value="">اختر الإدارة</option>';
                
                defaultDepartments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = dept.name;
                    departmentSelect.appendChild(option);
                });
                
                console.log('✅ تم إنشاء الإدارات الافتراضية');
            }
        }

        // تحميل الدعوات مع تحسينات الأمان والعرض
        async function loadInvitations() {
            console.log('📨 تحميل الدعوات...');
            
            try {
                const invitationsList = document.getElementById('invitationsList');
                const loadingSpinner = document.getElementById('loadingSpinner');

                if (!invitationsList || !loadingSpinner) {
                    console.error('❌ عناصر العرض غير موجودة');
                    return;
                }

                // التأكد من وجود قاعدة البيانات
                if (!window.db) {
                    console.warn('⚠️ قاعدة البيانات غير متوفرة، عرض حالة فارغة');
                    loadingSpinner.style.display = 'none';
                    invitationsList.innerHTML = `
                        <div class="text-center py-4">
                            <i class="fas fa-database text-muted mb-3" style="font-size: 3rem;"></i>
                            <p class="text-muted">قاعدة البيانات غير متوفرة حالياً</p>
                            <p class="text-muted">يرجى المحاولة لاحقاً أو التواصل مع الدعم التقني</p>
                            <button class="btn btn-primary" onclick="location.reload()">
                                <i class="fas fa-sync me-2"></i>
                                إعادة المحاولة
                            </button>
                        </div>
                    `;
                    return;
                }

                let query = window.db.collection('invitations').orderBy('createdAt', 'desc');
                
                // مدراء الإدارات يرون دعوات إدارتهم فقط
                if (userRole !== 'admin' && userDepartment) {
                    query = query.where('department', '==', userDepartment);
                }

                const snapshot = await query.get();

                loadingSpinner.style.display = 'none';
                invitationsList.innerHTML = '';

                if (snapshot.empty) {
                    invitationsList.innerHTML = `
                        <div class="text-center py-4">
                            <i class="fas fa-envelope text-muted mb-3" style="font-size: 3rem;"></i>
                            <p class="text-muted">لا توجد دعوات مرسلة</p>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newInviteModal">
                                <i class="fas fa-plus me-2"></i>
                                إرسال أول دعوة
                            </button>
                        </div>
                    `;
                    return;
                }

                let invitationCount = 0;
                snapshot.forEach(doc => {
                    const invite = { id: doc.id, ...doc.data() };
                    const inviteCard = createInviteCard(invite);
                    invitationsList.appendChild(inviteCard);
                    invitationCount++;
                });

                console.log('✅ تم تحميل', invitationCount, 'دعوة');
                
                // سجل النشاط
                if (window.activityLogger && window.activityLogger.logDataLoad) {
                    window.activityLogger.logDataLoad('invitations', invitationCount);
                }

            } catch (error) {
                console.error('❌ خطأ في تحميل الدعوات:', error);
                
                // سجل الخطأ
                if (window.activityLogger && window.activityLogger.logError) {
                    window.activityLogger.logError('load_invitations', error.message);
                }
                
                const loadingSpinner = document.getElementById('loadingSpinner');
                const invitationsList = document.getElementById('invitationsList');
                
                if (loadingSpinner) {
                    loadingSpinner.style.display = 'none';
                }
                
                if (invitationsList) {
                    invitationsList.innerHTML = `
                        <div class="text-center py-4">
                            <i class="fas fa-exclamation-triangle text-warning mb-3" style="font-size: 3rem;"></i>
                            <p class="text-muted">خطأ في تحميل الدعوات</p>
                            <p class="text-muted">${escapeHTML(error.message)}</p>
                            <button class="btn btn-primary" onclick="loadInvitations()">
                                <i class="fas fa-sync me-2"></i>
                                إعادة المحاولة
                            </button>
                        </div>
                    `;
                }
                
                showAlert('خطأ في تحميل الدعوات', 'danger');
            }
        }

        // إنشاء كارد الدعوة مع تحسينات العرض والأمان
        function createInviteCard(invite) {
            const div = document.createElement('div');
            div.className = 'invite-card';

            const now = new Date();
            const expiryDateRaw = invite?.expiresAt ? (typeof invite.expiresAt.toDate === 'function' ? invite.expiresAt.toDate() : new Date(invite.expiresAt)) : null;
            const isExpired = expiryDateRaw ? (expiryDateRaw < now) : false;
            const isUsed = invite.status === 'used';

            let statusClass = 'status-active';
            let statusText = 'نشطة';
            let statusIcon = 'fas fa-check-circle';
            
            if (isUsed) {
                statusClass = 'status-used';
                statusText = 'مستخدمة';
                statusIcon = 'fas fa-user-check';
            } else if (isExpired) {
                statusClass = 'status-expired';
                statusText = 'منتهية الصلاحية';
                statusIcon = 'fas fa-clock';
            }

            const department = departments.find(d => d.id === invite.department);
            const createdDate = invite.createdAt?.toDate()?.toLocaleDateString('ar-SA') || 'غير محدد';
            const expiryDateStr = expiryDateRaw ? expiryDateRaw.toLocaleDateString('ar-SA') : 'غير محدد';

            // URL-encode invite code to be safe in query
            const inviteUrl = `${window.location.origin}/register.html?invite=${encodeURIComponent(invite.code)}`;

            // تحسين عرض المعلومات
            const roleText = invite.suggestedRole ? getSuggestedRoleText(invite.suggestedRole) : 'لم يحدد';
            const autoApproveText = invite.autoApprove ? 'نعم' : 'لا';

            div.innerHTML = `
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <h6 class="mb-1">
                            <i class="fas fa-envelope me-2 text-primary"></i>
                            ${escapeHTML(invite.email)}
                        </h6>
                        <small class="text-muted">
                            <i class="fas fa-building me-1"></i>
                            ${escapeHTML(department?.name || invite.department)}
                        </small>
                        ${invite.suggestedRole ? `
                            <small class="d-block text-muted">
                                <i class="fas fa-user-tag me-1"></i>
                                الدور المقترح: ${escapeHTML(roleText)}
                            </small>
                        ` : ''}
                    </div>
                    <span class="invite-status ${statusClass}">
                        <i class="${statusIcon} me-1"></i>
                        ${statusText}
                    </span>
                </div>
                
                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <small class="text-muted">تاريخ الإرسال:</small>
                        <div class="fw-bold">${createdDate}</div>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted">تنتهي في:</small>
                        <div class="fw-bold ${isExpired ? 'text-danger' : ''}">${expiryDateStr}</div>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted">موافقة تلقائية:</small>
                        <div class="fw-bold">${autoApproveText}</div>
                    </div>
                </div>

                <div class="mb-3">
                    <small class="text-muted">رمز الدعوة:</small>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-light text-dark border font-monospace" dir="ltr" style="font-size: 0.95rem;">
                            ${escapeHTML(invite.code)}
                        </span>
                        <button class="btn btn-outline-secondary btn-sm" onclick="copyInviteCode(event, '${encodeURIComponent(invite.code)}', '${invite.id}')" title="نسخ رمز الدعوة">
                            <i class="fas fa-copy me-1"></i>
                            نسخ الرمز
                        </button>
                    </div>
                </div>

                ${invite.message ? `
                    <div class="mb-3">
                        <small class="text-muted">الرسالة:</small>
                        <div class="bg-light p-2 rounded border-start border-primary border-3">
                            <i class="fas fa-quote-left text-primary me-1"></i>
                            ${escapeHTML(invite.message)}
                        </div>
                    </div>
                ` : ''}

                ${invite.usedBy ? `
                    <div class="mb-3">
                        <small class="text-muted">استخدمت بواسطة:</small>
                        <div class="bg-success bg-opacity-10 p-2 rounded">
                            <i class="fas fa-user-check text-success me-1"></i>
                            ${escapeHTML(invite.usedBy)} في ${invite.usedAt?.toDate()?.toLocaleDateString('ar-SA') || 'غير محدد'}
                        </div>
                    </div>
                ` : ''}

                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-outline-primary btn-sm copy-link-btn" onclick="copyInviteLink(event, '${inviteUrl}', '${invite.id}')" title="نسخ رابط الدعوة">
                        <i class="fas fa-copy me-1"></i>
                        نسخ الرابط
                    </button>
                    
                    ${!isUsed && !isExpired ? `
                        <button class="btn btn-outline-warning btn-sm" onclick="extendInvite('${invite.id}')" title="تمديد صلاحية الدعوة">
                            <i class="fas fa-clock me-1"></i>
                            تمديد
                        </button>
                    ` : ''}
                    
                    ${!isUsed ? `
                        <button class="btn btn-outline-info btn-sm" onclick="resendInvite('${invite.id}')" title="إعادة إرسال الدعوة">
                            <i class="fas fa-paper-plane me-1"></i>
                            إعادة إرسال
                        </button>
                    ` : ''}
                    
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteInvite('${invite.id}', decodeURIComponent('${encodeURIComponent(invite.email)}'))" title="حذف الدعوة">
                        <i class="fas fa-trash me-1"></i>
                        حذف
                    </button>
                </div>
            `;

            return div;
        }

        // الحصول على نص الدور المقترح
        function getSuggestedRoleText(role) {
            const roleTexts = {
                'viewer': 'مستخدم عادي',
                'editor': 'محرر',
                'dept_admin': 'مدير إدارة'
            };
            return roleTexts[role] || role;
        }

        // إنشاء دعوة جديدة مع تحسينات الأمان والتحقق
        async function createInvitation() {
            console.log('📤 إنشاء دعوة جديدة...');
            
            const email = document.getElementById('inviteEmail')?.value?.trim();
            const department = document.getElementById('inviteDepartment')?.value;
            const suggestedRole = document.getElementById('suggestedRole')?.value;
            const message = document.getElementById('inviteMessage')?.value?.trim();
            const expiryDays = parseInt(document.getElementById('expiryDays')?.value) || 14;
            const autoApprove = document.getElementById('autoApprove')?.checked || false;

            // التحقق من صحة البيانات
            if (!email || !department) {
                showAlert('يرجى إدخال البريد الإلكتروني واختيار الإدارة', 'danger');
                return;
            }

            // التحقق من صيغة البريد الإلكتروني
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('يرجى إدخال بريد إلكتروني صحيح', 'danger');
                return;
            }

            // تعطيل الزر لمنع الإرسال المتكرر
            const submitButton = document.querySelector('#newInviteModal .btn-primary');
            const originalText = submitButton.innerHTML;
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>جاري الإرسال...';

            try {
                const approval = await getSensitiveActionApprovalINV('إنشاء دعوة مستخدم');
                // التأكد من وجود قاعدة البيانات
                if (!window.db) {
                    throw new Error('قاعدة البيانات غير متوفرة');
                }

                // فحص إذا كانت هناك دعوة نشطة لنفس البريد الإلكتروني
                const existingInvites = await window.db.collection('invitations')
                    .where('email', '==', email)
                    .where('status', '==', 'active')
                    .get();

                if (!existingInvites.empty) {
                    throw new Error('يوجد دعوة نشطة لهذا البريد الإلكتروني بالفعل');
                }

                // فحص إذا كان المستخدم مسجل بالفعل
                const existingUsers = await window.db.collection('users')
                    .where('email', '==', email)
                    .get();

                if (!existingUsers.empty) {
                    throw new Error('هذا البريد الإلكتروني مسجل في النظام بالفعل');
                }

                // إنشاء كود دعوة فريد
                const inviteCode = generateInviteCode();
                const expiryDate = new Date();
                expiryDate.setDate(expiryDate.getDate() + expiryDays);

                const inviteData = {
                    code: inviteCode,
                    email: email,
                    department: department,
                    suggestedRole: suggestedRole || null,
                    message: message || null,
                    autoApprove: autoApprove,
                    status: 'active',
                    invitedBy: authSystem.currentUser.email,
                    invitedByUid: authSystem.currentUser.uid,
                    invitedByName: authSystem.currentUser.displayName || (authSystem.currentUser.email ? authSystem.currentUser.email.split('@')[0] : 'مستخدم'),
                    invitationReason: approval.reason,
                    sensitiveReauthAt: approval.reauthenticatedAt,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    expiresAt: firebase.firestore.Timestamp.fromDate(expiryDate),
                    usedBy: null,
                    usedAt: null,
                    resendCount: 0
                };

                // إضافة الدعوة لقاعدة البيانات
                const docRef = await window.db.collection('invitations').add(inviteData);
                
                console.log('✅ تم إنشاء الدعوة:', docRef.id);

                // سجل النشاط
                if (window.activityLogger && window.activityLogger.logInvitationSent) {
                    window.activityLogger.logInvitationSent(email, department, authSystem.currentUser.email);
                } else if (window.activityLogger && window.activityLogger.logUserAction) {
                    window.activityLogger.logUserAction('invitation_sent', { recipient: email, department: department });
                } else {
                    console.log('✅ تم إرسال دعوة لـ:', email);
                }

                showAlert(`تم إرسال الدعوة بنجاح إلى ${email}!`, 'success');
                
                // إغلاق النافذة وإعادة تحميل الدعوات
                const modalEl = document.getElementById('newInviteModal');
                const modal = modalEl ? bootstrap.Modal.getInstance(modalEl) : null;
                if (modal) modal.hide();
                const form = document.getElementById('inviteForm');
                if (form && typeof form.reset === 'function') form.reset();
                await loadInvitations();

            } catch (error) {
                console.error('❌ خطأ في إرسال الدعوة:', error);
                
                // سجل الخطأ
                if (window.activityLogger && window.activityLogger.logError) {
                    window.activityLogger.logError('create_invitation', error.message);
                }
                
                showAlert(error.message || 'خطأ في إرسال الدعوة', 'danger');
            } finally {
                // إعادة تفعيل الزر
                submitButton.disabled = false;
                submitButton.innerHTML = originalText;
            }
        }

        // إنشاء كود دعوة فريد محسن
        function generateInviteCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            
            // إضافة بادئة زمنية للتفرد
            const timePrefix = Date.now().toString(36).toUpperCase().slice(-2);
            result += timePrefix;
            
            // إضافة أحرف عشوائية
            for (let i = 0; i < 10; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            // إضافة checksum بسيط
            const checksum = result.split('').reduce((sum, char) => sum + char.charCodeAt(0), 0) % chars.length;
            result += chars.charAt(checksum);
            
            return result;
        }

        // نسخ رابط الدعوة مع تحسينات
        async function copyInviteLink(evt, url, inviteId) {
            try {
                await navigator.clipboard.writeText(url);
                showAlert('تم نسخ رابط الدعوة!', 'success');
                
                // سجل النشاط
                if (window.activityLogger && window.activityLogger.logUserAction) {
                    window.activityLogger.logUserAction('invitation_link_copied', { inviteId: inviteId });
                }
                
                // تأثير بصري للزر
                const button = (evt && evt.target && typeof evt.target.closest === 'function') ? evt.target.closest('button') : null;
                if (!button) return;
                const originalText = button.innerHTML;
                button.innerHTML = '<i class="fas fa-check me-1 text-success"></i>تم النسخ';
                button.classList.add('btn-success');
                button.classList.remove('btn-outline-primary');
                
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('btn-success');
                    button.classList.add('btn-outline-primary');
                }, 2000);
                
            } catch (error) {
                console.error('خطأ في نسخ الرابط:', error);
                
                // fallback للمتصفحات القديمة
                const textArea = document.createElement('textarea');
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showAlert('تم نسخ رابط الدعوة!', 'success');
                } catch (fallbackError) {
                    showAlert('خطأ في نسخ الرابط، يرجى نسخه يدوياً: ' + url, 'warning');
                }
                document.body.removeChild(textArea);
            }
        }

        // نسخ رمز الدعوة
        async function copyInviteCode(evt, encodedCode, inviteId) {
            const code = decodeURIComponent(encodedCode || '');
            try {
                await navigator.clipboard.writeText(code);
                showAlert('تم نسخ رمز الدعوة!', 'success');

                if (window.activityLogger && window.activityLogger.logUserAction) {
                    window.activityLogger.logUserAction('invitation_code_copied', { inviteId: inviteId });
                }

                const button = (evt && evt.target && typeof evt.target.closest === 'function') ? evt.target.closest('button') : null;
                if (button) {
                    const originalText = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-check me-1 text-success"></i>تم النسخ';
                    button.classList.add('btn-success');
                    button.classList.remove('btn-outline-secondary');
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.classList.remove('btn-success');
                        button.classList.add('btn-outline-secondary');
                    }, 2000);
                }
            } catch (error) {
                console.error('خطأ في نسخ الرمز:', error);
                const textArea = document.createElement('textarea');
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showAlert('تم نسخ رمز الدعوة!', 'success');
                } catch (fallbackError) {
                    showAlert('خطأ في نسخ الرمز، يرجى نسخه يدوياً: ' + code, 'warning');
                }
                document.body.removeChild(textArea);
            }
        }

        // تمديد الدعوة مع تحسينات
        async function extendInvite(inviteId) {
            if (!confirm('هل تريد تمديد صلاحية هذه الدعوة لـ 14 يوم إضافي؟')) return;

            try {
                const approval = await getSensitiveActionApprovalINV('تمديد صلاحية دعوة');
                if (!window.db) {
                    throw new Error('قاعدة البيانات غير متوفرة');
                }

                const newExpiryDate = new Date();
                newExpiryDate.setDate(newExpiryDate.getDate() + 14);

                await window.db.collection('invitations').doc(inviteId).update({
                    expiresAt: firebase.firestore.Timestamp.fromDate(newExpiryDate),
                    extendedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    extendedBy: authSystem.currentUser.email,
                    extendReason: approval.reason,
                    sensitiveReauthAt: approval.reauthenticatedAt
                });

                // سجل النشاط
                if (window.activityLogger && window.activityLogger.logUserAction) {
                    window.activityLogger.logUserAction('invitation_extended', { inviteId: inviteId });
                }

                showAlert('تم تمديد صلاحية الدعوة لـ 14 يوم إضافي', 'success');
                await loadInvitations();
            } catch (error) {
                console.error('خطأ في تمديد الدعوة:', error);
                
                if (window.activityLogger && window.activityLogger.logError) {
                    window.activityLogger.logError('extend_invitation', error.message);
                }
                
                showAlert('خطأ في تمديد الدعوة', 'danger');
            }
        }

        // إعادة إرسال الدعوة
        async function resendInvite(inviteId) {
            if (!confirm('هل تريد إعادة إرسال هذه الدعوة؟')) return;

            try {
                const approval = await getSensitiveActionApprovalINV('إعادة إرسال دعوة');
                if (!window.db) {
                    throw new Error('قاعدة البيانات غير متوفرة');
                }

                await window.db.collection('invitations').doc(inviteId).update({
                    resendCount: firebase.firestore.FieldValue.increment(1),
                    lastResent: firebase.firestore.FieldValue.serverTimestamp(),
                    resentBy: authSystem.currentUser.email,
                    resendReason: approval.reason,
                    sensitiveReauthAt: approval.reauthenticatedAt
                });

                // سجل النشاط
                if (window.activityLogger && window.activityLogger.logUserAction) {
                    window.activityLogger.logUserAction('invitation_resent', { inviteId: inviteId });
                }

                showAlert('تم إعادة إرسال الدعوة', 'success');
                await loadInvitations();
            } catch (error) {
                console.error('خطأ في إعادة إرسال الدعوة:', error);
                showAlert('خطأ في إعادة إرسال الدعوة', 'danger');
            }
        }

        // حذف الدعوة مع تحسينات الأمان
        async function deleteInvite(inviteId, email) {
            if (!confirm(`هل أنت متأكد من حذف دعوة ${email}؟\n\nهذا الإجراء لا يمكن التراجع عنه.`)) return;

            try {
                await getSensitiveActionApprovalINV('حذف دعوة');
                if (!window.db) {
                    throw new Error('قاعدة البيانات غير متوفرة');
                }

                await window.db.collection('invitations').doc(inviteId).delete();

                // سجل النشاط
                if (window.activityLogger && window.activityLogger.logUserAction) {
                    window.activityLogger.logUserAction('invitation_deleted', { inviteId: inviteId, email: email });
                } else {
                    console.log('✅ تم حذف دعوة:', email);
                }

                showAlert('تم حذف الدعوة', 'info');
                await loadInvitations();
            } catch (error) {
                console.error('خطأ في حذف الدعوة:', error);
                
                if (window.activityLogger && window.activityLogger.logError) {
                    window.activityLogger.logError('delete_invitation', error.message);
                }
                
                showAlert('خطأ في حذف الدعوة', 'danger');
            }
        }

        // Enhanced alert system with better UX
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            if (!alertContainer) {
                console.error('❌ Alert container not found');
                return;
            }

            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.style.position = 'relative';
            alertDiv.style.zIndex = '1050';
            
            const iconClass = {
                'success': 'fas fa-check-circle',
                'danger': 'fas fa-exclamation-circle',
                'warning': 'fas fa-exclamation-triangle',
                'info': 'fas fa-info-circle'
            }[type] || 'fas fa-info-circle';
            
            alertDiv.innerHTML = `
                <div class="d-flex align-items-center">
                    <i class="${iconClass} me-2"></i>
                    <span>${escapeHTML(message)}</span>
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="إغلاق"></button>
                </div>
            `;
            
            // إضافة تأثير دخول
            alertDiv.style.opacity = '0';
            alertDiv.style.transform = 'translateY(-20px)';
            alertContainer.appendChild(alertDiv);
            
            // تفعيل التأثير
            setTimeout(() => {
                alertDiv.style.transition = 'all 0.3s ease';
                alertDiv.style.opacity = '1';
                alertDiv.style.transform = 'translateY(0)';
            }, 10);
            
            // إزالة تلقائية بعد 5 ثوان
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.style.opacity = '0';
                    alertDiv.style.transform = 'translateY(-20px)';
                    setTimeout(() => {
                        if (alertDiv.parentNode) {
                            alertDiv.parentNode.removeChild(alertDiv);
                        }
                    }, 300);
                }
            }, 5000);
        }

        // Enhanced error handling
        window.addEventListener('error', function(event) {
            console.error('❌ JavaScript Error:', event.error);
            
            if (window.activityLogger && window.activityLogger.logError) {
                window.activityLogger.logError('javascript_error', event.error.message);
            }
        });

        // Enhanced unhandled promise rejection handling
        window.addEventListener('unhandledrejection', function(event) {
            console.error('❌ Unhandled Promise Rejection:', event.reason);
            
            if (window.activityLogger && window.activityLogger.logError) {
                window.activityLogger.logError('promise_rejection', event.reason);
            }
        });

        console.log('✅ نظام إدارة الدعوات جاهز للعمل');
    </script>
    <script src="assets/js/unified-ui-template.js"></script>
