<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الإشعارات البسيط</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .test-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .navbar-test {
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .btn-test {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin: 5px;
        }
        
        .btn-test:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            color: white;
        }
        
        .result-log {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
    <script defer src="assets/js/format-utils.js"></script>
    <script defer src="assets/js/ux-core.js"></script>
</head>
<body>
    <a href="#mainContent" class="skip-link visually-hidden-focusable">تخطي إلى المحتوى الرئيسي</a>
    <!-- شريط التنقل التجريبي -->
    <div class="navbar-test">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">نظام الأرشيف - اختبار الإشعارات</h5>
            <div class="d-flex align-items-center">
                <span class="me-3">مرحباً، مدير النظام</span>
                <!-- أيقونة الإشعارات -->
                <div id="notification-container"></div>
            </div>
        </div>
    </div>

    <div class="container" id="mainContent" role="main" tabindex="-1">
        <div class="test-card">
            <h2 class="text-center mb-4">
                <i class="bi bi-bell-fill text-primary"></i>
                اختبار بسيط لنظام الإشعارات
            </h2>
            
            <!-- أزرار الاختبار -->
            <div class="text-center mb-4">
                <button class="btn btn-test" onclick="testBasicNotification()">
                    <i class="bi bi-plus-circle"></i> إشعار بسيط
                </button>
                <button class="btn btn-test" onclick="testMultipleNotifications()">
                    <i class="bi bi-collection"></i> إشعارات متعددة
                </button>
                <button class="btn btn-test" onclick="testAlertNotification()">
                    <i class="bi bi-exclamation-triangle"></i> تنبيه مهم
                </button>
                <button class="btn btn-test" onclick="clearResults()">
                    <i class="bi bi-trash"></i> مسح النتائج
                </button>
            </div>
            
            <!-- نتائج الاختبار -->
            <div class="result-log" id="test-log">
                <div class="text-muted">انقر على أحد الأزرار لبدء الاختبار...</div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBILxwMOLGSaE_FWKaPdGF6LFtLvTgYqSk",
            authDomain: "tech-arc-9af9c.firebaseapp.com",
            projectId: "tech-arc-9af9c",
            storageBucket: "tech-arc-9af9c.firebasestorage.app",
            messagingSenderId: "635163313263",
            appId: "1:635163313263:web:c82de8bc5cdc9f2a8fc0c9",
            measurementId: "G-FS6KW2W7SX"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.auth = getAuth(app);
        window.firebase = { app, db: window.db, auth: window.auth };

        log('✅ Firebase تم تهيئته بنجاح');
        
        // تهيئة المكونات بعد تحميل Firebase
        setTimeout(initializeComponents, 1000);
    </script>

    <!-- مكونات النظام -->
    <script src="assets/js/simple-notification-service.js"></script>
    <script src="assets/js/simple-notification-badge.js"></script>

    <script>
        function log(message, isError = false) {
            const logContainer = document.getElementById('test-log');
            const time = new Date().toLocaleTimeString('ar-SA');
            const icon = isError ? 'bi-x-circle text-danger' : 'bi-check-circle text-success';
            
            const logEntry = document.createElement('div');
            logEntry.className = 'mb-2';
            logEntry.innerHTML = `
                <i class="${icon}"></i>
                <span class="ms-2">${message}</span>
                <small class="text-muted ms-2">(${time})</small>
            `;
            
            if (logContainer.firstChild.classList?.contains('text-muted')) {
                logContainer.innerHTML = '';
            }
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function initializeComponents() {
            try {
                // تهيئة أيقونة الإشعارات
                if (window.simpleNotificationBadge) {
                    window.simpleNotificationBadge.init('notification-container');
                    log('✅ تم تهيئة أيقونة الإشعارات');
                } else {
                    log('❌ لم يتم العثور على مكون الإشعارات', true);
                }
                
                // تهيئة خدمة الإشعارات
                if (window.simpleNotificationService) {
                    log('✅ خدمة الإشعارات جاهزة');
                } else {
                    log('❌ خدمة الإشعارات غير متاحة', true);
                }
                
            } catch (error) {
                log(`❌ خطأ في تهيئة المكونات: ${error.message}`, true);
            }
        }
        
        async function testBasicNotification() {
            try {
                log('🔄 جاري إنشاء إشعار بسيط...');
                
                if (!window.simpleNotificationService) {
                    throw new Error('خدمة الإشعارات غير متاحة');
                }
                
                await window.simpleNotificationService.sendNotification({
                    recipientId: 'test-user-' + Date.now(),
                    type: 'file_upload',
                    title: 'اختبار بسيط',
                    message: 'تم إنشاء إشعار تجريبي بنجاح',
                    data: { fileName: 'test.pdf' }
                });
                
                log('✅ تم إنشاء الإشعار البسيط بنجاح');
                
            } catch (error) {
                log(`❌ خطأ في الإشعار البسيط: ${error.message}`, true);
            }
        }
        
        async function testMultipleNotifications() {
            try {
                log('🔄 جاري إنشاء إشعارات متعددة...');
                
                if (!window.simpleNotificationService) {
                    throw new Error('خدمة الإشعارات غير متاحة');
                }
                
                const userIds = ['user-1', 'user-2', 'user-3'];
                const notifications = [
                    { title: 'إشعار رقم 1', message: 'رسالة الإشعار الأول' },
                    { title: 'إشعار رقم 2', message: 'رسالة الإشعار الثاني' }
                ];
                
                await window.simpleNotificationService.sendBulkNotification(
                    userIds, 
                    'file_movement', 
                    notifications
                );
                
                log('✅ تم إنشاء الإشعارات المتعددة بنجاح');
                
            } catch (error) {
                log(`❌ خطأ في الإشعارات المتعددة: ${error.message}`, true);
            }
        }
        
        async function testAlertNotification() {
            try {
                log('🔄 جاري إنشاء تنبيه مهم...');
                
                if (!window.simpleNotificationService) {
                    throw new Error('خدمة الإشعارات غير متاحة');
                }
                
                await window.simpleNotificationService.sendSystemNotification({
                    type: 'security_alert',
                    title: 'تنبيه أمني مهم',
                    message: 'تم اكتشاف نشاط مشبوه في النظام',
                    data: { alertLevel: 'high' },
                    priority: 'high'
                });
                
                log('✅ تم إرسال التنبيه المهم بنجاح');
                
            } catch (error) {
                log(`❌ خطأ في التنبيه المهم: ${error.message}`, true);
            }
        }
        
        function clearResults() {
            const logContainer = document.getElementById('test-log');
            logContainer.innerHTML = '<div class="text-muted">انقر على أحد الأزرار لبدء الاختبار...</div>';
            
            // مسح الإشعارات من النظام أيضاً
            if (window.simpleNotificationService) {
                window.simpleNotificationService.clearAll();
            }
            
            log('🗑️ تم مسح النتائج والإشعارات');
        }
        
        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            log('📱 تم تحميل صفحة الاختبار');
        });
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
