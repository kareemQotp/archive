<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تسجيل الدخول - نظام الأرشيف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; padding: 2rem; }
        .test-container { max-width: 800px; margin: 0 auto; }
        .test-result { margin: 1rem 0; padding: 1rem; border-radius: 8px; }
        .test-success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .test-error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .test-warning { background-color: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        .log-item { margin: 0.5rem 0; padding: 0.5rem; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 0.9rem; }
        .log-container { max-height: 400px; overflow-y: auto; }
        #logContainer { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="mb-4">
            <i class="fas fa-sign-in-alt me-2"></i>
            اختبار نظام تسجيل الدخول
        </h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>معلومات النظام</h3>
                <div id="systemInfo"></div>
                
                <h3 class="mt-4">اختبار سريع</h3>
                <div class="mb-3">
                    <input type="email" class="form-control mb-2" id="testEmail" placeholder="البريد الإلكتروني" value="admin123@aman.eg">
                    <input type="password" class="form-control mb-2" id="testPassword" placeholder="كلمة المرور">
                    <button class="btn btn-primary" onclick="testLogin()">اختبار تسجيل الدخول</button>
                </div>
            </div>
            <div class="col-md-6">
                <div id="logContainer" class="log-container"></div>
                <button class="btn btn-secondary btn-sm mt-2" onclick="clearLogs()">مسح السجل</button>
            </div>
            </div>
        </div>
        
        <div class="mt-4">
            <h3>نتائج الاختبارات</h3>
            <div id="testResults"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-functions-compat.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    <script src="assets/js/unified-auth.js"></script>

    <script>
        let authSystem;
        const logs = [];
        
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            logs.push({ timestamp, message, type });
            updateLogDisplay();
        }
        
        function updateLogDisplay() {
            const container = document.getElementById('logContainer');
            container.innerHTML = logs.map(log => 
                `<div class="log-item">[${log.timestamp}] ${log.message}</div>`
            ).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        function clearLogs() {
            logs.length = 0;
            updateLogDisplay();
        }
        
        function addTestResult(name, status, message = '') {
            const container = document.getElementById('testResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result test-${status}`;
            
            const icon = status === 'success' ? 'check-circle' : 
                        status === 'error' ? 'times-circle' : 'exclamation-triangle';
            
            resultDiv.innerHTML = `
                <div class="d-flex align-items-center">
                    <i class="fas fa-${icon} me-2"></i>
                    <strong>${name}</strong>
                    ${message ? `<span class="ms-2">- ${message}</span>` : ''}
                </div>
            `;
            
            container.appendChild(resultDiv);
        }
        
        async function initializeTests() {
            addLog('بدء تهيئة النظام...');
            
            // Wait for unified auth to initialize
            await new Promise(resolve => {
                const checkAuth = () => {
                    if (window.unifiedAuth && unifiedAuth.isInitialized) {
                        authSystem = unifiedAuth;
                        addLog('تم تهيئة نظام المصادقة الموحد');
                        resolve();
                    } else {
                        setTimeout(checkAuth, 100);
                    }
                };
                checkAuth();
            });
            
            // Update system info
            updateSystemInfo();
            
            // Run tests
            runSystemTests();
        }
        
        function updateSystemInfo() {
            const container = document.getElementById('systemInfo');
            container.innerHTML = `
                <div class="test-result test-success">
                    <strong>نظام المصادقة:</strong> ${authSystem ? 'متصل' : 'غير متصل'}<br>
                    <strong>Firebase Auth:</strong> ${window.auth ? 'متوفر' : 'غير متوفر'}<br>
                    <strong>Firebase Firestore:</strong> ${window.db ? 'متوفر' : 'غير متوفر'}<br>
                    <strong>Firebase Storage:</strong> ${window.storage ? 'متوفر' : 'غير متوفر'}<br>
                    <strong>حالة المستخدم:</strong> ${authSystem && authSystem.isAuthenticated ? 'مسجل دخول' : 'غير مسجل دخول'}
                </div>
            `;
        }
        
        function runSystemTests() {
            addLog('تشغيل اختبارات النظام...');
            
            // Test 1: Firebase Init
            if (window.firebase && window.auth && window.db) {
                addTestResult('تهيئة Firebase', 'success', 'جميع الخدمات متوفرة');
                addLog('✅ Firebase تم تهيئته بنجاح');
            } else {
                addTestResult('تهيئة Firebase', 'error', 'بعض الخدمات غير متوفرة');
                addLog('❌ خطأ في تهيئة Firebase');
            }
            
            // Test 2: UnifiedAuth
            if (authSystem && authSystem.isInitialized) {
                addTestResult('نظام المصادقة الموحد', 'success', 'تم التهيئة بنجاح');
                addLog('✅ نظام المصادقة الموحد جاهز');
            } else {
                addTestResult('نظام المصادقة الموحد', 'error', 'فشل في التهيئة');
                addLog('❌ خطأ في نظام المصادقة الموحد');
            }
            
            // Test 3: Auth State
            auth.onAuthStateChanged((user) => {
                if (user) {
                    addLog(`🟢 مستخدم مسجل دخول: ${user.email}`);
                    updateSystemInfo();
                } else {
                    addLog('🔴 لا يوجد مستخدم مسجل دخول');
                }
            });
        }
        
        async function testLogin() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            if (!email || !password) {
                addLog('❌ يرجى إدخال البريد الإلكتروني وكلمة المرور');
                return;
            }
            
            addLog(`⏳ محاولة تسجيل الدخول: ${email}`);
            
            try {
                const result = await authSystem.signIn(email, password);
                addLog(`✅ نجح تسجيل الدخول: ${result.message}`);
                addTestResult('اختبار تسجيل الدخول', 'success', 'تم بنجاح');
                
                // Test redirect
                setTimeout(() => {
                    addLog('⏳ اختبار الانتقال...');
                    const redirectUrl = 'dashboard.html';
                    addLog(`🔄 سيتم الانتقال إلى: ${redirectUrl}`);
                    
                    // Don't actually redirect in test mode
                    addTestResult('اختبار الانتقال', 'success', `جاهز للانتقال إلى ${redirectUrl}`);
                }, 1000);
                
            } catch (error) {
                addLog(`❌ فشل تسجيل الدخول: ${error.message}`);
                addTestResult('اختبار تسجيل الدخول', 'error', error.message);
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeTests);
    </script>
</body>
</html>
