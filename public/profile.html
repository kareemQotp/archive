<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - نظام الأرشيف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ocean-deep: #1a365d;
            --ocean-blue: #2d5a87;
            --ocean-light: #4299e1;
            --wave-foam: #bee3f8;
            --sand-light: #fef5e7;
            --coral: #ed8936;
            --gradient-ocean: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-sunset: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-aurora: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            background: var(--gradient-ocean);
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        .profile-header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            margin: 2rem auto;
            max-width: 600px;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .profile-avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .status-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .status-active { background: #48bb78; }
        .status-pending { background: #ed8936; }
        .status-inactive { background: #e53e3e; }

        .profile-info h2 {
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--ocean-deep);
            font-size: 2.2rem;
        }

        .profile-subtitle {
            color: var(--ocean-blue);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .info-card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: var(--gradient-ocean);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-card h5 {
            font-weight: 600;
            color: var(--ocean-deep);
            margin-bottom: 0.5rem;
        }

        .info-card p {
            color: var(--ocean-blue);
            margin: 0;
        }

        .badge-custom {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid transparent;
        }

        .badge-admin {
            background: var(--gradient-sunset);
            color: white;
        }

        .badge-manager {
            background: var(--gradient-aurora);
            color: white;
        }

        .badge-user {
            background: var(--gradient-ocean);
            color: white;
        }

        .badge-pending {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
        }

        .profile-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .btn-custom {
            padding: 0.75rem 2rem;
            border-radius: 30px;
            font-weight: 600;
            text-transform: none;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary-custom {
            background: var(--gradient-ocean);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-outline-custom {
            background: rgba(255, 255, 255, 0.8);
            color: var(--ocean-deep);
            border: 2px solid var(--ocean-light);
        }

        .btn-outline-custom:hover {
            background: var(--ocean-light);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(67, 153, 225, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ocean-deep);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--ocean-blue);
            margin-top: 0.25rem;
        }

        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .text-purple {
            color: #9f7aea !important;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }

        .toast-container {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 9999;
        }

        .stats-hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .profile-header {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
            
            .profile-avatar {
                width: 120px;
                height: 120px;
            }
            
            .profile-info h2 {
                font-size: 1.8rem;
            }
            
            .info-cards {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .profile-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-custom {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
    <script defer src="assets/js/format-utils.js"></script>
    <script defer src="assets/js/ux-core.js"></script>
</head>
<body>

            <div class="profile-info">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    
    <!-- Unified Authentication System -->
    <script src="assets/js/unified-auth.js"></script>
    
    <!-- Core Systems -->
    <script src="assets/js/activity-logger.js"></script>
    <script src="assets/js/ui-permission-controller.js"></script>
    <!-- Unified UI Template System -->
    <script src="assets/js/unified-ui-template.js"></script>
    
    <script>
        // نظام المصادقة الموحد والملف الشخصي
        let currentUserData = null;
        let sidebarManager = null;

        // دالة مساعدة لعرض التنبيهات
        function showAlert(message, type = 'info') {
            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    title: type === 'error' ? 'خطأ' : type === 'success' ? 'نجح' : 'تنبيه',
                    text: message,
                    icon: type === 'error' ? 'error' : type === 'success' ? 'success' : 'info',
                    confirmButtonText: 'موافق'
                });
            } else {
                showToast(message, type === 'error' ? 'danger' : type);
            }
        }

        // دالة مساعدة لتسجيل الأنشطة
        function logActivity(action, details = {}) {
            try {
                if (window.activityLogger && typeof window.activityLogger.logActivity === 'function') {
                    const activityData = {
                        ...details,
                        page: 'profile',
                        timestamp: new Date().toISOString()
                    };
                    
                    if (window.currentUser && window.currentUser.uid) {
                        activityData.userId = window.currentUser.uid;
                    }
                    
                    window.activityLogger.logActivity(action, activityData);
                } else {
                    console.log('Activity:', action, details);
                }
            } catch (error) {
                console.error('خطأ في تسجيل النشاط:', error);
            }
        }

        // انتظار تهيئة Firebase والمصادقة
        async function waitForFirebaseAndAuth() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 100; // زيادة عدد المحاولات
                
                const checkReady = () => {
                    attempts++;
                    
                    if (window.firebase && 
                        window.firebase.auth && 
                        window.firebase.firestore &&
                        window.unifiedAuth) {
                        console.log('✅ جميع أنظمة Firebase جاهزة');
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        console.error('❌ انتهت المحاولات - Firebase لم يتم تحميله');
                        reject(new Error('Firebase initialization timeout'));
                    } else {
                        if (attempts % 10 === 0) {
                            console.log(`⏳ محاولة ${attempts}/${maxAttempts} - انتظار Firebase...`);
                        }
                        setTimeout(checkReady, 200); // زيادة الفترة بين المحاولات
                    }
                };
                
                checkReady();
            });
        }

        // تهيئة الصفحة الرئيسية
        document.addEventListener('DOMContentLoaded', async function() {
            // Refresh Unified UI if present; avoid instantiating to prevent duplicates
            if (window.unifiedUI && typeof window.unifiedUI.updateSidebar === 'function') {
                try { await window.unifiedUI.updateSidebar(); } catch (_) { /* ignore */ }
            }
            ensureSidebar();
            try {
                console.log('🚀 بدء تهيئة صفحة الملف الشخصي...');
                
                logActivity('page_access', {
                    path: window.location.pathname
                });

                // إظهار محمل أثناء التحميل
                showLoading('جاري تهيئة النظام...');
                
                // انتظار تهيئة Firebase والمصادقة
                await waitForFirebaseAndAuth();
                console.log('✅ Firebase ونظام المصادقة جاهزان');

                // تهيئة مدير الشريط الجانبي
                if (window.SidebarManager) {
                    sidebarManager = new SidebarManager();
                    console.log('✅ تم تهيئة مدير الشريط الجانبي');
                }

                // التحقق من المصادقة مع انتظار أطول
                console.log('🔍 فحص حالة المستخدم...');
                let user = firebase.auth().currentUser;
                
                if (!user) {
                    console.log('⏳ انتظار تحميل حالة المستخدم...');
                    // انتظار أطول لتحميل حالة المستخدم
                    await new Promise(resolve => {
                        let authCheckAttempts = 0;
                        const maxAuthAttempts = 10;
                        
                        const checkAuth = () => {
                            authCheckAttempts++;
                            const currentUser = firebase.auth().currentUser;
                            
                            if (currentUser) {
                                console.log(`✅ تم العثور على المستخدم في المحاولة ${authCheckAttempts}`);
                                user = currentUser;
                                resolve();
                            } else if (authCheckAttempts >= maxAuthAttempts) {
                                console.log(`❌ لم يتم العثور على مستخدم بعد ${maxAuthAttempts} محاولات`);
                                resolve();
                            } else {
                                console.log(`🔄 محاولة ${authCheckAttempts}/${maxAuthAttempts} - فحص المستخدم...`);
                                setTimeout(checkAuth, 500);
                            }
                        };
                        
                        // بدء الفحص فوراً
                        checkAuth();
                        
                        // إعداد مستمع لتغيير حالة المصادقة
                        const unsubscribe = firebase.auth().onAuthStateChanged((authUser) => {
                            if (authUser) {
                                console.log('📡 تم استلام إشعار تغيير حالة المصادقة:', authUser.email);
                                user = authUser;
                                unsubscribe();
                                resolve();
                            }
                        });
                        
                        // انتظار إضافي كحد أقصى
                        setTimeout(() => {
                            unsubscribe();
                            if (!user) {
                                user = firebase.auth().currentUser;
                                if (user) {
                                    console.log('⏰ تم العثور على المستخدم في الفحص النهائي');
                                }
                            }
                            resolve();
                        }, 5000);
                    });
                }

                if (!user) {
                    // Check for demo mode
                    const demoMode = localStorage.getItem('archiveDemoMode');
                    if (demoMode === 'enabled') {
                        console.log('🎭 Profile في وضع العرض التوضيحي');
                        showProfileDemoNotice();
                        enableProfileDemoMode();
                        return;
                    }
                    
                    console.log('❌ المستخدم غير مسجل دخول، إعادة توجيه لصفحة تسجيل الدخول');
                    logActivity('auth_redirect', {
                        reason: 'user_not_authenticated',
                        page: 'profile'
                    });
                    hideLoading();
                    
                    // إظهار رسالة ودية
                    showAlert('يجب تسجيل الدخول أولاً للوصول إلى الملف الشخصي.', 'info');
                    
                    // انتظار ثانيتين ثم إعادة التوجيه
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                    return;
                }

                window.currentUser = user;
                console.log('✅ المستخدم مسجل دخول:', user.email);

                // تعطيل وضع العرض التوضيحي بعد تسجيل الدخول الحقيقي
                try {
                    if (localStorage.getItem('archiveDemoMode') || localStorage.getItem('demo_mode')) {
                        localStorage.removeItem('archiveDemoMode');
                        localStorage.removeItem('demo_mode');
                        console.log('🧹 تم تعطيل وضع العرض التوضيحي بعد تسجيل الدخول الحقيقي');
                    }
                } catch (_) {}

                logActivity('auth_success', {
                    user_email: user.email
                });

                // تحديث معلومات المستخدم الأساسية
                updateBasicUserInfo(user);

                // تحديث الشريط العلوي فوراً لعرض حالة تسجيل الدخول حتى قبل تحميل التفاصيل
                try {
                    window.unifiedAuth = window.unifiedAuth || {};
                    window.unifiedAuth.currentUser = {
                        uid: user.uid,
                        displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'مستخدم'),
                        email: user.email
                    };
                    if (window.unifiedUI && typeof window.unifiedUI.updateSidebar === 'function') {
                        await window.unifiedUI.updateSidebar();
                    }
                    ensureSidebar();
                } catch (_) {}
                
                // تحميل البيانات المفصلة
                await loadUserDetails(user);

                // مزامنة حالة المصادقة مع نظام الواجهة الموحد وتحديث الشريط والقائمة
                try {
                    const roleMap = { 'super-admin': 'admin' };
                    const uiRole = roleMap[(currentUserData?.role || '').toLowerCase?.() || currentUserData?.role] || (currentUserData?.role || 'viewer');
                    window.unifiedAuth = window.unifiedAuth || {};
                    window.unifiedAuth.currentUser = {
                        uid: user.uid,
                        displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'مستخدم'),
                        email: user.email,
                        role: uiRole,
                        department: currentUserData?.department || currentUserData?.departmentName || undefined,
                        photoURL: user.photoURL || currentUserData?.photoURL || undefined
                    };

                    if (window.unifiedUI && typeof window.unifiedUI.updateSidebar === 'function') {
                        await window.unifiedUI.updateSidebar();
                    }
                    // بث حدث جاهزية المصادقة للصفحات التي تعتمد عليه
                    try { document.dispatchEvent(new Event('firebaseAuthReady')); } catch (_) {}
                    ensureSidebar();
                } catch (syncErr) {
                    console.warn('⚠️ فشل في مزامنة واجهة المستخدم الموحدة:', syncErr);
                }

                hideLoading();
                console.log('🎉 تم تهيئة صفحة الملف الشخصي بنجاح!');

            } catch (error) {
                console.error('❌ خطأ في تهيئة الصفحة:', error);
                hideLoading();
                logActivity('page_error', {
                    error: error.message
                });
                showAlert('حدث خطأ في تحميل الصفحة. يرجى إعادة تحميل الصفحة.', 'error');
            }

            // تشغيل اختبار المصادقة بعد 2 ثانية من تحميل الصفحة
            setTimeout(checkAuthStatus, 2000);
        });

        // تمت إزالة نسخ مكررة من showToast/createToastContainer/showLoading/hideLoading لتفادي التعارض

        // محول آمن لأنواع التواريخ المختلفة إلى كائن Date
        function toJsDate(value) {
            try {
                if (!value) return null;
                if (typeof value.toDate === 'function') return value.toDate(); // Firestore Timestamp
                if (value instanceof Date) return value;
                if (typeof value === 'number') return new Date(value);
                if (typeof value === 'string') {
                    const d = new Date(value);
                    return isNaN(d.getTime()) ? null : d;
                }
                return null;
            } catch {
                return null;
            }
        }

        // ضمان وجود الشريط الجانبي وإنشائه عند الحاجة
        function ensureSidebar() {
            try {
                // إذا كان نظام الواجهة الموحد موجودًا فسيقوم بإنشائه، لكن نضيف حارسًا إضافيًا
                let sidebar = document.getElementById('sidebar');
                if (!sidebar) {
                    sidebar = document.createElement('aside');
                    sidebar.id = 'sidebar';
                    sidebar.className = 'sidebar';
                    try { sidebar.setAttribute('aria-hidden', 'true'); } catch(_) {}
                    document.body.appendChild(sidebar);
                }
                // إذا تم إنشاء العنصر لكن بدون محتوى، اطلب من النظام الموحد إعادة الرسم
                if (window.unifiedUI && typeof window.unifiedUI.renderSidebar === 'function' && (!sidebar.innerHTML || sidebar.innerHTML.trim() === '')) {
                    try { window.unifiedUI.renderSidebar(); } catch(_) {}
                }
                if (!document.querySelector('.sidebar-overlay')) {
                    const overlay = document.createElement('div');
                    overlay.className = 'sidebar-overlay';
                    overlay.id = 'sidebarOverlay';
                    document.body.appendChild(overlay);
                }
                // تأكد من وجود زر الفتح ويعمل
                const menuBtn = document.getElementById('menuToggle');
                if (menuBtn && !menuBtn.dataset.bound) {
                    menuBtn.dataset.bound = '1';
                    menuBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (window.unifiedUI && typeof window.unifiedUI.toggleSidebar === 'function') {
                            window.unifiedUI.toggleSidebar();
                        } else {
                            // Fallback: قم بالتبديل وتحديث aria-hidden لضمان الظهور
                            const wasOpen = sidebar.classList.contains('active');
                            sidebar.classList.toggle('active');
                            const overlayEl = document.querySelector('.sidebar-overlay');
                            if (overlayEl) overlayEl.classList.toggle('active');
                            document.body.classList.toggle('sidebar-open');
                            try { sidebar.setAttribute('aria-hidden', wasOpen ? 'true' : 'false'); } catch(_) {}
                        }
                    });
                }

                // معالج بديل لإغلاق القائمة عند الضغط على الخلفية في حال غياب النظام الموحد
                const overlayEl = document.querySelector('.sidebar-overlay');
                if (overlayEl && !overlayEl.dataset.bound) {
                    overlayEl.dataset.bound = '1';
                    overlayEl.addEventListener('click', () => {
                        if (window.unifiedUI && typeof window.unifiedUI.closeSidebar === 'function') {
                            window.unifiedUI.closeSidebar();
                        } else if (sidebar) {
                            sidebar.classList.remove('active');
                            try { sidebar.setAttribute('aria-hidden', 'true'); } catch(_) {}
                            overlayEl.classList.remove('active');
                            document.body.classList.remove('sidebar-open');
                        }
                    });
                }
            } catch (e) {
                console.warn('ensureSidebar() failed:', e);
            }
        }

        // Fallback binding: some async navbar re-renders can replace #menuToggle element.
        // Use delegated listener to keep mobile sidebar toggle reliable.
        (function bindDelegatedMenuToggle() {
            if (window.__profileSidebarToggleBound) return;
            window.__profileSidebarToggleBound = true;

            document.addEventListener('click', (e) => {
                const menuBtn = e.target.closest('#menuToggle');
                if (!menuBtn) return;
                if (window.unifiedUI && typeof window.unifiedUI.toggleSidebar === 'function') {
                    e.preventDefault();
                    window.unifiedUI.toggleSidebar();
                }
            });
        })();

        function updateDates(userData) {
            // مزامنة آخر تسجيل دخول من Firebase Auth (أدق مصدر للوقت)
            try {
                const authUser = (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth().currentUser : null;
                const authLast = authUser?.metadata?.lastSignInTime ? new Date(authUser.metadata.lastSignInTime) : null;
                const fsLast = toJsDate(userData.lastLogin);
                if (authLast && (!fsLast || authLast > fsLast)) {
                    userData.lastLogin = authLast; // استخدم الأحدث لعرض الواجهة
                }
            } catch (_) { /* تجاهل أي أخطاء غير حرجة */ }
            // تاريخ الانضمام
            const joinDate = toJsDate(userData.createdAt);
            if (joinDate) {
                document.getElementById('profileJoinDate').textContent = joinDate.toLocaleDateString('ar-SA');
            } else {
                document.getElementById('profileJoinDate').textContent = 'غير متوفر';
            }
            
            // آخر دخول
            const lastLogin = toJsDate(userData.lastLogin);
            if (lastLogin) {
                const now = new Date();
                const diffTime = now - lastLogin;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let lastLoginText;
                if (diffDays === 0) {
                    lastLoginText = 'اليوم';
                } else if (diffDays === 1) {
                    lastLoginText = 'أمس';
                } else if (diffDays < 7) {
                    lastLoginText = `منذ ${diffDays} أيام`;
                } else {
                    lastLoginText = lastLogin.toLocaleDateString('ar-SA');
                }
                
                document.getElementById('profileLastLogin').textContent = lastLoginText;
            } else {
                document.getElementById('profileLastLogin').textContent = 'غير متوفر';
            }
        }

        function updateUserStatus(status, isActive) {
            const statusElement = document.getElementById('profileStatus');
            const statusIndicator = document.getElementById('statusIndicator');
            
            let statusText = 'غير محدد';
            let indicatorClass = 'status-inactive';

            const normalized = (status || '').toString().toLowerCase();
            const activeStatuses = ['active', 'approved'];
            const hasAuthUser = (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) ? true : false;
            const effectiveActive = (isActive !== false) && hasAuthUser && !['suspended', 'rejected', 'disabled'].includes(normalized);

            if (normalized === 'pending') {
                statusText = 'في انتظار الموافقة';
                indicatorClass = 'status-pending';
            } else if (['suspended', 'rejected'].includes(normalized)) {
                statusText = normalized === 'suspended' ? 'معلق' : 'مرفوض';
                indicatorClass = 'status-inactive';
            } else if ((activeStatuses.includes(normalized) || normalized === '') && effectiveActive) {
                // نشط إذا كانت الحالة Active/Approved أو غير محددة مع وجود جلسة مصادقة
                statusText = 'نشط';
                indicatorClass = 'status-active';
            } else {
                statusText = 'غير نشط';
                indicatorClass = 'status-inactive';
            }
            
            statusElement.textContent = statusText;
            statusIndicator.className = `status-indicator ${indicatorClass}`;
            statusIndicator.title = `حالة المستخدم: ${statusText}`;
        }

        async function loadUserStats(userId) {
            try {
                console.log('📊 تحميل إحصائيات المستخدم...');
                
                if (!firebase.firestore) {
                    console.warn('⚠️ Firestore غير متوفر، استخدام الإحصائيات الافتراضية');
                    setDefaultStats();
                    return;
                }
                
                // عدد المستندات: ندعم أكثر من حقل للإسناد (uploadedBy / createdBy / ownerId)
                const fs = firebase.firestore();
                const docQueries = [
                    fs.collection('documents').where('uploadedBy', '==', userId).get().catch(() => null),
                    fs.collection('documents').where('createdBy', '==', userId).get().catch(() => null),
                    fs.collection('documents').where('ownerId', '==', userId).get().catch(() => null)
                ];

                const [q1, q2, q3, downloadsSnap, activitiesSnap] = await Promise.all([
                    ...docQueries,
                    // عدد مرات التحميل
                    fs.collection('downloads').where('userId', '==', userId).get().catch(() => null),
                    // عدد الأنشطة (activity_logs)
                    fs.collection('activity_logs').where('userId', '==', userId).orderBy('timestamp', 'desc').limit(100).get().catch(() => null)
                ]);

                const docIdSet = new Set();
                [q1, q2, q3].forEach(snap => {
                    if (snap && typeof snap.forEach === 'function') {
                        snap.forEach(d => {
                            const data = d.data() || {};
                            const state = (data.status || 'active').toString().toLowerCase();
                            if (state !== 'deleted' && state !== 'archived') {
                                docIdSet.add(d.id);
                            }
                        });
                    }
                });

                const stats = {
                    documents: docIdSet.size,
                    uploads: docIdSet.size,
                    downloads: (downloadsSnap && typeof downloadsSnap.size === 'number') ? downloadsSnap.size : 0,
                    activity: (activitiesSnap && typeof activitiesSnap.size === 'number') ? activitiesSnap.size : 0
                };
                
                // تحديث العناصر في الواجهة
                document.getElementById('statDocuments').textContent = stats.documents;
                document.getElementById('statUploads').textContent = stats.uploads;
                document.getElementById('statDownloads').textContent = stats.downloads;
                document.getElementById('statActivity').textContent = stats.activity;
                
                // إظهار قسم الإحصائيات
                document.getElementById('userStats').classList.remove('stats-hidden');
                
                console.log('✅ تم تحميل الإحصائيات:', stats);
                
            } catch (error) {
                console.error('❌ خطأ في تحميل الإحصائيات:', error);
                setDefaultStats();
            }
        }

                        error: error.message
                    });
                    showAlert('حدث خطأ في تسجيل الخروج', 'error');
                }
            }
        }

        function editProfile() {
            const modal = `
                <div class="modal fade" id="editProfileModal" tabindex="-1">
                    <div class="modal-dialog modal-lg modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">تعديل البيانات الشخصية</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="editProfileForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="editDisplayName" class="form-label">الاسم الكامل</label>
                                            <input type="text" class="form-control" id="editDisplayName" value="${currentUserData?.displayName || ''}">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="editEmail" class="form-label">البريد الإلكتروني</label>
                                            <input type="email" class="form-control" id="editEmail" value="${(firebase.auth().currentUser?.email || window.currentUser?.email || '')}" readonly>
                                            <div class="form-text">لا يمكن تغيير البريد الإلكتروني</div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="editPhone" class="form-label">رقم الهاتف</label>
                                            <input type="tel" class="form-control" id="editPhone" value="${currentUserData?.phone || ''}">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="editDepartment" class="form-label">الإدارة</label>
                                            <input type="text" class="form-control" id="editDepartment" value="${currentUserData?.departmentName || ''}" readonly>
                                            <div class="form-text">يتم تحديدها من قبل المدير</div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editBio" class="form-label">نبذة شخصية</label>
                                        <textarea class="form-control" id="editBio" rows="3" placeholder="اكتب نبذة مختصرة عن نفسك...">${currentUserData?.bio || ''}</textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editAvatar" class="form-label">الصورة الشخصية</label>
                                        <input type="file" class="form-control" id="editAvatar" accept="image/*">
                                        <div class="form-text">أقصى حجم: 2 ميجابايت. الصيغ المدعومة: JPG, PNG, WebP</div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                                <button type="button" class="btn btn-primary" onclick="saveProfileChanges()">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="saveSpinner"></span>
                                    حفظ التغييرات
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // إضافة المودال إلى الصفحة وعرضه
            document.body.insertAdjacentHTML('beforeend', modal);
            const modalElement = new bootstrap.Modal(document.getElementById('editProfileModal'));
            modalElement.show();
            
            // إزالة المودال بعد الإغلاق
            document.getElementById('editProfileModal').addEventListener('hidden.bs.modal', function () {
                this.remove();
            });
        }

        async function saveProfileChanges() {
            const saveBtn = document.querySelector('#editProfileModal .btn-primary');
            const spinner = document.getElementById('saveSpinner');
            
            try {
                // إظهار محمل
                saveBtn.disabled = true;
                spinner.classList.remove('d-none');
                
                const user = firebase.auth().currentUser;
                if (!user) {
                    throw new Error('لم يتم العثور على المستخدم');
                }
                
                // جمع البيانات من النموذج
                const updates = {
                    displayName: document.getElementById('editDisplayName').value.trim(),
                    phone: document.getElementById('editPhone').value.trim(),
                    bio: document.getElementById('editBio').value.trim(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                // رفع الصورة إذا تم اختيارها
                const avatarFile = document.getElementById('editAvatar').files[0];
                if (avatarFile) {
                    // التحقق من حجم الملف
                    if (avatarFile.size > 2 * 1024 * 1024) {
                        throw new Error('حجم الصورة كبير جداً. الحد الأقصى 2 ميجابايت');
                    }
                    
                    // رفع الصورة إلى Firebase Storage
                    if (firebase.storage) {
                        const storageRef = firebase.storage().ref();
                        const avatarRef = storageRef.child(`users/${user.uid}/avatar.jpg`);
                        const snapshot = await avatarRef.put(avatarFile, {
                            customMetadata: {
                                skipThumbnail: 'true',
                                originalName: avatarFile.name,
                                uploadedAt: new Date().toISOString()
                            }
                        });
                        const downloadURL = await snapshot.ref.getDownloadURL();
                        updates.photoURL = downloadURL;
                        
                        // تحديث صورة المستخدم في Firebase Auth
                        await user.updateProfile({ photoURL: downloadURL });
                    }
                }
                
                // تحديث اسم المستخدم في Firebase Auth إذا تغير
                if (updates.displayName && updates.displayName !== user.displayName) {
                    await user.updateProfile({ displayName: updates.displayName });
                }
                
                // تحديث البيانات في Firestore
                await firebase.firestore().collection('users').doc(user.uid).update(updates);
                
                // تسجيل النشاط
                logActivity('profile_update', {
                    action: 'تحديث الملف الشخصي',
                    changes: Object.keys(updates).filter(key => key !== 'updatedAt')
                });
                
                // إظهار رسالة نجاح
                showAlert('تم حفظ التغييرات بنجاح', 'success');
                
                // إغلاق المودال
                bootstrap.Modal.getInstance(document.getElementById('editProfileModal')).hide();
                
                // إعادة تحميل بيانات المستخدم
                await loadUserDetails(user);
                
            } catch (error) {
                console.error('❌ خطأ في حفظ التغييرات:', error);
                showAlert(`حدث خطأ في حفظ التغييرات: ${error.message}`, 'error');
                
                // تسجيل الخطأ
                logActivity('profile_update_error', {
                    action: 'خطأ في تحديث الملف الشخصي',
                    error: error.message
                });
            } finally {
                // إخفاء المحمل
                saveBtn.disabled = false;
                spinner.classList.add('d-none');
            }
        }

        async function changePassword() {
            try {
                const user = firebase.auth().currentUser;
                if (user && user.email) {
                    const confirmed = confirm('سيتم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني. هل تريد المتابعة؟');
                    if (confirmed) {
                        showLoading('جاري إرسال البريد الإلكتروني...');
                        
                        await firebase.auth().sendPasswordResetEmail(user.email);
                        
                        hideLoading();
                        showAlert('تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني', 'success');
                        
                        logActivity('password_reset_request', {
                            action: 'طلب إعادة تعيين كلمة المرور',
                            email: user.email
                        });
                    }
                } else {
                    showAlert('لم يتم العثور على بيانات المستخدم', 'error');
                }
            } catch (error) {
                console.error('❌ خطأ في إرسال البريد الإلكتروني:', error);
                hideLoading();
                logActivity('password_reset_error', {
                    error: error.message
                });
                showAlert('حدث خطأ في إرسال البريد الإلكتروني. يرجى المحاولة مرة أخرى.', 'error');
            }
        }

        async function viewActivity() {
            try {
                const user = firebase.auth().currentUser;
                if (!user) {
                    showAlert('لم يتم العثور على المستخدم', 'error');
                    return;
                }
                
                showLoading('جاري تحميل سجل النشاط...');
                
                // جلب سجل النشاط من Firestore (collection: activity_logs)
                const activitiesQuery = await firebase.firestore().collection('activity_logs')
                    .where('userId', '==', user.uid)
                    .orderBy('timestamp', 'desc')
                    .limit(20)
                    .get();
                
                hideLoading();
                
                let activitiesHTML = '';
                if (activitiesQuery.empty) {
                    activitiesHTML = `
                        <div class="text-center text-muted">
                            <i class="fas fa-history fa-2x mb-3"></i>
                            <p>لا توجد أنشطة مسجلة حتى الآن</p>
                        </div>
                    `;
                } else {
                    activitiesQuery.forEach(doc => {
                        const activity = doc.data();
                        const ts = activity.timestamp;
                        const timestamp = typeof ts === 'number' ? new Date(ts) : (ts && typeof ts.toDate === 'function' ? ts.toDate() : new Date());
                        const timeString = timestamp.toLocaleString('ar-SA');

                        // تحديد الأيقونة واللون بناءً على category/action
                        const category = activity.category || '';
                        const action = activity.action || activity.type || '';
                        let icon = 'fas fa-info-circle';
                        let color = 'text-muted';

                        const a = (action || '').toLowerCase();
                        switch (category) {
                            case 'auth':
                                if (a.includes('login')) { icon = 'fas fa-sign-in-alt'; color = 'text-success'; }
                                else if (a.includes('logout')) { icon = 'fas fa-sign-out-alt'; color = 'text-warning'; }
                                else { icon = 'fas fa-user-shield'; color = 'text-secondary'; }
                                break;
                            case 'file':
                            case 'document':
                                if (a.includes('upload')) { icon = 'fas fa-upload'; color = 'text-info'; }
                                else if (a.includes('download')) { icon = 'fas fa-download'; color = 'text-primary'; }
                                else { icon = 'fas fa-file-alt'; color = 'text-primary'; }
                                break;
                            case 'profile':
                                if (a.includes('update')) { icon = 'fas fa-user-edit'; color = 'text-purple'; }
                                else { icon = 'fas fa-user'; color = 'text-purple'; }
                                break;
                            case 'security':
                                icon = 'fas fa-shield-alt'; color = 'text-danger';
                                break;
                            default:
                                if (a.includes('search')) { icon = 'fas fa-search'; color = 'text-secondary'; }
                        }

                        const label = action || category || 'نشاط';
                        activitiesHTML += `
                            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
                                <div class="d-flex align-items-center">
                                    <i class="${icon} ${color} me-2"></i>
                                    <span>${label}</span>
                                </div>
                                <small class="text-muted">${timeString}</small>
                            </div>
                        `;
                    });
                }
                
                const modal = `
                    <div class="modal fade" id="activityModal" tabindex="-1">
                        <div class="modal-dialog modal-lg modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">
                                        <i class="fas fa-history me-2"></i>
                                        سجل النشاط
                                    </h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
                                    ${activitiesHTML}
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                // إضافة المودال إلى الصفحة وعرضه
                document.body.insertAdjacentHTML('beforeend', modal);
                const modalElement = new bootstrap.Modal(document.getElementById('activityModal'));
                modalElement.show();
                
                // إزالة المودال بعد الإغلاق
                document.getElementById('activityModal').addEventListener('hidden.bs.modal', function () {
                    this.remove();
                });
                
            } catch (error) {
                console.error('❌ خطأ في تحميل سجل النشاط:', error);
                hideLoading();
                showAlert('حدث خطأ في تحميل سجل النشاط', 'error');
            }
        }

        async function refreshProfile() {
            try {
                const refreshBtn = document.querySelector('[onclick="refreshProfile()"]');
                const originalContent = refreshBtn.innerHTML;
                
                // إظهار محمل
                refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>جاري التحديث...';
                refreshBtn.disabled = true;
                
                const user = firebase.auth().currentUser;
                if (user) {
                    await loadUserDetails(user);
                    
                    // تسجيل النشاط
                    logActivity('profile_refresh', {
                        action: 'تحديث بيانات الملف الشخصي',
                        timestamp: new Date()
                    });
                    
                    // إظهار رسالة نجاح مؤقتة
                    refreshBtn.innerHTML = '<i class="fas fa-check me-2"></i>تم التحديث';
                    refreshBtn.classList.remove('btn-outline-custom');
                    refreshBtn.classList.add('btn-success');
                    
                    setTimeout(() => {
                        refreshBtn.innerHTML = originalContent;
                        refreshBtn.classList.remove('btn-success');
                        refreshBtn.classList.add('btn-outline-custom');
                        refreshBtn.disabled = false;
                    }, 2000);
                    
                    showAlert('تم تحديث البيانات بنجاح', 'success');
                }
            } catch (error) {
                console.error('❌ خطأ في تحديث البيانات:', error);
                const refreshBtn = document.querySelector('[onclick="refreshProfile()"]');
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt me-2"></i>تحديث البيانات';
                refreshBtn.disabled = false;
                showAlert('حدث خطأ في تحديث البيانات', 'error');
            }
        }
    </script>
