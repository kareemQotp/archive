<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - نظام الأرشيف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/permissions.css">
    <style>
        :root {
            --ocean-deep: #1a365d;
            --ocean-blue: #2d5a87;
            --ocean-light: #4299e1;
            --wave-foam: #bee3f8;
            --sand-light: #fef5e7;
            --coral: #ed8936;
            --gradient-ocean: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-sunset: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-aurora: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            background: var(--gradient-ocean);
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        .profile-header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            margin: 2rem auto;
            max-width: 600px;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .profile-avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .status-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .status-active { background: #48bb78; }
        .status-pending { background: #ed8936; }
        .status-inactive { background: #e53e3e; }

        .profile-info h2 {
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--ocean-deep);
            font-size: 2.2rem;
        }

        .profile-subtitle {
            color: var(--ocean-blue);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .info-card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: var(--gradient-ocean);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-card h5 {
            font-weight: 600;
            color: var(--ocean-deep);
            margin-bottom: 0.5rem;
        }

        .info-card p {
            color: var(--ocean-blue);
            margin: 0;
        }

        .badge-custom {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid transparent;
        }

        .badge-admin {
            background: var(--gradient-sunset);
            color: white;
        }

        .badge-manager {
            background: var(--gradient-aurora);
            color: white;
        }

        .badge-user {
            background: var(--gradient-ocean);
            color: white;
        }

        .badge-pending {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
        }

        .profile-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .btn-custom {
            padding: 0.75rem 2rem;
            border-radius: 30px;
            font-weight: 600;
            text-transform: none;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary-custom {
            background: var(--gradient-ocean);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-outline-custom {
            background: rgba(255, 255, 255, 0.8);
            color: var(--ocean-deep);
            border: 2px solid var(--ocean-light);
        }

        .btn-outline-custom:hover {
            background: var(--ocean-light);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(67, 153, 225, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ocean-deep);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--ocean-blue);
            margin-top: 0.25rem;
        }

        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .text-purple {
            color: #9f7aea !important;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }

        .toast-container {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 9999;
        }

        .stats-hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .profile-header {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
            
            .profile-avatar {
                width: 120px;
                height: 120px;
            }
            
            .profile-info h2 {
                font-size: 1.8rem;
            }
            
            .info-cards {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .profile-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-custom {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

        <div class="container">

    <div class="container">

            <div class="profile-info">
                <h2 id="profileName">جاري التحميل...</h2>

                <div class="mb-3">
                    <span class="badge badge-custom badge-user" id="profileRole">جاري التحميل...</span>

            </div>

            <!-- معلومات مفصلة -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-card-icon">

                    </div>
                    <h5>الإدارة</h5>

                </div>
                
                <div class="info-card">
                    <div class="info-card-icon">

                    </div>
                    <h5>تاريخ الانضمام</h5>
                    <p id="profileJoinDate">جاري التحميل...</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    
    <script src="assets/js/sidebar.js"></script>
    
    <!-- Core Systems -->

    <!-- Unified Authentication System -->
    <script src="assets/js/ui-permission-controller.js"></script>
    <script src="assets/js/unified-auth.js"></script>
    
    <script>
        // Initialize unified auth system
        let authSystem;
        let permissionController;
        let currentUserData = null;
        let activityLogger;
        let notificationService;

        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Profile page loading...');
            
            // إظهار محمل أثناء التحميل
            showLoading('جاري تهيئة النظام...');
            
            try {
                // انتظار تحميل Firebase أولاً
                await waitForFirebase();
                
                // Wait for unified auth to initialize
                await new Promise(resolve => {
                    const checkAuth = () => {
                        if (window.unifiedAuth && unifiedAuth.isInitialized) {
                            authSystem = unifiedAuth;
                            console.log('Unified auth system initialized');
                            
                            // Initialize permission controller
                            permissionController = new UIPermissionController(authSystem);
                            
                            // Initialize activity logger
                            if (window.ActivityLogger) {
                                activityLogger = new ActivityLogger(authSystem);
                            }
                            
                            // Initialize notification service
                            if (window.NotificationService) {
                                notificationService = new NotificationService(authSystem);
                            }
                            
                            resolve();
                        } else {
                            console.log('Waiting for unified auth...');
                            setTimeout(checkAuth, 100);
                        }
                    };
                    checkAuth();
                });

                console.log('Setting up auth state listener...');
                
                // تحقق فوري من الجلسة الحالية
                const currentUser = authSystem.getCurrentUser();
                if (currentUser) {
                    console.log('Current session found:', currentUser.email);
                    hideLoading();
                    handleAuthStateChange(currentUser);
                } else {
                    console.log('No current session, waiting for auth state change...');
                }
                
                // Set up auth state listener
                authSystem.onAuthStateChanged((user) => {
                    hideLoading();
                    handleAuthStateChange(user);
                });
                
                // إخفاء المحمل بعد 5 ثواني كحد أقصى
                setTimeout(() => {
                    hideLoading();
                    
                    // تحقق نهائي من وجود مستخدم
                    const finalUser = authSystem && authSystem.getCurrentUser();
                    if (!finalUser) {
                        console.log('Final check: No user found after timeout');
                        showToast('انتهت جلسة المستخدم. يرجى تسجيل الدخول مرة أخرى.', 'warning');
                        
                        setTimeout(() => {
                            window.location.href = 'login.html?message=session-expired';
                        }, 2000);
                    }
                }, 5000);
                
            } catch (error) {
                console.error('Error initializing profile page:', error);
                hideLoading();
                showToast('حدث خطأ في تحميل الصفحة', 'danger');
            }
        });

        // دالة تشخيص للمساعدة في الـ debugging
        function debugAuthState() {
            console.log('=== Auth Debug Info ===');
            console.log('Firebase loaded:', typeof firebase !== 'undefined');
            console.log('Firebase auth:', typeof firebase?.auth !== 'undefined');
            console.log('Window auth:', typeof window.auth !== 'undefined');
            console.log('Unified auth:', typeof window.unifiedAuth !== 'undefined');
            console.log('Auth system:', typeof authSystem !== 'undefined');
            console.log('Auth initialized:', authSystem?.isInitialized);
            
            if (authSystem) {
                const currentUser = authSystem.getCurrentUser();
                console.log('Current user:', currentUser ? currentUser.email : 'null');
                console.log('User profile:', authSystem.userProfile);
            }
            
            if (window.auth) {
                console.log('Firebase current user:', window.auth.currentUser ? window.auth.currentUser.email : 'null');
            }
            console.log('======================');
        }

        // دالة مساعدة لاختبار الجلسة
        function testSession() {
            debugAuthState();
            
            if (authSystem && authSystem.getCurrentUser()) {
                showToast('الجلسة نشطة - المستخدم مسجل دخول', 'success');
            } else {
                showToast('لا توجد جلسة نشطة', 'warning');
            }
        }

        // إضافة زر تشخيص مؤقت (يمكن إزالته لاحقاً)
        function addDebugButton() {
            if (document.getElementById('debugBtn')) return;
            
            const debugBtn = document.createElement('button');
            debugBtn.id = 'debugBtn';
            debugBtn.className = 'btn btn-sm btn-outline-info position-fixed';
            debugBtn.style.cssText = 'top: 10px; left: 10px; z-index: 9999;';
            debugBtn.innerHTML = '<i class="fas fa-bug"></i> Debug';
            debugBtn.onclick = testSession;
            document.body.appendChild(debugBtn);
        }

        // إضافة زر التشخيص بعد تحميل الصفحة
        setTimeout(addDebugButton, 1000);
        async function waitForFirebase() {
            return new Promise((resolve) => {
                const checkFirebase = () => {
                    if (typeof firebase !== 'undefined' && firebase.auth && firebase.firestore) {
                        console.log('Firebase loaded successfully');
                        resolve();
                    } else {
                        console.log('Waiting for Firebase...');
                        setTimeout(checkFirebase, 100);
                    }
                };
                checkFirebase();
            });
        }

        async function handleAuthStateChange(user) {
            console.log('Auth state changed:', user ? 'User logged in' : 'No user');
            
            // انتظار التهيئة الكاملة للنظام قبل التحقق
            if (!authSystem || !authSystem.isInitialized) {
                console.log('Auth system not ready yet, waiting...');
                setTimeout(() => handleAuthStateChange(user), 500);
                return;
            }

            // تأخير إضافي للتأكد من تحميل الجلسة
            if (!user) {
                console.log('No user detected initially, waiting for session restore...');
                
                // انتظار محاولة استرداد الجلسة
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // إعادة فحص المستخدم بعد التأخير
                const currentUser = authSystem.getCurrentUser();
                if (!currentUser) {
                    console.log('No authenticated user found after waiting, redirecting to login...');
                    window.location.href = 'login.html?message=session-expired';
                    return;
                } else {
                    console.log('User session restored:', currentUser.email);
                    user = currentUser;
                }
            }

            try {
                console.log('User authenticated, loading profile...');
                
                // Update permission-based UI
                if (permissionController) {
                    permissionController.updateUI();
                }
                
                // Update sidebar with proper role
                if (window.sidebarManager) {
                    const userRole = authSystem.getCurrentUserRole();
                    window.sidebarManager.updateSidebarNav(true, userRole);
                }

                // تحديث معلومات المستخدم الأساسية
                updateBasicUserInfo(user);
                
                // جلب البيانات المفصلة من Firestore
                await loadUserDetails(user);
                
                // تسجيل نشاط زيارة الملف الشخصي
                if (activityLogger) {
                    await activityLogger.logActivity('profile_view', {
                        action: 'عرض الملف الشخصي',
                        page: 'profile.html'
                    });
                }
                
            } catch (error) {
                console.error('خطأ في تحميل بيانات المستخدم:', error);
                // Log error using activity logger if available
                if (activityLogger) {
                    await activityLogger.logActivity('profile_error', {
                        action: 'خطأ في تحميل الملف الشخصي',
                        error: error.message,
                        page: 'profile.html'
                    });
                }
            }
        }

        function updateBasicUserInfo(user) {
            document.getElementById('userInfo').innerHTML = `<i class="fas fa-user me-1"></i> ${user.displayName || user.email}`;
            document.getElementById('profileName').textContent = user.displayName || 'بدون اسم';
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('profileAvatar').src = user.photoURL || 'assets/images/icon-192.png';
        }

        async function loadUserDetails(user) {
            try {
                // Get user data from unified auth system
                currentUserData = authSystem.getCurrentUserData();
                
                if (!currentUserData) {
                    // Fallback: load from Firestore
                    const doc = await authSystem.db.collection('users').doc(user.uid).get();
                    
                    if (doc.exists) {
                        currentUserData = doc.data();
                    }
                }
                
                if (currentUserData) {
                    console.log('User data loaded:', currentUserData);
                    
                    // تحديث الدور
                    updateUserRole(currentUserData.role, currentUserData.status);
                    
                    // تحديث معلومات الإدارة
                    document.getElementById('profileDepartment').textContent = currentUserData.departmentName || currentUserData.department || 'غير محدد';
                    
                    // تحديث التواريخ
                    updateDates(currentUserData);
                    
                    // تحديث حالة المستخدم
                    updateUserStatus(currentUserData.status, currentUserData.isActive);
                    
                    // تحميل الإحصائيات إذا كان المستخدم نشطاً
                    if (currentUserData.isActive && currentUserData.status === 'approved') {
                        await loadUserStats(user.uid);
                    }
                } else {
                    console.warn('User document not found in Firestore');
                    // إظهار بيانات افتراضية
                    setDefaultUserData();
                }                } catch (error) {
                    console.error('Error loading user details:', error);
                    // Log error using console instead of authSystem.logError
                    console.error('User details load error:', { error: error.message, userId: user ? user.uid : 'unknown' });
                    setDefaultUserData();
                }
        }

        function updateUserRole(role, status) {
            const roleElement = document.getElementById('profileRole');
            let roleText = 'مستخدم';
            let roleClass = 'badge-user';
            
            if (status === 'pending') {
                roleText = 'في انتظار الموافقة';
                roleClass = 'badge-pending';
            } else {
                switch (role) {
                    case 'admin':
                    case 'super-admin':
                        roleText = 'مدير النظام';
                        roleClass = 'badge-admin';
                        break;
                    case 'department-admin':
                        roleText = 'مدير إدارة';
                        roleClass = 'badge-manager';
                        break;
                    case 'manager':
                        roleText = 'مدير';
                        roleClass = 'badge-manager';
                        break;
                    case 'editor':
                        roleText = 'محرر';
                        roleClass = 'badge-user';
                        break;
                    case 'viewer':
                        roleText = 'مشاهد';
                        roleClass = 'badge-user';
                        break;
                    default:
                        roleText = role || 'مستخدم';
                }
            }
            
            roleElement.textContent = roleText;
            roleElement.className = `badge badge-custom ${roleClass}`;
        }

        function updateDates(userData) {
            // تاريخ الانضمام
            if (userData.createdAt) {
                const joinDate = userData.createdAt.toDate();
                document.getElementById('profileJoinDate').textContent = joinDate.toLocaleDateString('ar-SA');
            } else {
                document.getElementById('profileJoinDate').textContent = 'غير متوفر';
            }
            
            // آخر دخول
            if (userData.lastLogin) {
                const lastLogin = userData.lastLogin.toDate();
                const now = new Date();
                const diffTime = now - lastLogin;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let lastLoginText;
                if (diffDays === 0) {
                    lastLoginText = 'اليوم';
                } else if (diffDays === 1) {
                    lastLoginText = 'أمس';
                } else if (diffDays < 7) {
                    lastLoginText = `منذ ${diffDays} أيام`;
                } else {
                    lastLoginText = lastLogin.toLocaleDateString('ar-SA');
                }
                
                document.getElementById('profileLastLogin').textContent = lastLoginText;
            } else {
                document.getElementById('profileLastLogin').textContent = 'غير متوفر';
            }
        }

        function updateUserStatus(status, isActive) {
            const statusElement = document.getElementById('profileStatus');
            const statusIndicator = document.getElementById('statusIndicator');
            
            let statusText = 'غير محدد';
            let indicatorClass = 'status-inactive';
            
            if (status === 'approved' && isActive) {
                statusText = 'نشط';
                indicatorClass = 'status-active';
            } else if (status === 'pending') {
                statusText = 'في انتظار الموافقة';
                indicatorClass = 'status-pending';
            } else if (status === 'suspended') {
                statusText = 'معلق';
                indicatorClass = 'status-inactive';
            } else if (status === 'rejected') {
                statusText = 'مرفوض';
                indicatorClass = 'status-inactive';
            } else {
                statusText = 'غير نشط';
                indicatorClass = 'status-inactive';
            }
            
            statusElement.textContent = statusText;
            statusIndicator.className = `status-indicator ${indicatorClass}`;
            statusIndicator.title = `حالة المستخدم: ${statusText}`;
        }

        async function loadUserStats(userId) {
            try {
                console.log('Loading user statistics...');
                
                // جلب إحصائيات المستخدم الحقيقية من Firestore
                const statsPromises = [
                    // عدد المستندات المرفوعة
                    authSystem.db.collection('documents')
                        .where('uploadedBy', '==', userId)
                        .get(),
                    
                    // عدد مرات التحميل
                    authSystem.db.collection('downloads')
                        .where('userId', '==', userId)
                        .get(),
                    
                    // عدد الأنشطة
                    authSystem.db.collection('activities')
                        .where('userId', '==', userId)
                        .orderBy('timestamp', 'desc')
                        .limit(100)
                        .get()
                ];
                
                const [documentsSnap, downloadsSnap, activitiesSnap] = await Promise.all(statsPromises);
                
                const stats = {
                    documents: documentsSnap.size,
                    uploads: documentsSnap.size, // Same as documents for now
                    downloads: downloadsSnap.size,
                    activity: activitiesSnap.size
                };
                
                // تحديث العناصر في الواجهة
                document.getElementById('statDocuments').textContent = stats.documents;
                document.getElementById('statUploads').textContent = stats.uploads;
                document.getElementById('statDownloads').textContent = stats.downloads;
                document.getElementById('statActivity').textContent = stats.activity;
                
                // إظهار قسم الإحصائيات
                document.getElementById('userStats').classList.remove('stats-hidden');
                
                console.log('User statistics loaded:', stats);
                
            } catch (error) {
                console.error('Error loading user stats:', error);
                
                // إظهار إحصائيات افتراضية في حال الخطأ
                const defaultStats = {
                    documents: 0,
                    uploads: 0,
                    downloads: 0,
                    activity: 0
                };
                
                document.getElementById('statDocuments').textContent = defaultStats.documents;
                document.getElementById('statUploads').textContent = defaultStats.uploads;
                document.getElementById('statDownloads').textContent = defaultStats.downloads;
                document.getElementById('statActivity').textContent = defaultStats.activity;
                
                // إظهار قسم الإحصائيات حتى لو كانت فارغة
                document.getElementById('userStats').classList.remove('stats-hidden');
            }
        }

            document.getElementById('profileDepartment').textContent = 'غير محدد';
            document.getElementById('profileJoinDate').textContent = 'غير متوفر';
            document.getElementById('profileLastLogin').textContent = 'غير متوفر';

        // دالة مساعدة لإظهار الإشعارات
        function showToast(message, type = 'success') {
            const toastContainer = document.querySelector('.toast-container') || createToastContainer();
            
            const toastId = 'toast_' + Date.now();
            const toastHtml = `
                <div class="toast align-items-center text-white bg-${type} border-0" role="alert" id="${toastId}">
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;
            
            toastContainer.insertAdjacentHTML('beforeend', toastHtml);
            const toastElement = new bootstrap.Toast(document.getElementById(toastId));
            toastElement.show();
            
            // إزالة الإشعار بعد إخفاؤه
            document.getElementById(toastId).addEventListener('hidden.bs.toast', function() {
                this.remove();
            });
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // دالة مساعدة لإظهار محمل الصفحة
        function showLoading(message = 'جاري التحميل...') {
            const loadingHtml = `
                <div class="loading-overlay" id="pageLoader">
                    <div class="loading-content">
                        <div class="spinner-border text-primary mb-3" role="status"></div>
                        <p class="mb-0">${message}</p>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', loadingHtml);
        }

        function hideLoading() {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.remove();
            }
        }
        // Enhanced logout function

        function editProfile() {
            const modal = `
                <div class="modal fade" id="editProfileModal" tabindex="-1">
                    <div class="modal-dialog modal-lg modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">تعديل البيانات الشخصية</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="editProfileForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="editDisplayName" class="form-label">الاسم الكامل</label>

                                        </div>

                                        </div>

                                            <label for="editPhone" class="form-label">رقم الهاتف</label>
                                            <input type="tel" class="form-control" id="editPhone" value="${currentUserData?.phone || ''}">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="editDepartment" class="form-label">الإدارة</label>
                                            <input type="text" class="form-control" id="editDepartment" value="${currentUserData?.departmentName || ''}" readonly>
                                            <div class="form-text">يتم تحديدها من قبل المدير</div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editBio" class="form-label">نبذة شخصية</label>
                                        <textarea class="form-control" id="editBio" rows="3" placeholder="اكتب نبذة مختصرة عن نفسك...">${currentUserData?.bio || ''}</textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editAvatar" class="form-label">الصورة الشخصية</label>
                                        <input type="file" class="form-control" id="editAvatar" accept="image/*">
                                        <div class="form-text">أقصى حجم: 2 ميجابايت. الصيغ المدعومة: JPG, PNG, WebP</div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                                <button type="button" class="btn btn-primary" onclick="saveProfileChanges()">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="saveSpinner"></span>
                                    حفظ التغييرات
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // إضافة المودال إلى الصفحة وعرضه
            document.body.insertAdjacentHTML('beforeend', modal);
            const modalElement = new bootstrap.Modal(document.getElementById('editProfileModal'));
            modalElement.show();
            
            // إزالة المودال بعد الإغلاق
            document.getElementById('editProfileModal').addEventListener('hidden.bs.modal', function () {
                this.remove();
            });
        }

        async function saveProfileChanges() {
            const saveBtn = document.querySelector('#editProfileModal .btn-primary');
            const spinner = document.getElementById('saveSpinner');
            
            try {
                // إظهار محمل
                saveBtn.disabled = true;
                spinner.classList.remove('d-none');
                
                const user = authSystem.getCurrentUser();
                if (!user) {
                    throw new Error('لم يتم العثور على المستخدم');
                }
                
                // جمع البيانات من النموذج
                const updates = {
                    displayName: document.getElementById('editDisplayName').value.trim(),
                    phone: document.getElementById('editPhone').value.trim(),
                    bio: document.getElementById('editBio').value.trim(),
                    updatedAt: new Date()
                };
                
                // رفع الصورة إذا تم اختيارها
                const avatarFile = document.getElementById('editAvatar').files[0];
                if (avatarFile) {
                    // التحقق من حجم الملف
                    if (avatarFile.size > 2 * 1024 * 1024) {
                        throw new Error('حجم الصورة كبير جداً. الحد الأقصى 2 ميجابايت');
                    }
                    
                    // رفع الصورة إلى Firebase Storage
                    const storageRef = authSystem.storage.ref();
                    const avatarRef = storageRef.child(`users/${user.uid}/avatar.jpg`);
                    const snapshot = await avatarRef.put(avatarFile);
                    const downloadURL = await snapshot.ref.getDownloadURL();
                    updates.photoURL = downloadURL;
                    
                    // تحديث صورة المستخدم في Firebase Auth
                    await user.updateProfile({ photoURL: downloadURL });
                }
                
                // تحديث اسم المستخدم في Firebase Auth إذا تغير
                if (updates.displayName && updates.displayName !== user.displayName) {
                    await user.updateProfile({ displayName: updates.displayName });
                }
                
                // تحديث البيانات في Firestore
                await authSystem.db.collection('users').doc(user.uid).update(updates);
                
                // تسجيل النشاط
                if (activityLogger) {
                    await activityLogger.logActivity('profile_update', {
                        action: 'تحديث الملف الشخصي',
                        changes: Object.keys(updates).filter(key => key !== 'updatedAt')
                    });
                }
                
                // إظهار رسالة نجاح
                showToast('تم حفظ التغييرات بنجاح', 'success');
                
                // إغلاق المودال
                bootstrap.Modal.getInstance(document.getElementById('editProfileModal')).hide();
                
                // إعادة تحميل بيانات المستخدم
                await loadUserDetails(user);
                
            } catch (error) {
                console.error('Error saving profile changes:', error);
                showToast(`حدث خطأ في حفظ التغييرات: ${error.message}`, 'danger');
                
                // تسجيل الخطأ
                if (activityLogger) {
                    await activityLogger.logActivity('profile_update_error', {
                        action: 'خطأ في تحديث الملف الشخصي',
                        error: error.message
                    });
                }
            } finally {
                // إخفاء المحمل
                saveBtn.disabled = false;
                spinner.classList.add('d-none');
            }
        }

        async function changePassword() {
            try {
                const user = authSystem.getCurrentUser();
                if (user && user.email) {
                    const confirmed = confirm('سيتم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني. هل تريد المتابعة؟');
                    if (confirmed) {
                        await authSystem.sendPasswordResetEmail(user.email);
                        showToast('تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني', 'success');
                        
                        // Log password reset request using console
                        console.log('Password reset requested for:', user.email);
                    }
                } else {
                    alert('لم يتم العثور على بيانات المستخدم');
                }
            } catch (error) {
                console.error('Error sending password reset email:', error);
                // Log error using console instead of authSystem.logError
                console.error('Password reset error:', { error: error.message });
                showToast('حدث خطأ في إرسال البريد الإلكتروني. يرجى المحاولة مرة أخرى.', 'danger');
            }
        }

        async function viewActivity() {
            try {
                const user = authSystem.getCurrentUser();
                if (!user) {
                    alert('لم يتم العثور على المستخدم');
                    return;
                }
                
                // جلب سجل النشاط من Firestore
                const activitiesQuery = await authSystem.db.collection('activities')
                    .where('userId', '==', user.uid)
                    .orderBy('timestamp', 'desc')
                    .limit(20)
                    .get();
                
                let activitiesHTML = '';
                if (activitiesQuery.empty) {
                    activitiesHTML = `
                        <div class="text-center text-muted">
                            <i class="fas fa-history fa-2x mb-3"></i>
                            <p>لا توجد أنشطة مسجلة حتى الآن</p>
                        </div>
                    `;
                } else {
                    activitiesQuery.forEach(doc => {
                        const activity = doc.data();
                        const timestamp = activity.timestamp?.toDate() || new Date();
                        const timeString = timestamp.toLocaleString('ar-SA');
                        
                        let icon = 'fas fa-circle-notch';
                        let color = 'text-primary';
                        
                        // تحديد الأيقونة واللون حسب نوع النشاط
                        switch (activity.type) {
                            case 'login':
                                icon = 'fas fa-sign-in-alt';
                                color = 'text-success';
                                break;
                            case 'logout':
                                icon = 'fas fa-sign-out-alt';
                                color = 'text-warning';
                                break;
                            case 'upload':
                                icon = 'fas fa-upload';
                                color = 'text-info';
                                break;
                            case 'download':
                                icon = 'fas fa-download';
                                color = 'text-primary';
                                break;
                            case 'profile_update':
                                icon = 'fas fa-user-edit';
                                color = 'text-purple';
                                break;
                            case 'profile_view':
                                icon = 'fas fa-eye';
                                color = 'text-secondary';
                                break;
                            default:
                                icon = 'fas fa-info-circle';
                                color = 'text-muted';
                        }
                        
                        activitiesHTML += `
                            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
                                <div class="d-flex align-items-center">
                                    <i class="${icon} ${color} me-2"></i>
                                    <span>${activity.action || activity.type}</span>
                                </div>
                                <small class="text-muted">${timeString}</small>
                            </div>
                        `;
                    });
                }
                
                const modal = `
                    <div class="modal fade" id="activityModal" tabindex="-1">
                        <div class="modal-dialog modal-lg modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">
                                        <i class="fas fa-history me-2"></i>
                                        سجل النشاط
                                    </h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
                                    ${activitiesHTML}
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                                    <button type="button" class="btn btn-primary" onclick="exportActivity()">
                                        <i class="fas fa-download me-1"></i>
                                        تصدير
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                // إضافة المودال إلى الصفحة وعرضه
                document.body.insertAdjacentHTML('beforeend', modal);
                const modalElement = new bootstrap.Modal(document.getElementById('activityModal'));
                modalElement.show();
                
                // إزالة المودال بعد الإغلاق
                document.getElementById('activityModal').addEventListener('hidden.bs.modal', function () {
                    this.remove();
                });
                
            } catch (error) {
                console.error('Error loading activity log:', error);
                alert('حدث خطأ في تحميل سجل النشاط');
            }
        }

        async function exportActivity() {
            try {
                const user = authSystem.getCurrentUser();
                if (!user) return;
                
                // جلب جميع الأنشطة للتصدير
                const activitiesQuery = await authSystem.db.collection('activities')
                    .where('userId', '==', user.uid)
                    .orderBy('timestamp', 'desc')
                    .get();
                
                let csvContent = 'التاريخ,النوع,الوصف,التفاصيل\n';
                
                activitiesQuery.forEach(doc => {
                    const activity = doc.data();
                    const timestamp = activity.timestamp?.toDate() || new Date();
                    const dateString = timestamp.toLocaleString('ar-SA');
                    
                    csvContent += `"${dateString}","${activity.type || ''}","${activity.action || ''}","${JSON.stringify(activity.details || {})}"\n`;
                });
                
                // إنشاء ملف وتنزيله
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `activity_log_${user.uid}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
                
                // تسجيل نشاط التصدير
                if (activityLogger) {
                    await activityLogger.logActivity('activity_export', {
                        action: 'تصدير سجل النشاط',
                        recordCount: activitiesQuery.size
                    });
                }
                
            } catch (error) {
                console.error('Error exporting activity:', error);
                alert('حدث خطأ في تصدير سجل النشاط');
            }
        }

        async function refreshProfile() {
            try {
                const refreshBtn = document.querySelector('[onclick="refreshProfile()"]');
                const originalContent = refreshBtn.innerHTML;
                
                // إظهار محمل
                refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>جاري التحديث...';
                refreshBtn.disabled = true;
                
                const user = authSystem.getCurrentUser();
                if (user) {
                    await loadUserDetails(user);
                    
                    // تسجيل النشاط
                    if (activityLogger) {
                        await activityLogger.logActivity('profile_refresh', {
                            action: 'تحديث بيانات الملف الشخصي',
                            timestamp: new Date()
                        });
                    }
                    
                    // إظهار رسالة نجاح مؤقتة
                    refreshBtn.innerHTML = '<i class="fas fa-check me-2"></i>تم التحديث';
                    refreshBtn.classList.remove('btn-outline-custom');
                    refreshBtn.classList.add('btn-success');
                    
                    setTimeout(() => {
                        refreshBtn.innerHTML = originalContent;
                        refreshBtn.classList.remove('btn-success');
                        refreshBtn.classList.add('btn-outline-custom');
                        refreshBtn.disabled = false;
                    }, 2000);
                }
            } catch (error) {
                console.error('Error refreshing profile:', error);
                const refreshBtn = document.querySelector('[onclick="refreshProfile()"]');
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt me-2"></i>تحديث البيانات';
                refreshBtn.disabled = false;
                alert('حدث خطأ في تحديث البيانات');
            }
        }
