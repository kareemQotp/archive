<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - نظام الأرشيف</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- تطبيق الألوان الجديدة -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Permission-based styling system -->
    <link rel="stylesheet" href="assets/css/permissions.css">
    
    <style>
        /* Reset password page specific styles */
        body {
            background: linear-gradient(135deg, 
                var(--primary) 0%,
                var(--ocean-deep) 25%,
                var(--secondary) 50%,
                var(--ocean-medium) 75%,
                var(--accent) 100%
            );
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .auth-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--ocean-deep), var(--accent));
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--ocean-deep));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: white;
            box-shadow: 0 8px 25px rgba(0, 180, 216, 0.3);
        }

        .auth-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }

        .form-floating {
            margin-bottom: 1.5rem;
        }

        .form-control {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(0, 180, 216, 0.25);
            background: white;
        }

        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--ocean-deep));
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 180, 216, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            border-radius: 12px;
            border: none;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .alert-success {
            background: linear-gradient(135deg, var(--ocean-light), var(--wave-foam));
            color: var(--ocean-deep);
            border-left: 4px solid var(--primary);
        }

        .alert-danger {
            background: linear-gradient(135deg, #fee2e2, #fef2f2);
            color: #dc2626;
            border-left: 4px solid #ef4444;
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .password-strength-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin: 0.5rem 0;
        }

        .password-strength-fill {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak { background: #ef4444; width: 25%; }
        .strength-fair { background: #f59e0b; width: 50%; }
        .strength-good { background: #10b981; width: 75%; }
        .strength-strong { background: #059669; width: 100%; }

        .password-requirements {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        .requirement {
            display: flex;
            align-items: center;
            margin-bottom: 0.25rem;
            transition: all 0.3s ease;
        }

        .requirement i {
            width: 16px;
            margin-left: 0.5rem;
            font-size: 0.75rem;
        }

        .requirement.met {
            color: #10b981;
        }

        .requirement.met i {
            color: #10b981;
        }

        .text-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .text-link:hover {
            color: var(--ocean-deep);
            text-decoration: underline;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .auth-box {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            .auth-title {
                font-size: 1.5rem;
            }
        }

        /* Animation for form appearance */
        .auth-box {
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2 class="auth-title">إعادة تعيين كلمة المرور</h2>
                <p class="auth-subtitle">
                    أدخل كلمة المرور الجديدة الخاصة بك
                </p>
            </div>

            <!-- Alert Messages -->
            <div id="alertContainer"></div>

            <!-- Reset Form -->
            <form id="resetForm">
                <div class="form-floating">
                    <input type="password" class="form-control" id="newPassword" placeholder="كلمة المرور الجديدة" required>
                    <label for="newPassword">
                        <i class="fas fa-lock me-2"></i>
                        كلمة المرور الجديدة
                    </label>
                </div>

                <!-- Password Strength Indicator -->
                <div class="password-strength">
                    <div class="password-strength-bar">
                        <div class="password-strength-fill" id="strengthFill"></div>
                    </div>
                    <div id="strengthText">قوة كلمة المرور: <span id="strengthLevel">ضعيفة</span></div>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
                    <label for="confirmPassword">
                        <i class="fas fa-check-circle me-2"></i>
                        تأكيد كلمة المرور
                    </label>
                </div>

                <!-- Password Requirements -->
                <div class="password-requirements">
                    <div class="mb-2"><strong>متطلبات كلمة المرور:</strong></div>
                    <div class="requirement" data-requirement="length">
                        <i class="fas fa-times"></i>
                        على الأقل 8 أحرف
                    </div>
                    <div class="requirement" data-requirement="uppercase">
                        <i class="fas fa-times"></i>
                        حرف كبير واحد على الأقل
                    </div>
                    <div class="requirement" data-requirement="lowercase">
                        <i class="fas fa-times"></i>
                        حرف صغير واحد على الأقل
                    </div>
                    <div class="requirement" data-requirement="number">
                        <i class="fas fa-times"></i>
                        رقم واحد على الأقل
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-3" id="resetButton" disabled>
                    <span class="button-text">
                        <i class="fas fa-save me-2"></i>
                        حفظ كلمة المرور الجديدة
                    </span>
                    <span class="loading-text d-none">
                        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                        جاري الحفظ...
                    </span>
                </button>
            </form>

            <!-- Footer Links -->
            <div class="text-center mt-4">
                <a href="login.html" class="text-link">
                    <i class="fas fa-arrow-right me-1"></i>
                    العودة لتسجيل الدخول
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase v10.7.1 - الإصدار الموحد -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-init.js"></script>
    
    <!-- Unified Authentication System -->
    <script src="assets/js/ui-permission-controller.js"></script>
    <script src="assets/js/unified-auth.js"></script>

    <script>
        // Initialize unified auth system
        let authSystem;

        document.addEventListener('DOMContentLoaded', async function() {
            // Wait for unified auth to initialize
            await new Promise(resolve => {
                const checkAuth = () => {
                    if (window.unifiedAuth && unifiedAuth.isInitialized) {
                        authSystem = unifiedAuth;
                        resolve();
                    } else {
                        setTimeout(checkAuth, 100);
                    }
                };
                checkAuth();
            });

            // Check if user is already logged in
            if (authSystem.isAuthenticated) {
                window.location.href = 'dashboard.html';
                return;
            }

            // Initialize reset password functionality
            initializeResetPassword();
        });

        // Elements
        const resetForm = document.getElementById('resetForm');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const resetButton = document.getElementById('resetButton');
        const alertContainer = document.getElementById('alertContainer');
        const strengthFill = document.getElementById('strengthFill');
        const strengthLevel = document.getElementById('strengthLevel');

        let actionCode = '';

        // Initialize reset password functionality
        function initializeResetPassword() {
            // Get action code from URL
            const urlParams = new URLSearchParams(window.location.search);
            actionCode = urlParams.get('oobCode');
            
            if (!actionCode) {
                showAlert('رابط إعادة التعيين غير صالح أو منتهي الصلاحية', 'danger');
                resetButton.disabled = true;
                return;
            }

            // Verify the action code
            verifyActionCode(actionCode);
        }

        // Verify action code - Enhanced with unified auth
        async function verifyActionCode(code) {
            try {
                await auth.verifyPasswordResetCode(code);
                console.log('✅ رمز إعادة التعيين صالح');
            } catch (error) {
                console.error('❌ رمز إعادة التعيين غير صالح:', error);
                
                let errorMessage = 'رابط إعادة التعيين غير صالح أو منتهي الصلاحية';
                
                switch (error.code) {
                    case 'auth/invalid-action-code':
                        errorMessage = 'رابط إعادة التعيين غير صالح';
                        break;
                    case 'auth/expired-action-code':
                        errorMessage = 'رابط إعادة التعيين منتهي الصلاحية';
                        break;
                }
                
                showAlert(errorMessage, 'danger');
                resetButton.disabled = true;
            }
        }

        // Password strength checker
        newPasswordInput.addEventListener('input', () => {
            const password = newPasswordInput.value;
            checkPasswordStrength(password);
            validateForm();
        });

        confirmPasswordInput.addEventListener('input', validateForm);

        // Check password strength
        function checkPasswordStrength(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /\d/.test(password)
            };

            // Update requirements display
            Object.keys(requirements).forEach(req => {
                const element = document.querySelector(`[data-requirement="${req}"]`);
                const icon = element.querySelector('i');
                
                if (requirements[req]) {
                    element.classList.add('met');
                    icon.className = 'fas fa-check';
                } else {
                    element.classList.remove('met');
                    icon.className = 'fas fa-times';
                }
            });

            // Calculate strength
            const metCount = Object.values(requirements).filter(Boolean).length;
            let strength, strengthText;

            if (metCount === 0 || password.length === 0) {
                strength = '';
                strengthText = '';
            } else if (metCount === 1) {
                strength = 'strength-weak';
                strengthText = 'ضعيفة';
            } else if (metCount === 2) {
                strength = 'strength-fair';
                strengthText = 'متوسطة';
            } else if (metCount === 3) {
                strength = 'strength-good';
                strengthText = 'جيدة';
            } else {
                strength = 'strength-strong';
                strengthText = 'قوية';
            }

            // Update strength indicator
            strengthFill.className = `password-strength-fill ${strength}`;
            strengthLevel.textContent = strengthText;

            return metCount === 4;
        }

        // Validate form
        function validateForm() {
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const isStrongPassword = checkPasswordStrength(newPassword);
            const passwordsMatch = newPassword === confirmPassword && newPassword.length > 0;

            resetButton.disabled = !isStrongPassword || !passwordsMatch || !actionCode;

            // Show password match indicator
            if (confirmPassword.length > 0) {
                if (passwordsMatch) {
                    confirmPasswordInput.classList.remove('is-invalid');
                    confirmPasswordInput.classList.add('is-valid');
                } else {
                    confirmPasswordInput.classList.remove('is-valid');
                    confirmPasswordInput.classList.add('is-invalid');
                }
            } else {
                confirmPasswordInput.classList.remove('is-valid', 'is-invalid');
            }
        }

        // Form submission
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = newPasswordInput.value;
            
            if (!actionCode) {
                showAlert('رابط إعادة التعيين غير صالح', 'danger');
                return;
            }

            await resetPassword(actionCode, newPassword);
        });

        // Reset password - Enhanced with unified auth
        async function resetPassword(code, newPassword) {
            try {
                showLoading(true);
                clearAlerts();

                // Use unified auth system for password reset confirmation
                await authSystem.confirmPasswordReset(code, newPassword);
                
                showAlert('تم تغيير كلمة المرور بنجاح! سيتم توجيهك لصفحة تسجيل الدخول...', 'success');
                
                console.log('✅ تم تغيير كلمة المرور بنجاح');

                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'login.html?message=password-reset-success';
                }, 3000);

            } catch (error) {
                console.error('❌ خطأ في تغيير كلمة المرور:', error);
                
                let errorMessage = 'حدث خطأ في تغيير كلمة المرور. يرجى المحاولة مرة أخرى.';
                
                // Enhanced error handling
                if (error.message && error.message.includes('رابط غير صالح')) {
                    errorMessage = 'رابط إعادة التعيين غير صالح أو منتهي الصلاحية';
                } else {
                    switch (error.code) {
                        case 'auth/invalid-action-code':
                            errorMessage = 'رابط إعادة التعيين غير صالح';
                            break;
                        case 'auth/expired-action-code':
                            errorMessage = 'رابط إعادة التعيين منتهي الصلاحية';
                            break;
                        case 'auth/weak-password':
                            errorMessage = 'كلمة المرور ضعيفة. يرجى اختيار كلمة مرور أقوى';
                            break;
                        default:
                            errorMessage = error.message || 'حدث خطأ غير متوقع';
                    }
                }
                
                showAlert(errorMessage, 'danger');
            } finally {
                showLoading(false);
            }
        }

        // Show loading state
        function showLoading(show) {
            if (show) {
                resetButton.disabled = true;
                resetButton.querySelector('.button-text').classList.add('d-none');
                resetButton.querySelector('.loading-text').classList.remove('d-none');
            } else {
                resetButton.querySelector('.button-text').classList.remove('d-none');
                resetButton.querySelector('.loading-text').classList.add('d-none');
                validateForm(); // Re-enable if valid
            }
        }

        // Show alert message
        function showAlert(message, type = 'info') {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'} me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            alertContainer.innerHTML = alertHtml;
            
            // Auto dismiss after 5 seconds for non-error messages
            if (type !== 'danger') {
                setTimeout(() => {
                    const alert = alertContainer.querySelector('.alert');
                    if (alert) {
                        const bsAlert = new bootstrap.Alert(alert);
                        bsAlert.close();
                    }
                }, 5000);
            }
        }

        // Clear alerts
        function clearAlerts() {
            alertContainer.innerHTML = '';
        }

        // Monitor auth state changes
        auth.onAuthStateChanged((user) => {
            if (user && !actionCode) {
                // User is already signed in and not resetting password
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
