<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقارير حركة الملفات - نظام الأرشيف</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/unified-sidebar.css">
    <link rel="stylesheet" href="assets/css/permissions.css">
    <link rel="stylesheet" href="assets/css/movement-reports.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/ux-core.css">
    <link rel="stylesheet" href="assets/css/global-search.css">
    <script defer src="assets/js/format-utils.js"></script>
    <script defer src="assets/js/ux-core.js"></script>
</head>
<body>
    <a href="#mainContent" class="skip-link visually-hidden-focusable">تخطي إلى المحتوى الرئيسي</a>
    <!-- Unified navbar/sidebar are injected by unified-ui-template.js -->

    <main class="main-content" role="main" aria-label="تقارير حركة الملفات" id="mainContent" tabindex="-1">
        <div class="container py-3">
        <!-- Page Header -->
    <div class="mr-page-header mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="mr-title mb-2">تقارير حركة الملفات <span class="visually-hidden">لوحة تحليل</span></h1>
                    <p class="text-muted mb-0">إحصائيات وتقارير شاملة لحركة الملفات بين الأقسام</p>
                </div>
                <button class="btn btn-primary" data-mr-action="export" data-mr-loading aria-label="تصدير التقرير بصيغة CSV">
                    <i class="fas fa-download me-2"></i>
                    تصدير التقرير
                </button>
                <button class="btn btn-secondary" type="button" onclick="window.toggleGlobalSearch && window.toggleGlobalSearch()" aria-label="البحث السريع (Ctrl+K)"><i class="fas fa-search"></i> بحث (Ctrl+K)</button>
            </div>
        </div>

        <!-- Statistics Cards -->
    <div class="mr-stats-grid mb-4">
            <div class="mr-stats-card"><div class="mr-stats-number primary" id="totalMovements">-</div><div class="text-muted">إجمالي الحركات</div></div>
            <div class="mr-stats-card"><div class="mr-stats-number success" id="completedMovements">-</div><div class="text-muted">حركات مكتملة</div></div>
            <div class="mr-stats-card"><div class="mr-stats-number warning" id="pendingMovements">-</div><div class="text-muted">حركات معلقة</div></div>
            <div class="mr-stats-card"><div class="mr-stats-number danger" id="activeFiles">-</div><div class="text-muted">ملفات نشطة</div></div>
        </div>

        <!-- Department Activity Chart -->
    <div class="mr-card mb-4">
            <h5 class="mb-3">
                <i class="fas fa-chart-bar me-2"></i>
                نشاط الأقسام
            </h5>
            <div class="department-chart" id="departmentChart">
                <!-- سيتم ملؤها بـ JavaScript -->
            </div>
        </div>

        <!-- Filter Controls -->
    <div class="mr-card mr-filters mb-4">
            <h5 class="mb-3">
                <i class="fas fa-filter me-2"></i>
                فلترة التقارير
            </h5>
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">من تاريخ</label>
                    <input type="date" class="form-control" id="fromDate" title="تاريخ البداية">
                </div>
                <div class="col-md-3">
                    <label class="form-label">إلى تاريخ</label>
                    <input type="date" class="form-control" id="toDate" title="تاريخ النهاية">
                </div>
                <div class="col-md-3">
                    <label class="form-label">القسم</label>
                    <select class="form-control" id="departmentReport" title="اختر القسم">
                        <option value="">جميع الأقسام</option>
                        <option value="archive">الأرشيف</option>
                        <option value="legal">الشؤون القانونية</option>
                        <option value="governance">الحوكمة والامتثال</option>
                        <option value="collection">إدارة التحصيل</option>
                        <option value="securitization">إدارة التوريق</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary w-100" data-mr-action="generate" data-mr-loading>
                        <i class="fas fa-chart-line me-2"></i>
                        إنشاء التقرير
                    </button>
                </div>
            </div>
        </div>

        <!-- Recent Movements Table -->
    <div class="mr-card mb-4">
            <h5 class="mb-3">
                <i class="fas fa-list me-2"></i>
                الحركات الأخيرة
            </h5>
            <div class="movement-table-wrapper table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>رقم الملف</th>
                            <th>اسم الملف</th>
                            <th>من</th>
                            <th>إلى</th>
                            <th>المستخدم</th>
                            <th>التاريخ</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="movementsTableBody">
                        <!-- سيتم ملؤها بـ JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
        </div>
    </main>

    <!-- Loader & Module Stack -->
    <script src="assets/js/core-loader.js" defer></script>
    <script src="assets/js/module-manifest.json" type="application/json" id="module-manifest"></script>
    <script src="assets/js/performance-metrics.js" defer></script>
    <script src="assets/js/notify-adapter.js" defer></script>
    <script src="assets/js/lazy-loader.js" defer></script>
    <script src="assets/js/page-bootstrap.js" defer></script>
    
    <!-- Firebase v10.7.1 (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- Firebase Configuration & Initialization -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-init.js"></script>

    <!-- Unified Auth/Permissions (for consistent access control) -->
    <!-- ui-permission-controller is auto-loaded via module-manifest; avoid duplicate inclusion -->
    <script src="assets/js/unified-auth.js"></script>
        <!-- Early guard tuning: increase wait time before any redirect & mark page to defer access guard -->
        <script>
            try {
                const params = new URLSearchParams(window.location.search);
                const isLocalSmoke = params.has('smoke') && (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost');
                if (isLocalSmoke) {
                    window.__ALLOW_GUEST_ACCESS__ = true;
                }
            } catch (_) {}
            // Increase guard delay (ms) to prevent premature session-expired redirect on slower connections
            window.__ACCESS_GUARD_DELAY_MS__ = 6000;
            // Flag to let unified UI know to hold off enforcing guard immediately (optional future use)
            window.__DELAY_PAGE_GUARD__ = true;
            // If unifiedAuth fires ready earlier, we clear the delay flag so guard can proceed
            window.addEventListener('firebaseAuthReady', ()=> { setTimeout(()=>{ delete window.__DELAY_PAGE_GUARD__; }, 250); }, { once:true });
        </script>
    <!-- movement-reports-page.js will be auto-loaded via manifest (feature stage) -->
    <script src="assets/js/unified-ui-template.js" defer></script>
</body>
</html>
