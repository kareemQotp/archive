<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار نظام الأدوار</title>
    
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/unified-sidebar.css">
    
    <style>
        * {
            font-family: 'Cairo', 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .role-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .role-card.active {
            border-color: #667eea;
            transform: translateY(-5px);
        }

        .role-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            margin: 0 auto 1rem;
        }

        .permission-badge {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.2);
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            margin: 0.25rem;
            display: inline-block;
        }

        .feature-badge {
            background: rgba(240, 147, 251, 0.1);
            color: #f093fb;
            border: 1px solid rgba(240, 147, 251, 0.2);
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            margin: 0.25rem;
            display: inline-block;
        }

        .sidebar-preview {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
    <script defer src="assets/js/format-utils.js"></script>
    <script defer src="assets/js/ux-core.js"></script>
    <link rel="stylesheet" href="assets/css/archive-design-system.css">
</head>
<body>
    <a href="#mainContent" class="skip-link visually-hidden-focusable">تخطي إلى المحتوى الرئيسي</a>
    

    <div class="container py-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">
                <i class="fas fa-users-cog me-2"></i>
                نظام إدارة الأدوار والصلاحيات
            </h2>
            
            <!-- اختيار الدور -->
            <div class="mb-4">
                <h4 class="mb-3">اختر دور للاختبار:</h4>
                <div class="row" id="rolesContainer">
                    <!-- سيتم ملؤها بـ JavaScript -->
                </div>
            </div>

            <!-- معلومات الدور المحدد -->
            <div id="roleDetails" class="d-none">
                <h4 class="mb-3">تفاصيل الدور:</h4>
                <div class="row">
                    <div class="col-md-6">
                        <div class="test-area">
                            <h5><i class="fas fa-key me-2"></i>الصلاحيات:</h5>
                            <div id="permissionsList"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="test-area">
                            <h5><i class="fas fa-star me-2"></i>الميزات:</h5>
                            <div id="featuresList"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- اختبار الدوال -->
            <div class="test-area mt-4">
                <h4><i class="fas fa-flask me-2"></i>اختبار دوال النظام:</h4>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">اختبار الصلاحية:</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="permissionTest" placeholder="مثال: manage_users">
                            <button class="btn btn-primary" onclick="testPermission()">اختبار</button>
                        </div>
                        <div id="permissionResult" class="mt-2"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">اختبار الميزة:</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="featureTest" placeholder="مثال: dashboard">
                            <button class="btn btn-primary" onclick="testFeature()">اختبار</button>
                        </div>
                        <div id="featureResult" class="mt-2"></div>
                    </div>
                </div>
            </div>

            <!-- عرض القائمة الجانبية التجريبية -->
            <div class="test-area mt-4">
                <h4><i class="fas fa-bars me-2"></i>معاينة القائمة الجانبية:</h4>
                <button class="btn btn-success mb-3" onclick="updateSidebarPreview()">
                    <i class="fas fa-sync me-2"></i>تحديث القائمة
                </button>
                <div id="sidebarPreview" class="border rounded p-3 bg-light sidebar-preview">
                    <!-- سيتم ملؤها بـ JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/roles.js"></script>
    
    
    <script>
    let selectedRole = null;
    let sidebarManager = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadRoles();
            // Legacy SidebarManager may not be present; guard usage
            if (window.SidebarManager) {
                sidebarManager = new SidebarManager();
            } else {
                console.info('SidebarManager not present; using Unified UI only.');
            }
        });

        function loadRoles() {
            const container = document.getElementById('rolesContainer');
            const roles = getAllRoles();
            
            container.innerHTML = roles.map(role => `
                <div class="col-md-4 mb-3">
                    <div class="card role-card h-100" onclick="selectRole('${role.key}')">
                        <div class="card-body text-center">
                            <div class="role-icon" style="background-color: ${role.color}">
                                <i class="${role.icon}"></i>
                            </div>
                            <h6 class="card-title">${role.name}</h6>
                            <p class="card-text small text-muted">${role.nameEn}</p>
                            <p class="card-text" style="font-size: 0.8rem">${role.description}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectRole(roleKey) {
            selectedRole = roleKey;
            
            // تحديث التصميم
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // عرض تفاصيل الدور
            showRoleDetails(roleKey);
            
            // تحديث القائمة الجانبية
            updateSidebarPreview();
        }

        function showRoleDetails(roleKey) {
            const roleInfo = getRoleInfo(roleKey);
            const detailsDiv = document.getElementById('roleDetails');
            const permissionsList = document.getElementById('permissionsList');
            const featuresList = document.getElementById('featuresList');
            
            detailsDiv.classList.remove('d-none');
            
            permissionsList.innerHTML = roleInfo.permissions.map(permission => 
                `<span class="permission-badge">${permission}</span>`
            ).join('');
            
            featuresList.innerHTML = roleInfo.features.map(feature => 
                `<span class="feature-badge">${feature}</span>`
            ).join('');
        }

        function testPermission() {
            const permission = document.getElementById('permissionTest').value;
            const result = document.getElementById('permissionResult');
            
            if (!selectedRole) {
                result.innerHTML = '<div class="alert alert-warning">يرجى اختيار دور أولاً</div>';
                return;
            }
            
            if (!permission) {
                result.innerHTML = '<div class="alert alert-warning">يرجى إدخال صلاحية للاختبار</div>';
                return;
            }
            
            const hasAccess = hasPermission(selectedRole, permission);
            const roleInfo = getRoleInfo(selectedRole);
            
            result.innerHTML = `
                <div class="alert alert-${hasAccess ? 'success' : 'danger'}">
                    <i class="fas fa-${hasAccess ? 'check' : 'times'} me-2"></i>
                    الدور "${roleInfo.name}" ${hasAccess ? 'يملك' : 'لا يملك'} صلاحية "${permission}"
                </div>
            `;
        }

        function testFeature() {
            const feature = document.getElementById('featureTest').value;
            const result = document.getElementById('featureResult');
            
            if (!selectedRole) {
                result.innerHTML = '<div class="alert alert-warning">يرجى اختيار دور أولاً</div>';
                return;
            }
            
            if (!feature) {
                result.innerHTML = '<div class="alert alert-warning">يرجى إدخال ميزة للاختبار</div>';
                return;
            }
            
            const hasAccess = hasFeature(selectedRole, feature);
            const roleInfo = getRoleInfo(selectedRole);
            
            result.innerHTML = `
                <div class="alert alert-${hasAccess ? 'success' : 'danger'}">
                    <i class="fas fa-${hasAccess ? 'check' : 'times'} me-2"></i>
                    الدور "${roleInfo.name}" ${hasAccess ? 'يملك' : 'لا يملك'} ميزة "${feature}"
                </div>
            `;
        }

        function updateSidebarPreview() {
            if (!selectedRole) {
                document.getElementById('sidebarPreview').innerHTML = 
                    '<div class="alert alert-info">يرجى اختيار دور لمعاينة القائمة الجانبية</div>';
                return;
            }

            if (sidebarManager) {
                // إنشاء عنصر مؤقت للمعاينة
                const tempNav = document.createElement('ul');
                tempNav.className = 'sidebar-nav';
                tempNav.id = 'tempSidebarNav';
                
                // حفظ المرجع الأصلي
                const originalNav = sidebarManager.sidebarNav;
                sidebarManager.sidebarNav = tempNav;
                
                // تحديث القائمة
                sidebarManager.updateSidebarNav(true, selectedRole);
                
                // عرض النتيجة
                document.getElementById('sidebarPreview').innerHTML = tempNav.innerHTML;
                
                // استعادة المرجع الأصلي
                sidebarManager.sidebarNav = originalNav;
            }
        }
    </script>
    <script src="assets/js/unified-ui-template.js"></script>
</body>
</html>
